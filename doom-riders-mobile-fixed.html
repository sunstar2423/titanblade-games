<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.5, user-scalable=yes, shrink-to-fit=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Doom Riders - Mobile Fixed - TitanBlade Games</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: auto;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch;
        }

        #game-container {
            border: 3px solid #444;
            border-radius: 10px;
            overflow: visible;
            margin: 20px;
            position: relative;
            background: #000;
        }

        .ui-element {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            margin-bottom: 5px;
            font-weight: bold;
            pointer-events: auto;
        }

        #score {
            float: left;
        }

        #speed {
            float: right;
        }

        #money {
            clear: both;
            float: left;
            color: #00FF00;
        }

        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }

        /* Enhanced Mobile Touch Controls */
        .mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 120px;
            z-index: 10000;
            pointer-events: none;
        }

        .touch-button {
            position: absolute;
            border: 3px solid #fff;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            cursor: pointer;
        }

        .touch-button:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        .left-button {
            left: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
        }

        .right-button {
            left: 100px;
            bottom: 20px;
            width: 60px;
            height: 60px;
        }

        .jump-button {
            right: 120px;
            bottom: 20px;
            width: 70px;
            height: 70px;
            font-size: 20px;
        }

        .attack-button {
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
        }

        .weapon-button {
            right: 70px;
            top: 20px;
            width: 50px;
            height: 50px;
            font-size: 14px;
        }

        .boost-button {
            right: 20px;
            top: 80px;
            width: 60px;
            height: 60px;
            font-size: 18px;
            background: rgba(255, 69, 0, 0.3);
            border-color: #FF4500;
        }

        .boost-button:active {
            background: rgba(255, 69, 0, 0.7);
        }

        .pause-button {
            left: 20px;
            top: 20px;
            width: 50px;
            height: 50px;
            font-size: 14px;
        }

        /* Mobile-specific touch handling */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                touch-action: pan-x pan-y pinch-zoom;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
            }

            #game-container {
                touch-action: pan-x pan-y pinch-zoom;
                overflow: auto;
                border: 1px solid #444;
                margin: 5px;
                max-width: 100vw;
                max-height: 100vh;
            }

            .mobile-controls {
                display: block;
            }
        }

        @media (min-width: 769px) {
            .mobile-controls {
                display: none;
            }
        }

        /* Debug info */
        #debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 10001;
            max-width: 200px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay" class="clearfix">
            <div id="score" class="ui-element">Score: 0</div>
            <div id="speed" class="ui-element">Speed: 0</div>
            <div id="money" class="ui-element">Money: $0</div>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="mobile-controls">
        <div class="touch-button left-button" id="mobile-left">←</div>
        <div class="touch-button right-button" id="mobile-right">→</div>
        <div class="touch-button jump-button" id="mobile-jump">JUMP</div>
        <div class="touch-button attack-button" id="mobile-attack">⚡</div>
        <div class="touch-button weapon-button" id="mobile-weapon">🔫</div>
        <div class="touch-button boost-button" id="mobile-boost">🚀</div>
        <div class="touch-button pause-button" id="mobile-pause">⏸️</div>
    </div>

    <div id="debug-info" style="display: none;">
        <div>Touch Events: <span id="touch-events">0</span></div>
        <div>Active Touches: <span id="active-touches">0</span></div>
        <div>Last Button: <span id="last-button">none</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <!-- Enhanced Mobile touch gesture handling -->
    <script>
        // Global mobile touch state
        window.mobileControlsState = {
            left: false,
            right: false,
            jump: false,
            attack: false,
            weapon: false,
            boost: false,
            pause: false
        };

        let touchEventCount = 0;
        let activeTouches = 0;

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎮 Mobile Controls: DOM loaded, setting up enhanced touch controls');

            function setupMobileControls() {
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                                (window.innerWidth < 768);

                console.log('🎮 Mobile Controls: Is mobile device?', isMobile);
                console.log('🎮 Mobile Controls: Screen width:', window.innerWidth);

                if (isMobile) {
                    document.getElementById('debug-info').style.display = 'block';
                }

                // Setup touch events for each button
                const buttons = {
                    'mobile-left': 'left',
                    'mobile-right': 'right',
                    'mobile-jump': 'jump',
                    'mobile-attack': 'attack',
                    'mobile-weapon': 'weapon',
                    'mobile-boost': 'boost',
                    'mobile-pause': 'pause'
                };

                Object.keys(buttons).forEach(buttonId => {
                    const button = document.getElementById(buttonId);
                    const action = buttons[buttonId];

                    if (button) {
                        console.log(`🎮 Mobile Controls: Setting up button ${buttonId} for action ${action}`);

                        // Prevent default touch behavior
                        button.addEventListener('touchstart', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            touchEventCount++;
                            activeTouches++;

                            console.log(`🎮 Touch START: ${action}`);
                            window.mobileControlsState[action] = true;
                            document.getElementById('touch-events').textContent = touchEventCount;
                            document.getElementById('active-touches').textContent = activeTouches;
                            document.getElementById('last-button').textContent = action;

                            // Visual feedback
                            button.style.background = 'rgba(255, 255, 255, 0.6)';
                            button.style.transform = 'scale(0.95)';

                            // Handle immediate actions
                            if (action === 'jump' || action === 'attack' || action === 'weapon' || action === 'pause') {
                                console.log(`🎮 Immediate action: ${action}`);
                                // These will be handled by the game via the global state
                                // Fire a custom event for immediate actions
                                window.dispatchEvent(new CustomEvent('mobileAction', {
                                    detail: { action: action, type: 'press' }
                                }));
                            }
                        }, { passive: false });

                        button.addEventListener('touchend', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            activeTouches = Math.max(0, activeTouches - 1);

                            console.log(`🎮 Touch END: ${action}`);
                            window.mobileControlsState[action] = false;
                            document.getElementById('active-touches').textContent = activeTouches;

                            // Reset visual feedback
                            button.style.background = 'rgba(255, 255, 255, 0.2)';
                            button.style.transform = 'scale(1)';

                            window.dispatchEvent(new CustomEvent('mobileAction', {
                                detail: { action: action, type: 'release' }
                            }));
                        }, { passive: false });

                        button.addEventListener('touchcancel', function(e) {
                            e.preventDefault();
                            activeTouches = Math.max(0, activeTouches - 1);

                            console.log(`🎮 Touch CANCEL: ${action}`);
                            window.mobileControlsState[action] = false;
                            document.getElementById('active-touches').textContent = activeTouches;

                            // Reset visual feedback
                            button.style.background = 'rgba(255, 255, 255, 0.2)';
                            button.style.transform = 'scale(1)';
                        }, { passive: false });

                        // Also handle mouse events for desktop testing
                        button.addEventListener('mousedown', function(e) {
                            window.mobileControlsState[action] = true;
                            button.style.background = 'rgba(255, 255, 255, 0.6)';

                            if (action === 'jump' || action === 'attack' || action === 'weapon' || action === 'pause') {
                                window.dispatchEvent(new CustomEvent('mobileAction', {
                                    detail: { action: action, type: 'press' }
                                }));
                            }
                        });

                        button.addEventListener('mouseup', function(e) {
                            window.mobileControlsState[action] = false;
                            button.style.background = 'rgba(255, 255, 255, 0.2)';
                        });
                    }
                });

                // Ensure canvas and game container have proper touch handling
                const elements = ['body', '#game-container', 'canvas'];
                elements.forEach(selector => {
                    const el = document.querySelector(selector);
                    if (el) {
                        el.style.touchAction = 'auto';
                        el.style.pointerEvents = 'auto';
                        el.style.webkitTouchCallout = 'default';
                        el.style.webkitUserSelect = 'auto';
                    }
                });

                // Watch for canvas creation
                const observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.addedNodes) {
                            mutation.addedNodes.forEach(function(node) {
                                if (node.tagName === 'CANVAS') {
                                    node.style.touchAction = 'auto';
                                    node.style.pointerEvents = 'auto';
                                    console.log('🎮 Mobile Controls: Canvas configured for mobile touch');
                                }
                            });
                        }
                    });
                });

                observer.observe(document.body, {
                    childList: true,
                    subtree: true
                });
            }

            setupMobileControls();
            setTimeout(setupMobileControls, 1000);
            setTimeout(setupMobileControls, 3000);
        });
    </script>

    <script type="module" src="js/Game.js"></script>
</body>
</html>
