<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Farmers - Titan Blade Games</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; user-select:none; }
#c { display:block; width:100vw; height:100vh; }
#ui { position:fixed; top:0; left:0; right:0; bottom:0; pointer-events:none; }

/* HUD */
#hud { position:absolute; top:12px; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:0 20px; }
.hud-block { background:rgba(0,0,0,0.65); border:2px solid #555; border-radius:10px; padding:6px 14px; color:#fff; font-size:14px; display:flex; align-items:center; gap:8px; }
#hp-bar-wrap { width:180px; height:14px; background:#333; border-radius:7px; overflow:hidden; }
#hp-bar { height:100%; background:#4CAF50; border-radius:7px; transition:width 0.2s; }

/* Hotbar */
#hotbar { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; pointer-events:all; }
.hotslot { width:72px; height:72px; background:rgba(0,0,0,0.7); border:2px solid #555; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; }
.hotslot.active { border-color:#FFD700; background:rgba(255,215,0,0.15); }
.hotslot .sk { position:absolute; top:3px; left:6px; font-size:11px; color:#888; }
.hotslot .se { font-size:30px; }
.hotslot .sn { font-size:9px; color:#ccc; margin-top:1px; text-align:center; }

/* Side buttons */
#side-panel { position:absolute; right:10px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; pointer-events:all; }
.side-btn { width:52px; height:52px; background:rgba(0,0,0,0.7); border:2px solid #555; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:22px; }
.side-btn:hover { border-color:#4CAF50; }

/* Shop overlay */
#shop-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.82); display:none; align-items:center; justify-content:center; pointer-events:all; z-index:10; }
#shop-overlay.show { display:flex; }
#shop-box { background:#1a2a1a; border:3px solid #4CAF50; border-radius:16px; padding:24px; width:720px; max-height:82vh; overflow-y:auto; }
.shop-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.shop-tab { padding:7px 18px; border:2px solid #555; border-radius:8px; cursor:pointer; color:#ccc; background:rgba(255,255,255,0.05); font-size:14px; }
.shop-tab.active { border-color:#4CAF50; color:#fff; background:rgba(76,175,80,0.2); }
.shop-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.si { background:rgba(255,255,255,0.05); border:2px solid #333; border-radius:10px; padding:10px; text-align:center; cursor:pointer; transition:border-color 0.15s; }
.si:hover { border-color:#FFD700; }
.si.owned { border-color:#4CAF50; }
.si.dim { opacity:0.35; cursor:default; }
.si .ie { font-size:34px; }
.si .in { color:#fff; font-size:11px; font-weight:bold; margin:3px 0; }
.si .id { color:#aaa; font-size:9px; font-style:italic; }
.si .ic { color:#FFD700; font-size:12px; font-weight:bold; margin-top:3px; }

/* Screen overlays */
#screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.88); pointer-events:all; z-index:20; }
#screen.hidden { display:none; }
.stitle { font-size:58px; font-weight:bold; color:#4CAF50; text-shadow:0 0 30px #4CAF50; margin-bottom:12px; }
.ssub { color:#aaa; font-size:18px; margin-bottom:28px; }
.bbtn { padding:14px 44px; font-size:20px; background:#4CAF50; color:#fff; border:none; border-radius:12px; cursor:pointer; margin:6px; font-weight:bold; }
.bbtn:hover { filter:brightness(1.15); }
.bbtn.red { background:#cc2222; }
.bbtn.gray { background:#555; }
.skin-grid { display:flex; gap:14px; margin:14px 0; }
.skin-card { width:95px; padding:10px; background:rgba(255,255,255,0.05); border:3px solid #555; border-radius:10px; cursor:pointer; text-align:center; }
.skin-card.sel { border-color:#FFD700; background:rgba(255,215,0,0.1); }
.skin-card .sc-e { font-size:32px; }
.skin-card .sc-n { color:#fff; font-size:10px; margin-top:4px; }

/* Toast */
#toast { position:absolute; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:9px 22px; border-radius:20px; font-size:15px; pointer-events:none; opacity:0; transition:opacity 0.3s; white-space:nowrap; }
#toast.show { opacity:1; }

/* Wave announce */
#wave-ann { position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); font-size:52px; font-weight:bold; color:#ff4444; text-shadow:0 0 20px #ff4444; pointer-events:none; opacity:0; transition:opacity 0.4s; }
#wave-ann.show { opacity:1; }

/* Event banner */
#event-banner { position:absolute; top:30%; left:50%; transform:translate(-50%,-50%); font-size:28px; font-weight:bold; color:#fff; text-align:center; background:rgba(0,0,0,0.72); border:3px solid #FFD700; border-radius:16px; padding:14px 28px; pointer-events:none; opacity:0; transition:opacity 0.4s; white-space:nowrap; text-shadow:0 0 10px #FFD700; }
#event-banner.show { opacity:1; }
#event-banner.bad { border-color:#ff4444; text-shadow:0 0 10px #ff4444; }
#event-timer-bar-wrap { width:260px; height:8px; background:#333; border-radius:4px; margin:8px auto 0; overflow:hidden; }
#event-timer-bar { height:100%; background:#FFD700; border-radius:4px; transition:width 0.5s linear; }

/* Controls hint */
#hint { position:absolute; bottom:100px; right:12px; background:rgba(0,0,0,0.6); border-radius:8px; padding:8px 12px; color:#777; font-size:11px; line-height:1.9; }

/* Touch controls */
#joystick-zone { position:absolute; bottom:20px; left:20px; width:140px; height:140px; pointer-events:all; display:none; touch-action:none; z-index:5; }
#joystick-base { width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.11); border:3px solid rgba(255,255,255,0.28); position:relative; }
#joystick-knob { position:absolute; width:62px; height:62px; border-radius:50%; background:rgba(255,255,255,0.46); top:39px; left:39px; box-shadow:0 0 14px rgba(255,255,255,0.25); pointer-events:none; }
#attack-btn { position:absolute; bottom:24px; right:24px; width:88px; height:88px; border-radius:50%; background:rgba(220,50,50,0.55); border:3px solid rgba(255,110,110,0.7); font-size:34px; display:none; align-items:center; justify-content:center; pointer-events:all; touch-action:none; box-shadow:0 0 18px rgba(220,50,50,0.35); z-index:5; -webkit-user-select:none; user-select:none; }
#wave-start-btn { position:absolute; bottom:250px; left:50%; transform:translateX(-50%); padding:15px 36px; background:rgba(76,175,80,0.92); border:3px solid #4CAF50; border-radius:18px; color:#fff; font-size:21px; font-weight:bold; display:none; pointer-events:all; touch-action:none; white-space:nowrap; box-shadow:0 0 20px rgba(76,175,80,0.55); z-index:5; -webkit-user-select:none; user-select:none; }
#c { touch-action:none; }
@media (pointer: coarse) {
  .hotslot { width:58px; height:58px; }
  .hotslot .se { font-size:24px; }
  #hint { display:none; }
  #shop-box { width:96vw; padding:14px; }
  .shop-grid { grid-template-columns:repeat(2,1fr); }
  .stitle { font-size:38px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-block">❤️ <div id="hp-bar-wrap"><div id="hp-bar"></div></div> <span id="hp-txt">100/100</span></div>
    <div class="hud-block" id="wave-info">Press SPACE to start!</div>
    <div class="hud-block">🌾 <span id="straw-txt">0</span></div>
  </div>
  <div id="hotbar"></div>
  <div id="side-panel">
    <div class="side-btn" title="Shop (B)" onclick="toggleShop()">🛒</div>
  </div>
  <div id="hint">WASD — Move<br>Click — Attack<br>1-5 — Switch weapon<br>B — Shop<br>SPACE — Start Wave</div>
  <div id="toast"></div>
  <div id="wave-ann"></div>
  <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
  <div id="attack-btn">⚔️</div>
<div id="wave-start-btn">▶ START WAVE</div>
<div id="event-banner"><span id="event-text"></span><div id="event-timer-bar-wrap"><div id="event-timer-bar"></div></div></div>

  <!-- Shop -->
  <div id="shop-overlay">
    <div id="shop-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="color:#4CAF50;font-size:22px">🛒 Farm Shop</h2>
        <div style="color:#FFD700;font-size:17px">🌾 <span id="shop-straw">0</span></div>
        <button onclick="toggleShop()" style="background:#c33;color:#fff;border:none;padding:5px 13px;border-radius:7px;cursor:pointer;font-size:15px">✕</button>
      </div>
      <div class="shop-tabs">
        <div class="shop-tab active" onclick="shopTab('weapons')">⚔️ Weapons</div>
        <div class="shop-tab" onclick="shopTab('plants')">🌱 Placeable</div>
        <div class="shop-tab" onclick="shopTab('defenses')">🏰 Defenses</div>
        <div class="shop-tab" onclick="shopTab('barn')">🏚️ Barn</div>
      </div>
      <div id="shop-content" class="shop-grid"></div>
    </div>
  </div>

  <!-- Screen -->
  <div id="screen">
    <div id="screen-inner"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════
//  THREE.JS SETUP
// ═══════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x3a5a78, 0.01);

// Sky gradient dome
(function() {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0,    '#060e22');
  g.addColorStop(0.45, '#0d2a55');
  g.addColorStop(0.75, '#1a3d6e');
  g.addColorStop(1,    '#2a5080');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c);
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(90, 16, 8),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide })
  );
  scene.add(sky);
})();

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 120);
const CAM_OFF = new THREE.Vector3(0, 20, 16);
camera.position.copy(CAM_OFF);
camera.lookAt(0, 0, 0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Lighting
scene.add(new THREE.HemisphereLight(0x6688bb, 0x336611, 0.35));
const sun = new THREE.DirectionalLight(0xfff0cc, 0.75);
sun.position.set(15, 25, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -75; sun.shadow.camera.right = 75;
sun.shadow.camera.top = 75;  sun.shadow.camera.bottom = -75;
sun.shadow.bias = -0.001;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8899cc, 0.2);
fill.position.set(-10, 8, -10);
scene.add(fill);
const rimLight = new THREE.DirectionalLight(0xffeedd, 0.25);
rimLight.position.set(-8, 6, 18);
scene.add(rimLight);

// ═══════════════════════════════════════
//  FARM SCENE
// ═══════════════════════════════════════
const FARM_R = 42;
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// Outer ground — canvas grass texture
(function() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a9a30'; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 600; i++) {
    const x = Math.random()*256, y = Math.random()*256;
    ctx.fillStyle = Math.random() > 0.5 ? '#3d8a25' : '#5cb040';
    ctx.fillRect(x, y, 3, 3);
  }
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(8, 8);
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(180, 180), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0 }));
  gnd.rotation.x = -Math.PI / 2; gnd.receiveShadow = true; scene.add(gnd);
})();

// Dirt farm circle — ploughed furrow texture
(function() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7a5410'; ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2000; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? '#6a4408' : '#8b6318';
    ctx.fillRect(Math.random()*512, Math.random()*512, Math.random()*6+1, Math.random()*3+1);
  }
  // Ploughed furrow rows
  for (let y = 0; y < 512; y += 22) {
    ctx.fillStyle = '#4e2e06'; ctx.fillRect(0, y, 512, 5);
    ctx.fillStyle = '#9a7228'; ctx.fillRect(0, y + 5, 512, 3);
  }
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(6, 6);
  const farm = new THREE.Mesh(new THREE.CircleGeometry(FARM_R, 64), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.97, metalness: 0 }));
  farm.rotation.x = -Math.PI / 2; farm.position.y = 0.01; farm.receiveShadow = true; scene.add(farm);
})();

// Fence posts + rails around edge
const FENCE_MAT = new THREE.MeshStandardMaterial({ color: 0x8B5E3C, roughness: 0.9, metalness: 0 });
const POST_N = 52;
for (let i = 0; i < POST_N; i++) {
  const a = (i / POST_N) * Math.PI * 2;
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.1, 0.22), FENCE_MAT);
  post.position.set(Math.cos(a) * FARM_R, 0.55, Math.sin(a) * FARM_R);
  post.castShadow = true; scene.add(post);
  // Rail to next post
  const a2 = ((i + 1) / POST_N) * Math.PI * 2;
  const x1 = Math.cos(a) * FARM_R, z1 = Math.sin(a) * FARM_R;
  const x2 = Math.cos(a2) * FARM_R, z2 = Math.sin(a2) * FARM_R;
  const mid = new THREE.Vector3((x1+x2)/2, 0.85, (z1+z2)/2);
  const len = Math.sqrt((x2-x1)**2 + (z2-z1)**2);
  const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.1, 0.1), FENCE_MAT);
  rail.position.copy(mid); rail.rotation.y = -Math.atan2(z2-z1, x2-x1); scene.add(rail);
  // Lower rail
  const rail2 = rail.clone(); rail2.position.y = 0.45; scene.add(rail2);
}

// Barn (center) — improved
const barnGrp = new THREE.Group();
const mkBarn = (geo, color, rx=0) => { const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness:0.85, metalness:0 })); m.castShadow=true; m.receiveShadow=true; if(rx) m.rotation.y=rx; return m; };
const barnBody = mkBarn(new THREE.BoxGeometry(8, 5, 6), 0xc0392b);
barnBody.position.y = 2.5; barnGrp.add(barnBody);
// Roof gable
const barnRoof = mkBarn(new THREE.CylinderGeometry(0.01, 6, 4, 4), 0x7b3a10, Math.PI/4);
barnRoof.position.y = 7.0; barnGrp.add(barnRoof);
// White trim
const trim = mkBarn(new THREE.BoxGeometry(8.2, 0.28, 6.2), 0xffffff);
trim.position.y = 5.14; barnGrp.add(trim);
// Door (double doors)
const barnDoor = mkBarn(new THREE.BoxGeometry(1.8, 3.2, 0.15), 0x5C3317);
barnDoor.position.set(0, 1.6, 3.08); barnGrp.add(barnDoor);
// Door arch top
const arch = mkBarn(new THREE.CylinderGeometry(0.9, 0.9, 0.15, 8, 1, false, 0, Math.PI), 0x5C3317);
arch.rotation.z = Math.PI/2; arch.position.set(0, 3.2, 3.08); barnGrp.add(arch);
// Windows (4 windows)
[-2.5, -0.8, 0.8, 2.5].forEach(x => {
  const win = mkBarn(new THREE.BoxGeometry(1.0, 1.0, 0.12), 0x87ceeb);
  win.position.set(x, 3.8, 3.09); barnGrp.add(win);
  const wframe = mkBarn(new THREE.BoxGeometry(1.08, 1.08, 0.08), 0xffffff);
  wframe.position.set(x, 3.8, 3.12); barnGrp.add(wframe);
});
// Side windows
[-1.0, 1.0].forEach(z => {
  const win = mkBarn(new THREE.BoxGeometry(0.12, 1.0, 1.0), 0x87ceeb);
  win.position.set(4.06, 3.5, z); barnGrp.add(win);
});
// Chimneys
[-1.5, 1.5].forEach(x => {
  const chim = mkBarn(new THREE.BoxGeometry(0.6, 1.8, 0.6), 0x884422);
  chim.position.set(x, 8.2, 0); barnGrp.add(chim);
});
scene.add(barnGrp);
// Warm glow from barn windows
const barnLight = new THREE.PointLight(0xff8822, 3.5, 20);
barnLight.position.set(0, 3.5, 3.5);
scene.add(barnLight);
const barnLight2 = new THREE.PointLight(0xff7711, 1.8, 14);
barnLight2.position.set(0, 3.5, -3.5);
scene.add(barnLight2);

// Barn HP ring
let barnRing = null;
function updateBarnRing() {
  if (barnRing) scene.remove(barnRing);
  const pct = Math.max(0, gs.barnHP / gs.barnMaxHP);
  const mat = new THREE.MeshBasicMaterial({ color: pct > 0.5 ? 0x4CAF50 : pct > 0.25 ? 0xff9800 : 0xff2222 });
  barnRing = new THREE.Mesh(new THREE.TorusGeometry(4.0, 0.2, 8, 40, Math.PI * 2 * pct), mat);
  barnRing.rotation.x = -Math.PI / 2; barnRing.position.y = 0.05;
  scene.add(barnRing);
}

// Helper: make a tree with layered canopy
function makeTree(x, z, scale=1) {
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6B4226, roughness:0.9 });
  const leafMat  = new THREE.MeshStandardMaterial({ color: 0x2d8b2d, roughness:0.95 });
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.18*scale, 0.28*scale, 1.8*scale, 8), trunkMat);
  tr.position.y = 0.9*scale; tr.castShadow = true; g.add(tr);
  [[1.6*scale, 2.0*scale, 2.1*scale], [1.15*scale, 1.6*scale, 3.1*scale], [0.7*scale, 1.1*scale, 4.0*scale]].forEach(([r, h, y]) => {
    const lv = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), leafMat);
    lv.position.y = y; lv.castShadow = true; g.add(lv);
  });
  g.position.set(x, 0, z); scene.add(g);
}
// Trees around the outside of the farm
[-55,-48,-42,42,48,55].forEach(x => [-55,-48,-42,42,48,55].forEach(z => {
  if (Math.abs(x)>=48 || Math.abs(z)>=48) makeTree(x, z, 0.8 + Math.random()*0.5);
}));
[-52,52].forEach(x => makeTree(x, 0, 1.0 + Math.random()*0.4));
[-52,52].forEach(z => makeTree(0, z, 1.0 + Math.random()*0.4));

// Hay bales scattered outside fence
const hayMat = new THREE.MeshStandardMaterial({ color: 0xd4a830, roughness: 0.95 });
[[47,10],[-48,-15],[22,-52],[-28,46],[52,-30],[-44,38],[50,45],[-50,20]].forEach(([x,z]) => {
  const hay = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.0, 12), hayMat);
  hay.rotation.z = Math.PI/2; hay.position.set(x, 0.6, z); hay.castShadow = true; scene.add(hay);
});

// Clouds
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness:1, transparent:true, opacity:0.88 });
[[0,22,-15],[-12,24,8],[18,20,-5],[-5,26,18]].forEach(([x,y,z]) => {
  const cg = new THREE.Group();
  [[0,0,0,1.8],[1.6,0.3,0,1.3],[-1.5,0,0,1.2],[0.8,0.5,1.0,1.0],[-0.7,0.4,-0.9,0.9]].forEach(([cx,cy,cz,r]) => {
    const sp = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 7), cloudMat);
    sp.position.set(cx,cy,cz); cg.add(sp);
  });
  cg.position.set(x, y, z); cg._isCloud = true; scene.add(cg);
});

// Silo — tall metal grain silo right of barn
(function() {
  const g = new THREE.Group();
  const siloMat  = new THREE.MeshStandardMaterial({ color: 0xc8c0a0, roughness: 0.75 });
  const metalMat = new THREE.MeshStandardMaterial({ color: 0x999988, roughness: 0.4, metalness: 0.6 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 10, 14), siloMat);
  body.position.y = 5; body.castShadow = true; g.add(body);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(1.5, 14, 7, 0, Math.PI*2, 0, Math.PI/2), siloMat);
  dome.position.y = 10; g.add(dome);
  for (let y = 1; y <= 9; y += 1.6) {
    const band = new THREE.Mesh(new THREE.TorusGeometry(1.52, 0.07, 5, 18), metalMat);
    band.rotation.x = Math.PI/2; band.position.y = y; g.add(band);
  }
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.3, 0.12), new THREE.MeshStandardMaterial({ color: 0x5c3317 }));

function buildPlayerMesh() {
  if (playerMesh) scene.remove(playerMesh);
  const sk = SKINS.find(s => s.id === gs.skin) || SKINS[0];
  const g = new THREE.Group();
  const mat = (col, rough=0.75, met=0) => new THREE.MeshStandardMaterial({color:col, roughness:rough, metalness:met});
  const add = (geo, col, py=0, px=0, pz=0, rx=0, ry=0, rz=0) => {
    const m = new THREE.Mesh(geo, mat(col)); m.position.set(px,py,pz); m.rotation.set(rx,ry,rz); m.castShadow=true; g.add(m); return m;
  };
  const skinCol = 0xffcc99, darkSkin = 0xffaa77;
  // Leg pivot groups — pivot point is at hip level (y=0.84)
  const mkLeg = (lg) => {
    const addL = (geo, col, ly, lx=0, lz=0) => { const m=new THREE.Mesh(geo,mat(col)); m.position.set(lx,ly,lz); m.castShadow=true; lg.add(m); };
    addL(new THREE.BoxGeometry(0.3,0.22,0.4),  0x1a0e00, -0.73, 0, 0.05); // boot sole
    addL(new THREE.BoxGeometry(0.27,0.16,0.27), 0x2a1500, -0.51);          // boot upper
    addL(new THREE.BoxGeometry(0.27,0.46,0.27), 0x1a3a88, -0.23);          // trouser
  };
  const legL = new THREE.Group(); legL.position.set(-0.19, 0.84, 0); mkLeg(legL); g.add(legL);
  const legR = new THREE.Group(); legR.position.set( 0.19, 0.84, 0); mkLeg(legR); g.add(legR);
  // Belt
  add(new THREE.BoxGeometry(0.78,0.14,0.46), 0x4a2200, 0.93);
  add(new THREE.BoxGeometry(0.16,0.16,0.48), 0xcc9900, 0.93); // buckle
  // Torso / overalls
  add(new THREE.BoxGeometry(0.8,0.72,0.48), sk.body, 1.24);
  // Chest pocket
  add(new THREE.BoxGeometry(0.22,0.18,0.05), 0x000000, 1.38, 0.22, 0.25);
  // Suspenders
  add(new THREE.BoxGeometry(0.07,0.56,0.05), 0xffdd44, 1.22,-0.22,0.25);
  add(new THREE.BoxGeometry(0.07,0.56,0.05), 0xffdd44, 1.22, 0.22,0.25);
  // Arm pivot groups — pivot at shoulder (y=1.54)
  const mkArm = (ag) => {
    const addA = (geo, col, ly, lx=0, lz=0) => { const m=new THREE.Mesh(geo,mat(col)); m.position.set(lx,ly,lz); m.castShadow=true; ag.add(m); };
    addA(new THREE.SphereGeometry(0.19,7,7),    sk.body,  0);     // shoulder cap
    addA(new THREE.BoxGeometry(0.23,0.44,0.23), sk.body,  -0.3);  // upper arm
    addA(new THREE.BoxGeometry(0.19,0.3,0.19),  skinCol,  -0.64); // forearm
    addA(new THREE.SphereGeometry(0.13,7,7),    skinCol,  -0.82); // hand
  };
  const armL = new THREE.Group(); armL.position.set(-0.55, 1.54, 0); mkArm(armL); g.add(armL);
  const armR = new THREE.Group(); armR.position.set( 0.55, 1.54, 0); mkArm(armR); g.add(armR);
  // Neck
  add(new THREE.CylinderGeometry(0.13,0.16,0.24,8), skinCol, 1.67);
  // Head sphere
  add(new THREE.SphereGeometry(0.35,12,10), skinCol, 2.04);
  // Ears
  [-0.36,0.36].forEach(x => add(new THREE.SphereGeometry(0.075,6,5), darkSkin, 2.04, x));
  // Eyes — white + iris + pupil
  [-0.13,0.13].forEach(x => {
    add(new THREE.SphereGeometry(0.072,7,7), 0xffffff,    2.1,  x,    0.29);
    add(new THREE.SphereGeometry(0.048,6,6), 0x2244bb,    2.1,  x+0.01, 0.32);
    add(new THREE.SphereGeometry(0.028,5,5), 0x000000,    2.11, x+0.01, 0.33);
    add(new THREE.SphereGeometry(0.012,4,4), 0xffffff,    2.12, x+0.02, 0.34); // shine
  });
  // Eyebrows
  [-0.13,0.13].forEach(x => { const brow=add(new THREE.BoxGeometry(0.13,0.045,0.04), 0x3a2200, 2.18, x, 0.26); brow.rotation.z = x>0?0.15:-0.15; });
  // Nose
  add(new THREE.SphereGeometry(0.055,6,5), darkSkin, 2.04, 0, 0.36);
  // Mouth/smile (two segments)
  add(new THREE.BoxGeometry(0.08,0.04,0.04), 0xaa4433, 1.95,-0.05, 0.33, 0,0, 0.3);
  add(new THREE.BoxGeometry(0.08,0.04,0.04), 0xaa4433, 1.95, 0.05, 0.33, 0,0,-0.3);
  // Hat brim
  add(new THREE.CylinderGeometry(0.52,0.54,0.07,16), sk.hat, 2.4);
  // Hat band
  add(new THREE.CylinderGeometry(0.355,0.355,0.07,14), 0x000000, 2.44);
  // Hat crown (tapered)
  add(new THREE.CylinderGeometry(0.27,0.34,0.46,12), sk.hat, 2.69);
  // Hat top indent hint
  add(new THREE.CylinderGeometry(0.2,0.27,0.04,10), sk.hat, 2.93);
  // Weapon
  const wid = gs.hotbar[gs.activeSlot];
  if (wid) {
    const wd = WEAPONS.find(w => w.id === wid);
    if (wd) { const wm = buildWeaponMesh(wd); wm.position.set(0.52,0.68,0.32); wm.scale.setScalar(0.72); g.add(wm); }
  }
  g._legL = legL; g._legR = legR; g._armL = armL; g._armR = armR;
  playerMesh = g;
  scene.add(playerMesh);
}

    e.preventDefault(); startNextWave();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

//  TOUCH CONTROLS
// ═══════════════════════════════════════
const joystick = { active: false, id: -1, x0: 0, y0: 0, dx: 0, dy: 0 };
const JMAX = 46;

if (isMobile) {
  document.getElementById('joystick-zone').style.display = 'block';
  document.getElementById('attack-btn').style.display = 'flex';
  document.getElementById('hotbar').style.bottom = '170px';
}

{
  const jZone = document.getElementById('joystick-zone');
  const jKnob = document.getElementById('joystick-knob');

  jZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joystick.active = true; joystick.id = t.identifier;
    joystick.x0 = t.clientX; joystick.y0 = t.clientY;
    joystick.dx = 0; joystick.dy = 0;
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (joystick.active && t.identifier === joystick.id) {
        let dx = t.clientX - joystick.x0, dy = t.clientY - joystick.y0;
        const d = Math.hypot(dx, dy);
        if (d > JMAX) { dx *= JMAX / d; dy *= JMAX / d; }
        joystick.dx = dx / JMAX; joystick.dy = dy / JMAX;
        jKnob.style.transform = `translate(${dx}px,${dy}px)`;
      }
    }
  }, { passive: false });

  document.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (joystick.active && t.identifier === joystick.id) {
        joystick.active = false; joystick.dx = 0; joystick.dy = 0;
        jKnob.style.transform = '';
      }
    }
  });

  document.getElementById('attack-btn').addEventListener('touchstart', e => {
    e.preventDefault();
    if (!gameStarted || gs.betweenWaves) return;
    if (gs.placeMode) placeAtMouse(); else doAttack();
  }, { passive: false });

  document.getElementById('wave-start-btn').addEventListener('touchstart', e => {
    e.preventDefault();
    if (gameStarted && gs.betweenWaves && !shopOpen) startNextWave();
  }, { passive: false });

  // Canvas touch: update aim direction from finger position
  document.getElementById('c').addEventListener('touchstart', e => {
    if (!gameStarted || gs.betweenWaves) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== joystick.id) {
        const mx = (t.clientX / window.innerWidth) * 2 - 1;
        const my = -(t.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera({ x: mx, y: my }, camera);
        raycaster.ray.intersectPlane(groundPlane, mouseWorld);
        break;
      }
    }
  }, { passive: true });
}

function setSlot(i) {
  gs.activeSlot = i;
  buildPlayerMesh();
  buildHotbar();
}

// ═══════════════════════════════════════
//  PLAYER UPDATE
// ═══════════════════════════════════════
function updatePlayer(dt) {
  const spd = 7;
  if (keys['KeyW'] || keys['ArrowUp'])    gs.playerVel.z -= spd * dt;
  if (keys['KeyS'] || keys['ArrowDown'])  gs.playerVel.z += spd * dt;
  if (keys['KeyA'] || keys['ArrowLeft'])  gs.playerVel.x -= spd * dt;
  if (keys['KeyD'] || keys['ArrowRight']) gs.playerVel.x += spd * dt;
  if (joystick.active) { gs.playerVel.x += joystick.dx * spd * dt; gs.playerVel.z += joystick.dy * spd * dt; }
  gs.playerVel.multiplyScalar(0.78);
  gs.playerPos.add(gs.playerVel);
  // clamp to farm
  const r = Math.hypot(gs.playerPos.x, gs.playerPos.z);
  if (r > FARM_R - 0.6) {
    gs.playerPos.x = (gs.playerPos.x / r) * (FARM_R - 0.6);
    gs.playerPos.z = (gs.playerPos.z / r) * (FARM_R - 0.6);
    gs.playerVel.set(0, 0, 0);
  }
  gs.playerPos.y = 0.75;
  if (playerMesh) {
    playerMesh.position.x = gs.playerPos.x;
    playerMesh.position.z = gs.playerPos.z;
    const dx = mouseWorld.x - gs.playerPos.x;
    const dz = mouseWorld.z - gs.playerPos.z;
    if (Math.hypot(dx, dz) > 0.1) playerMesh.rotation.y = Math.atan2(dx, dz);
    // Walking animation
    const moving = gs.playerVel.length() > 0.05;
    const now = Date.now() * 0.013;
    if (moving) {
      const swing = Math.sin(now) * 0.52;
      playerMesh.position.y = gs.playerPos.y + Math.abs(Math.sin(now)) * 0.08;
      if (playerMesh._legL) { playerMesh._legL.rotation.x = swing; playerMesh._legR.rotation.x = -swing; }
      if (playerMesh._armL) { playerMesh._armL.rotation.x = -swing * 0.55; playerMesh._armR.rotation.x = swing * 0.55; }
    } else {
      playerMesh.position.y = gs.playerPos.y;
      if (playerMesh._legL) { playerMesh._legL.rotation.x *= 0.78; playerMesh._legR.rotation.x *= 0.78; }
      if (playerMesh._armL) { playerMesh._armL.rotation.x *= 0.78; playerMesh._armR.rotation.x *= 0.78; }
    }
  }
}

// ═══════════════════════════════════════
//  FLOATING TEXT
// ═══════════════════════════════════════
function floatText(pos, text, color) {
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 40;
  const x = cv.getContext('2d');
  x.fillStyle = '#' + color.toString(16).padStart(6, '0');
  x.font = 'bold 26px Arial'; x.textAlign = 'center';
  x.fillText(text, 64, 30);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true }));
  sp.scale.set(2, 0.625, 1);
  sp.position.copy(pos).add(new THREE.Vector3(0, 1.5, 0));
  scene.add(sp);
  gs.floatingTexts.push({ sp, pos: sp.position.clone(), timer: 1.4 });
}

function spawnFX(pos, color, dur, size) {
  const g = new THREE.Group(); g.position.copy(pos); scene.add(g);
  // Central glow orb
  const orb = new THREE.Mesh(
    new THREE.SphereGeometry(size * 0.5, 7, 7),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85 })
  );
  g.add(orb);
  // Expanding ring
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(size * 0.3, size * 0.08, 5, 16),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 })
  );
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.1; g.add(ring);
  gs.effects.push({ mesh: g, timer: dur, max: dur, _ring: ring, _orb: orb, _size: size });
}

// ═══════════════════════════════════════
//  ATTACK
// ═══════════════════════════════════════
function doAttack() {
  if (!gameStarted || gs.betweenWaves || attackCd > 0) return;
  const wid = gs.hotbar[gs.activeSlot];
  if (!wid) return;
  const wd = WEAPONS.find(w => w.id === wid);
  if (!wd) return;
  attackCd = wd.cd;

  let dir = new THREE.Vector3(mouseWorld.x - gs.playerPos.x, 0, mouseWorld.z - gs.playerPos.z);
  // Auto-aim toward nearest enemy if mouse hasn't been moved over canvas yet
  if (dir.length() < 0.5 && gs.enemies.length > 0) {
    const nearest = gs.enemies.reduce((a, b) => a.pos.distanceTo(gs.playerPos) < b.pos.distanceTo(gs.playerPos) ? a : b);
    dir = nearest.pos.clone().sub(gs.playerPos).setY(0);
  }
  dir.normalize();
  spawnFX(gs.playerPos.clone().add(dir), wd.color, 0.2, 0.3);

  if (wd.kind === 'melee' || wd.kind === 'heavy') {
    const hits = new Set();
    gs.enemies.forEach(e => {
      if (e.pos.distanceTo(gs.playerPos.clone().add(dir.clone().multiplyScalar(wd.range * 0.5))) < wd.range * 0.7 + e.data.sz) {
        hits.add(e);
      }
    });
    hits.forEach(e => {
      dmgEnemy(e, wd.dmg);
      if (wd.kind === 'heavy') e.vel.add(dir.clone().multiplyScalar(6));
    });
  } else if (wd.kind === 'beam') {
    for (let t = 0; t < wd.range; t += 0.5) {
      const hp = gs.playerPos.clone().add(dir.clone().multiplyScalar(t)).add(new THREE.Vector3(0, 0.5, 0));
      gs.enemies.forEach(e => { if (!e._beamHit && e.pos.distanceTo(hp) < 1.0 + e.data.sz) { e._beamHit = true; dmgEnemy(e, wd.dmg); } });
    }
    gs.enemies.forEach(e => { e._beamHit = false; });
    spawnFX(gs.playerPos.clone().add(dir.clone().multiplyScalar(wd.range / 2)).add(new THREE.Vector3(0, 0.5, 0)), wd.color, 0.3, wd.range / 2);
  } else if (wd.kind === 'cloud') {
    const cp = gs.playerPos.clone().add(dir.clone().multiplyScalar(3));
    spawnFX(cp, wd.color, wd.dur, wd.aoe);
    gs.effects.push({ type: 'cloud', pos: cp, dmg: wd.dmg, aoe: wd.aoe, timer: wd.dur, max: wd.dur, mesh: null, tickTimer: 0 });
  } else if (wd.kind === 'shotgun') {
    for (let i = 0; i < (wd.pellets || 7); i++) {
      const sp = (Math.random() - 0.5) * 0.8;
      const pd = new THREE.Vector3(dir.x + sp, 0, dir.z + sp * 0.5).normalize();
      spawnProj(gs.playerPos.clone().add(new THREE.Vector3(0, 0.8, 0)), pd, 13, wd, 'weapon', wd.range / 13);
    }
  } else {
    spawnProj(gs.playerPos.clone().add(new THREE.Vector3(0, 0.8, 0)), dir, 10, wd, 'weapon', wd.range / 10);
  }
}

function spawnProj(pos, dir, spd, data, owner, life) {
  const col = data.color || 0xffffff;
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.26, 8, 8),
    new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.7, roughness: 0.3, metalness: 0.1 })
  );
  m.position.copy(pos); scene.add(m);
  gs.projectiles.push({ mesh: m, pos: pos.clone(), vel: dir.clone().multiplyScalar(spd), data, owner, timer: life, hitSet: new Set(), bounceLeft: data.bounces || 0 });
}

function dmgEnemy(e, dmg) {
  const armor = e.data.armor || 0;
  const mult = gs.activeEvents.powerUp ? 2 : 1;
  const actual = Math.round(dmg * mult * (1 - armor));
  e.hp -= actual;
  floatText(e.pos.clone(), '-' + actual, 0xff4444);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  if (e._dead) return; e._dead = true;
  scene.remove(e.mesh);
  gs.enemies = gs.enemies.filter(x => x !== e);
  const straw = gs.activeEvents.strawRain ? e.data.straw * 2 : e.data.straw;
  gs.straw += straw;
  gs.totalKills++;
  gs.waveEnemiesLeft = Math.max(0, gs.waveEnemiesLeft - 1);
  floatText(e.pos.clone(), '+' + straw + '🌾', 0xFFD700);
}

// ═══════════════════════════════════════
//  PROJECTILE UPDATE
// ═══════════════════════════════════════
function updateProjectiles(dt) {
  gs.projectiles = gs.projectiles.filter(p => {
    p.timer -= dt;
    if (p.timer <= 0) {
      if (p.data.aoe && p.owner === 'weapon') {
        gs.enemies.forEach(e => { if (p.pos.distanceTo(e.pos) < p.data.aoe) dmgEnemy(e, p.data.dmg * 0.6); });
        spawnFX(p.pos.clone(), p.data.color, 0.35, p.data.aoe * 0.5);
      }
      scene.remove(p.mesh); return false;
    }
    p.pos.add(p.vel.clone().multiplyScalar(dt));
    p.mesh.position.copy(p.pos);

    if (p.owner === 'weapon' || p.owner === 'plant') {
      for (const e of gs.enemies) {
        if (p.hitSet.has(e)) continue;
        if (p.pos.distanceTo(e.pos) < 0.5 + e.data.sz) {
          p.hitSet.add(e);
          dmgEnemy(e, p.data.dmg);
          if (p.data.slow) e.slowTimer = p.data.slowDur || 2;
          if (p.data.burn) e.burnTimer = p.data.burn;
          // AoE on impact
          if (p.data.aoe) {
            gs.enemies.forEach(e2 => {
              if (!p.hitSet.has(e2) && p.pos.distanceTo(e2.pos) < p.data.aoe) { dmgEnemy(e2, p.data.dmg * 0.6); p.hitSet.add(e2); }
            });
            spawnFX(p.pos.clone(), p.data.color, 0.35, p.data.aoe * 0.5);
          }
          // bounce
          if (p.bounceLeft > 0) {
            p.bounceLeft--;
            const next = gs.enemies.filter(x => !p.hitSet.has(x)).sort((a, b) => a.pos.distanceTo(p.pos) - b.pos.distanceTo(p.pos))[0];
            if (next) { p.vel = next.pos.clone().sub(p.pos).normalize().multiplyScalar(10); break; }
          }
          if (p.data.kind !== 'melee') { scene.remove(p.mesh); return false; }
        }
      }
    }
    return p.timer > 0;
  });
}

// ═══════════════════════════════════════
//  ENEMY SPAWN + UPDATE
// ═══════════════════════════════════════
function spawnEnemy(typeId) {
  const data = ENEMY_TYPES.find(e => e.id === typeId);
  if (!data) return;
  const angle = Math.random() * Math.PI * 2;
  const r = FARM_R + 2 + Math.random() * 3;
  const pos = new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r);
  const sz = data.sz || 1;
  const g = new THREE.Group();
  const smat = (col, rough=0.85, met=0, emCol=0, emInt=0) => {
    const m = new THREE.MeshStandardMaterial({ color: col, roughness: rough, metalness: met });
    if (emInt > 0) { m.emissive.setHex(emCol); m.emissiveIntensity = emInt; }
    return m;
  };
  const mk = (geo, col, py=0, px=0, pz=0, rx=0, ry=0, rz=0, rough=0.85, met=0, emCol=0, emInt=0) => {
    const m = new THREE.Mesh(geo, smat(col, rough, met, emCol, emInt));
    m.position.set(px, py, pz); m.rotation.set(rx, ry, rz); m.castShadow = true; return m;
  };
  const isBoss  = data.id === 'boss';
  const isArmor = data.id === 'armor';
  const isTorch = data.id === 'torch';
  const isSword = data.id === 'sword';
  const isFlame = data.id === 'flame';

  // Legs — two wooden post legs
  [-0.19*sz, 0.19*sz].forEach(x => {
    g.add(mk(new THREE.CylinderGeometry(0.09*sz, 0.11*sz, 1.05*sz, 6), 0x6B3E26, 0.52*sz, x));
  });
  // Straw tufts at feet
  [-0.26*sz, 0.26*sz].forEach(x => {
    g.add(mk(new THREE.CylinderGeometry(0.07*sz, 0.05*sz, 0.28*sz, 5), 0xd4a830, 0.08*sz, x,        0.05*sz,  0.22, 0,  0));
    g.add(mk(new THREE.CylinderGeometry(0.06*sz, 0.04*sz, 0.26*sz, 5), 0xc8961e, 0.08*sz, x+0.08*sz, 0.06*sz,  0.26, 0,  0.28));
    g.add(mk(new THREE.CylinderGeometry(0.06*sz, 0.04*sz, 0.26*sz, 5), 0xd4a830, 0.08*sz, x-0.08*sz, 0.06*sz,  0.26, 0, -0.28));
  });

  // Torso / shirt
  const bodyCol = data.color;
  g.add(mk(new THREE.BoxGeometry(0.74*sz, 0.88*sz, 0.42*sz), bodyCol, 1.12*sz));
  // Chest patch
  g.add(mk(new THREE.BoxGeometry(0.23*sz, 0.19*sz, 0.44*sz), 0x8B5E3C, 1.22*sz, 0.18*sz));
  // Rope belt
  g.add(mk(new THREE.CylinderGeometry(0.39*sz, 0.39*sz, 0.09*sz, 10), 0x7a5c2e, 0.72*sz));
  // Straw tufts at collar
  [-0.12*sz, 0, 0.12*sz].forEach((x, i) => {
    g.add(mk(new THREE.CylinderGeometry(0.04*sz, 0.03*sz, 0.22*sz, 5), 0xd4a830, 1.63*sz, x, 0.14*sz, -0.38, 0, (i-1)*0.28));
  });

  // Armor plate for armored type
  if (isArmor) {
    g.add(mk(new THREE.BoxGeometry(0.76*sz, 0.72*sz, 0.1*sz),  0x555566, 1.12*sz, 0, 0.23*sz, 0, 0, 0, 0.55, 0.75));
    g.add(mk(new THREE.BoxGeometry(0.72*sz, 0.1*sz,  0.44*sz), 0x666677, 0.72*sz, 0, 0,       0, 0, 0, 0.55, 0.75));
    [-0.46*sz, 0.46*sz].forEach(x => {
      g.add(mk(new THREE.BoxGeometry(0.24*sz, 0.2*sz, 0.24*sz), 0x555566, 1.46*sz, x, 0, 0, 0, 0, 0.55, 0.75));
    });
  }

  // Arms — upper crossbar + forearms + hands
  g.add(mk(new THREE.BoxGeometry(1.62*sz, 0.22*sz, 0.22*sz), bodyCol, 1.42*sz));
  [-0.74*sz, 0.74*sz].forEach((x, i) => {
    const lean = i === 0 ? 0.16 : -0.16;
    g.add(mk(new THREE.BoxGeometry(0.21*sz, 0.44*sz, 0.21*sz), bodyCol, 1.17*sz, x, 0, lean));
    g.add(mk(new THREE.SphereGeometry(0.13*sz, 6, 6), 0xc8a850, 0.92*sz, x));
    // Sleeve straw tufts
    g.add(mk(new THREE.CylinderGeometry(0.05*sz, 0.04*sz, 0.2*sz, 5), 0xd4a830, 0.79*sz, x+0.05*sz, 0.08*sz, 0, 0,  0.45));
    g.add(mk(new THREE.CylinderGeometry(0.05*sz, 0.04*sz, 0.18*sz, 5), 0xc8961e, 0.8*sz,  x-0.05*sz, 0.07*sz, 0, 0, -0.4));
  });

  // Type-specific weapon props
  if (isTorch) {
    g.add(mk(new THREE.CylinderGeometry(0.06*sz, 0.06*sz, 0.56*sz, 7), 0x5c3a00, 0.9*sz, 0.79*sz, 0.12*sz, 0, 0, 0.25));
    g.add(mk(new THREE.ConeGeometry(0.13*sz, 0.28*sz, 7), 0xff6600, 1.18*sz, 0.84*sz, 0.12*sz, 0, 0, 0, 0.5, 0, 0xff4400, 1.3));
    g.add(mk(new THREE.SphereGeometry(0.1*sz, 5, 5), 0xffaa00, 1.26*sz, 0.84*sz, 0.12*sz, 0, 0, 0, 0.3, 0, 0xff8800, 1.5));
  }
  if (isSword) {
    g.add(mk(new THREE.BoxGeometry(0.07*sz, 0.72*sz, 0.05*sz), 0xccccdd, 0.62*sz, 0.79*sz, 0.12*sz, 0, 0, 0.12, 0.25, 0.85));
    g.add(mk(new THREE.BoxGeometry(0.3*sz,  0.07*sz, 0.07*sz), 0x998855, 1.0*sz,  0.79*sz, 0.12*sz));
    g.add(mk(new THREE.CylinderGeometry(0.05*sz, 0.05*sz, 0.18*sz, 6), 0x6b4400, 0.83*sz, 0.79*sz, 0.12*sz));
  }
  if (isFlame) {
    g.add(mk(new THREE.CylinderGeometry(0.09*sz, 0.09*sz, 0.58*sz, 7), 0x555555, 0.9*sz, 0.79*sz, 0.12*sz, 0, 0, Math.PI/2 + 0.18, 0.5, 0.6));
    g.add(mk(new THREE.ConeGeometry(0.11*sz, 0.28*sz, 7), 0xff6600, 0.9*sz, 1.09*sz, 0.12*sz, 0, 0, -Math.PI/2, 0.35, 0, 0xff4400, 1.0));
    g.add(mk(new THREE.CylinderGeometry(0.07*sz, 0.1*sz, 0.3*sz, 7), 0x444444, 0.9*sz, 0.72*sz, 0.12*sz, 0.3, 0, 0, 0.5, 0.6));
  }

  // HEAD
  if (isBoss) {
    // Pumpkin head with ridges, stem, carved eyes + grin
    const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.46*sz, 10, 8), smat(0xff6600, 0.65, 0));
    pHead.scale.y = 0.82; pHead.position.set(0, 2.38*sz, 0); pHead.castShadow = true; g.add(pHead);
    // Pumpkin vertical ridges
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const ridge = new THREE.Mesh(new THREE.CylinderGeometry(0.07*sz, 0.07*sz, 0.72*sz, 5), smat(0xdd5500, 0.7));
      ridge.scale.y = 0.82; ridge.position.set(Math.cos(a)*0.38*sz, 2.38*sz, Math.sin(a)*0.38*sz);
      ridge.castShadow = true; g.add(ridge);
    }
    // Stem
    g.add(mk(new THREE.CylinderGeometry(0.07*sz, 0.1*sz, 0.22*sz, 6), 0x3a6600, 2.9*sz));
    // Carved triangle eyes
    [-0.17*sz, 0.17*sz].forEach(x => {
      g.add(mk(new THREE.ConeGeometry(0.1*sz, 0.15*sz, 3), 0xff2200, 2.44*sz, x, 0.4*sz, 0, 0, Math.PI, 0.3, 0, 0xff0000, 2.0));
    });
    // Carved grin teeth
    [-0.16*sz, 0, 0.16*sz].forEach(x => {
      g.add(mk(new THREE.BoxGeometry(0.11*sz, 0.09*sz, 0.06*sz), 0xff2200, 2.18*sz, x, 0.43*sz, 0, 0, 0, 0.3, 0, 0xff0000, 1.5));
    });
    // Boss aura rings
    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(0.82*sz, 0.07*sz, 6, 18), smat(0xff2200, 0.4, 0, 0xff2200, 1.2));
    ring1.rotation.x = Math.PI/2; ring1.position.y = 0.12; g.add(ring1);
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.15*sz, 0.05*sz, 6, 18), smat(0xff6600, 0.4, 0, 0xff6600, 0.8));
    ring2.rotation.x = Math.PI/2; ring2.position.y = 0.18; g.add(ring2);
  } else {
    // Burlap sack head
    const hCol = 0xc8a850;
    g.add(mk(new THREE.SphereGeometry(0.38*sz, 9, 8), hCol, 2.26*sz));
    g.add(mk(new THREE.BoxGeometry(0.54*sz, 0.19*sz, 0.5*sz), hCol, 2.04*sz));
    // Burlap seam ridge
    g.add(mk(new THREE.BoxGeometry(0.025*sz, 0.3*sz, 0.04*sz), 0x9a7430, 2.4*sz, 0, 0.36*sz));
    // Stitched X-eyes
    [-0.14*sz, 0.14*sz].forEach(x => {
      g.add(mk(new THREE.BoxGeometry(0.18*sz, 0.04*sz, 0.04*sz), 0x3a2000, 2.32*sz, x, 0.37*sz, 0, 0,  0.62));
      g.add(mk(new THREE.BoxGeometry(0.18*sz, 0.04*sz, 0.04*sz), 0x3a2000, 2.32*sz, x, 0.37*sz, 0, 0, -0.62));
    });
    // Stitched mouth dots
    [-0.13*sz, 0, 0.13*sz].forEach(x => {
      g.add(mk(new THREE.SphereGeometry(0.04*sz, 4, 4), 0x3a2000, 2.12*sz, x, 0.38*sz));
    });
  }

  // HAT
  if (isBoss) {

}

function updateEnemies(dt) {
  gs.enemies.forEach(e => {
    // Find nearest target: placed plant → barn → player
    let tgt = new THREE.Vector3(0, 0, 0); // barn default
    let minD = e.pos.length();
    gs.placedPlants.forEach(p => { const d = e.pos.distanceTo(p.pos); if (d < minD) { minD = d; tgt = p.pos.clone(); } });
    const pd = e.pos.distanceTo(gs.playerPos);
    if (pd < minD - 2) { tgt = gs.playerPos.clone(); }

    const dir = tgt.clone().sub(e.pos).setY(0);
    const dist = dir.length();
    if (dist > 0.01) dir.normalize();
    const attackRange = 1.8 * (e.data.sz || 1);
    const rageMult = gs.activeEvents.enemyRage ? 1.7 : 1;
    const frozenMult = gs.activeEvents.freezeWave ? 0.05 : 1;
    const spd = e.data.spd * rageMult * frozenMult * (e.slowTimer > 0 ? 0.3 : 1);
    if (dist > attackRange) {
      // Walk toward target
      e.vel.lerp(dir.multiplyScalar(spd), 0.12);
      e.pos.add(e.vel.clone().multiplyScalar(dt));
    } else {
      // Stop and stand still while attacking
      e.vel.set(0, 0, 0);
    }
    const walking = e.vel.length() > 0.01;
    const et = Date.now() * 0.001;
    const freq = (e.data.spd || 2) * 1.7;
    const step = Math.sin(et * freq + e._phase);
    e._bob   = e._bob   * 0.84 + (walking ? Math.abs(step) * 0.15 : 0) * 0.16;
    e._swayZ = e._swayZ * 0.84 + (walking ? Math.sin(et * freq + e._phase + Math.PI * 0.5) * 0.12 : 0) * 0.16;
    e._leanX = e._leanX * 0.84 + (walking ? -0.08 : 0) * 0.16;
    e.mesh.position.copy(e.pos).setY(e._bob);
    const faceDir = tgt.clone().sub(e.pos).setY(0);
    const faceY = faceDir.length() > 0.01 ? Math.atan2(faceDir.x, faceDir.z) : e.mesh.rotation.y;
    e.mesh.rotation.set(e._leanX, faceY, e._swayZ);
    // Update HP bar
    if (e._hpFill) {
      const pct = Math.max(0, e.hp / e.maxHp);
      e._hpFill.scale.x = pct;
      e._hpFill.position.x = -(e._hpSz * (1 - pct)) / 2;
      e._hpFill.material.color.setHex(pct > 0.5 ? 0x44ff44 : pct > 0.25 ? 0xff8800 : 0xff2222);
    }

    e.attackCd = Math.max(0, e.attackCd - dt);
    e.slowTimer = Math.max(0, e.slowTimer - dt);
    if (e.burnTimer > 0) { e.burnTimer -= dt; e.hp -= 3 * dt; if (e.hp <= 0) killEnemy(e); }

    // Attack
    if (e.attackCd <= 0 && dist < attackRange) {
      e.attackCd = 1.0;
      if (tgt.distanceTo(gs.playerPos) < 1) {
        gs.playerHP -= e.data.dmg;
        if (gs.playerHP <= 0) { gs.playerHP = 0; endGame(); }
      } else if (tgt.length() < 2.5) {
        if (!gs.activeEvents.barnShield) {
          gs.barnHP -= e.data.dmg;
          if (gs.barnHP <= 0) { gs.barnHP = 0; endGame(); }
          updateBarnRing();
        }
      } else {
        const pp = gs.placedPlants.find(p => p.pos.distanceTo(e.pos) < 2);
        if (pp) {
          pp.hp -= e.data.dmg;
          if (pp.hp <= 0) { scene.remove(pp.mesh); gs.placedPlants = gs.placedPlants.filter(x => x !== pp); showToast('A plant was destroyed!'); }
        }
      }
    }
  });
}

// ═══════════════════════════════════════
//  RANDOM EVENTS
// ═══════════════════════════════════════
const eventBanner = document.getElementById('event-banner');
const eventText   = document.getElementById('event-text');
const eventTimerBar = document.getElementById('event-timer-bar');
let _eventBannerTimeout = null;

function showEventBanner(ev, remaining, total) {
  eventText.textContent = ev.name + ' — ' + ev.desc;
  eventBanner.className = 'show' + (ev.bad ? ' bad' : '');
  if (ev.instant) {
    eventTimerBar.style.display = 'none';
    clearTimeout(_eventBannerTimeout);
    _eventBannerTimeout = setTimeout(() => { eventBanner.className = ''; }, 3000);
  } else {
    eventTimerBar.style.display = 'block';
    eventTimerBar.style.width = (remaining / total * 100) + '%';
  }
}

function hideEventBanner() {
  eventBanner.className = '';
}

function triggerRandomEvent() {
  const ev = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
  showEventBanner(ev, ev.dur, ev.dur);

  if (ev.id === 'strawBonus') {
    gs.straw += 100;
    floatText(gs.playerPos.clone().add(new THREE.Vector3(0,2,0)), '+100🌾', 0xFFD700);
  } else if (ev.id === 'stampede') {
    for (let i = 0; i < 12; i++) spawnEnemy('basic');
    gs.waveEnemiesLeft += 12;
  } else if (ev.dur) {
    gs.activeEvents[ev.id] = ev.dur;
  }
}

function updateEventSystem(dt) {
  // Countdown to next event (every 5 minutes = 300s, but start first one after 90s)
  gs.eventTimer -= dt;
  if (gs.eventTimer <= 0) {
    gs.eventTimer = 300;
    triggerRandomEvent();
  }

  // Tick active durations
  let anyActive = false;
  for (const id of Object.keys(gs.activeEvents)) {
    gs.activeEvents[id] -= dt;
    if (gs.activeEvents[id] <= 0) {
      delete gs.activeEvents[id];
      hideEventBanner();
    } else {
      anyActive = true;
      const ev = RANDOM_EVENTS.find(e => e.id === id);
      if (ev) showEventBanner(ev, gs.activeEvents[id], ev.dur);
    }
  }

  // Straw rain tick
  if (gs.activeEvents.strawRain) {
    if (!gs._strawRainTick) gs._strawRainTick = 0;
    gs._strawRainTick -= dt;
    if (gs._strawRainTick <= 0) {
      gs._strawRainTick = 2;
      gs.straw += 6;
      floatText(gs.playerPos.clone().add(new THREE.Vector3(0,2,0)), '+6🌾', 0xFFD700);
    }
  } else {
    gs._strawRainTick = 0;
  }

  // Heal rain tick
  if (gs.activeEvents.healRain && gs.playerHP < gs.playerMaxHP) {
    gs.playerHP = Math.min(gs.playerMaxHP, gs.playerHP + 8 * dt);
  }
}

// ═══════════════════════════════════════
//  WAVE SYSTEM
// ═══════════════════════════════════════
function startNextWave() {
  gs.betweenWaves = false; gs.waveActive = true;
  gs.wave++;
  const waveData = WAVES[(gs.wave - 1) % WAVES.length];
  gs.spawnQueue = [];
  waveData.forEach(({ t, n }) => { for (let i = 0; i < n; i++) gs.spawnQueue.push(t); });
  gs.spawnQueue.sort(() => Math.random() - 0.5);
  gs.waveEnemiesLeft = gs.spawnQueue.length;
  gs.spawnTimer = 0;
  const waveLabels = {5:'👹 BOSS WAVE!', 10:'💀 DOUBLE BOSS!', 12:'💀 DOUBLE BOSS!', 15:'☠️ BOSS ARMY!', 18:'🔥 TRIPLE BOSS!', 20:'💥 FINAL WAVE!'};
  const label = waveLabels[gs.wave] || (gs.wave === 20 ? '💥 FINAL WAVE!' : '⚠️ WAVE ' + gs.wave + '!');
  showWaveAnn(label);
  showToast('Wave ' + gs.wave + ' / 20 incoming!', 2200);
}

function checkWaveEnd() {
  if (!gs.waveActive || gs.spawnQueue.length > 0 || gs.enemies.length > 0) return;
  gs.waveActive = false; gs.betweenWaves = true;
  const bonus = gs.wave * 10;
  gs.straw += bonus;
  showToast('Wave ' + gs.wave + ' cleared! +' + bonus + ' straw bonus! 🎉', 3000);
  if (gs.wave >= WAVES.length) setTimeout(() => showScreen('victory'), 2000);
  saveGame();
}

      add(new THREE.CylinderGeometry(0.3,0.34,0.55,8), S(0x777777), 0.75);
      // Barrel pointing up
      add(new THREE.CylinderGeometry(0.12,0.14,0.6,8), S(0x444444), 1.18, 0,0, 0,0,0);
      add(new THREE.CylinderGeometry(0.09,0.12,0.1,8), S(0x333333), 1.53);
      // Fuse
      add(new THREE.CylinderGeometry(0.025,0.025,0.18,5), S(0x5c3317), 1.57, 0.08,0, 0,0,0.4);
      add(new THREE.SphereGeometry(0.06,5,5), E(0xff8800), 1.65, 0.1,0);
      break;
    }
    case 'spike': {
      // Wooden base plate
      add(new THREE.BoxGeometry(1.1,0.12,1.1), S(0x5c3317), 0.06);
      // Spike rows
      for (let ix = -1; ix <= 1; ix++) for (let iz = -1; iz <= 1; iz++) {
        add(new THREE.ConeGeometry(0.06,0.38,5), S(0x888888), 0.25, ix*0.32, iz*0.32);
      }
      break;
    }
    case 'tesla': {
      // Metal base
      add(new THREE.CylinderGeometry(0.26,0.3,0.3,8), S(0x557755), 0.15, 0,0,0,0,0,0.5,0.7);
      // Pole
      add(new THREE.CylinderGeometry(0.06,0.08,1.0,8), S(0x557755), 0.65, 0,0,0,0,0,0.5,0.7);
      // Coil rings
      [0.4,0.6,0.8].forEach(y => add(new THREE.TorusGeometry(0.18,0.04,5,12), S(0x888855), y+0.2, 0,0, Math.PI/2,0,0));
      // Spark orb
      add(new THREE.SphereGeometry(0.2,8,8), E(0x88ffff), 1.28);
      add(new THREE.SphereGeometry(0.13,6,6), E(0xffffff), 1.28);
      break;
    }
    default: {
      add(new THREE.CylinderGeometry(0.1,0.15,0.8,8), S(0x228B22), 0.4);
      add(new THREE.SphereGeometry(0.38,10,10), S(data.color||0x00ff00), 0.9);
    }
  }
  return g;
}

function buildWeaponMesh(wd) {
  const g = new THREE.Group();
  const S = (col, rough=0.7) => new THREE.MeshStandardMaterial({color:col, roughness:rough, metalness:0});
  const E = (col) => new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:0.7, roughness:0.5});
  const add = (geo, mat, y=0, x=0, z=0, rx=0, ry=0, rz=0) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); m.castShadow=true; g.add(m); return m;
  };
  switch(wd.id) {
    case 'carrot': {
      add(new THREE.CylinderGeometry(0.04,0.12,0.88,7), S(0xff6600), 0, 0,0, 0,0, Math.PI/2);
      for(let i=0;i<4;i++){const a=i/4*Math.PI*2; add(new THREE.BoxGeometry(0.04,0.2,0.06), S(0x228b22), 0, -0.5+Math.cos(a)*0.06, Math.sin(a)*0.06, -0.4,a,0);}
      break;
    }
    case 'pumpkin': {
      const pm=add(new THREE.SphereGeometry(0.26,8,8), S(0xff8c00), 0); pm.scale.set(1,0.9,1);
      for(let i=0;i<6;i++){const a=i/6*Math.PI*2; const rb=add(new THREE.SphereGeometry(0.065,5,5), S(0xff6600), 0, Math.cos(a)*0.21, Math.sin(a)*0.21); rb.scale.y=1.5;}
      add(new THREE.CylinderGeometry(0.035,0.035,0.16,5), S(0x5c3317), 0.3);
      add(new THREE.BoxGeometry(0.035,0.13,0.025), S(0x228b22), 0.26, 0.07,0, 0,0,-0.5);
      break;
    }
    case 'apple': {
      add(new THREE.SphereGeometry(0.24,9,9), S(0xff1111), 0);
      add(new THREE.CylinderGeometry(0.025,0.025,0.14,5), S(0x5c3317), 0.27);
      add(new THREE.BoxGeometry(0.22,0.04,0.1), S(0x228b22), 0.24, 0.12,0, 0,0, 0.55);
      break;
    }
    case 'melon': {
      add(new THREE.CylinderGeometry(0.06,0.07,0.7,8), S(0x5c3317), 0, 0,0, 0,0, Math.PI/2);
      const mel=add(new THREE.SphereGeometry(0.3,9,9), S(0x228b22), 0, 0.55,0); mel.scale.set(1.2,0.85,0.85);
      for(let i=0;i<4;i++){const a=i/4*Math.PI; add(new THREE.BoxGeometry(0.02,0.25,0.5), S(0x1a5c1a), 0, 0.55+Math.cos(a)*0.24, Math.sin(a)*0.24);}
      break;
    }
    case 'corn': {
      add(new THREE.CylinderGeometry(0.14,0.12,0.64,10), S(0xffd700), 0, 0,0, 0,0, Math.PI/2);
      for(let i=0;i<4;i++){const a=i/4*Math.PI*2; add(new THREE.BoxGeometry(0.04,0.38,0.2), S(0x228b22), 0, Math.cos(a)*0.11, Math.sin(a)*0.11, 0,a, 0.38);}
      break;
    }
    case 'berry': {
      add(new THREE.CylinderGeometry(0.04,0.05,0.7,6), S(0x8b4513), 0, 0,0, 0,0, Math.PI/2);
      add(new THREE.SphereGeometry(0.2,8,8), S(0xff1493), 0, 0.55,0);
      for(let i=0;i<6;i++){const a=i/6*Math.PI*2; add(new THREE.SphereGeometry(0.03,4,4), S(0xffcc44), 0, 0.55+Math.cos(a)*0.12, Math.sin(a)*0.12);}
      break;
    }
    case 'tomato': {
      add(new THREE.SphereGeometry(0.25,9,9), S(0xff2200), 0);
      for(let i=0;i<5;i++){const a=i/5*Math.PI*2; add(new THREE.BoxGeometry(0.2,0.04,0.05), S(0x228b22), 0.24, Math.cos(a)*0.08, Math.sin(a)*0.08, 0,a,0);}
      add(new THREE.CylinderGeometry(0.025,0.025,0.1,5), S(0x228b22), 0.32);
      break;
    }
    case 'bean': {
      add(new THREE.CylinderGeometry(0.05,0.07,1.1,7), S(0x32cd32), 0, 0,0, 0,0, Math.PI/2);
      for(let i=0;i<4;i++) add(new THREE.SphereGeometry(0.075,6,6), S(0x28b028), 0, i*0.22-0.33);
      break;
    }
    case 'mush': {
      add(new THREE.CylinderGeometry(0.08,0.1,0.44,8), S(0xeeeeee), 0, 0,0, 0,0, Math.PI/2);
      add(new THREE.SphereGeometry(0.3,8,7), S(0x9b59b6), 0, 0.52,0);
      add(new THREE.CylinderGeometry(0.28,0.05,0.1,8), S(0xddbbee), 0, 0.26,0, 0,0,-Math.PI/2);
      for(let i=0;i<5;i++){const a=i/5*Math.PI*2; add(new THREE.SphereGeometry(0.055,5,5), S(0xffffff), 0, 0.52+Math.cos(a)*0.15, Math.sin(a)*0.15);}
      break;
    }
    case 'sun': {
      add(new THREE.SphereGeometry(0.2,9,9), E(0xffd700), 0);
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2; const r=add(new THREE.BoxGeometry(0.06,0.28,0.04), S(0xffcc00), 0, Math.cos(a)*0.38, Math.sin(a)*0.38); r.rotation.z=a;}
      const ring=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.04,5,14), E(0xffee00)); g.add(ring);
      break;
    }
    default: {
      add(new THREE.BoxGeometry(0.16,0.16,0.9), S(wd.color||0xaaaaaa), 0, 0,0, 0,0, Math.PI/2);
    }
  }
  return g;
}

function placeAtMouse() {
  if (!gs.placeId) return;
  const x = mouseWorld.x, z = mouseWorld.z;
  if (Math.hypot(x, z) > FARM_R - 0.5) { showToast('Place inside the farm!'); return; }

  const pd = PLACEABLES.find(p => p.id === gs.placeId);
  const dd = DEFENSE_ITEMS.find(d => d.id === gs.placeId);
  const data = pd || dd;
  if (!data) return;



  const g = buildPlantMesh(data);
  const pos = new THREE.Vector3(x, 0, z);
  g.position.copy(pos); scene.add(g);

  if (pd) {
    gs.placedPlants.push({ mesh: g, data: pd, hp: pd.hp, maxHp: pd.hp, pos: pos.clone(), timer: 0 });
  } else {
    gs.defenses.push({ mesh: g, data: dd, pos: pos.clone(), timer: 0 });
  }

  gs.placeMode = false; gs.placeId = null;
  const ab = document.getElementById('attack-btn');
  if (ab) ab.textContent = '⚔️';
  showToast('Placed! 🌱');
}

function updatePlacedPlants(dt) {
  gs.placedPlants.forEach(p => {
    p.timer -= dt;

    // Passive effects every frame
    if (p.data.kind === 'freeze') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(p.pos) < p.data.range) e.slowTimer = Math.max(e.slowTimer, 0.1 + dt); });
    }
    if (p.data.kind === 'heal') {
      if (gs.playerPos.distanceTo(p.pos) < p.data.range) gs.playerHP = Math.min(gs.playerMaxHP, gs.playerHP + (p.data.heal || 5) * dt);
    }
    if (p.data.kind === 'passive') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(p.pos) < p.data.range) { e.hp -= p.data.dmg * dt; if (e.hp <= 0) killEnemy(e); } });
    }
    if (p.data.kind === 'mine') {
      const near = gs.enemies.find(e => e.pos.distanceTo(p.pos) < 1.5);
      if (near) {
        gs.enemies.forEach(e => { if (e.pos.distanceTo(p.pos) < p.data.aoe) dmgEnemy(e, p.data.dmg); });
        spawnFX(p.pos.clone(), 0xff8800, 0.5, p.data.aoe * 0.5);
        scene.remove(p.mesh); gs.placedPlants = gs.placedPlants.filter(x => x !== p);
      }
    }

    // Turret fire
    if (p.data.kind === 'turret' && p.timer <= 0) {
      const nearest = gs.enemies.slice().sort((a, b) => a.pos.distanceTo(p.pos) - b.pos.distanceTo(p.pos))[0];
      if (nearest && nearest.pos.distanceTo(p.pos) < p.data.range) {
        p.timer = p.data.cd || 1;
        const dir = nearest.pos.clone().sub(p.pos).normalize();
        spawnProj(p.pos.clone().add(new THREE.Vector3(0, 1, 0)), dir, 9, p.data, 'plant', p.data.range / 9);
      }
    }
  });

  // Campfire damage
  gs.defenses.forEach(d => {
    if (d.data.type === 'campfire') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(d.pos) < (d.data.range || 2.5)) { e.hp -= (d.data.dmg || 3) * dt; if (e.hp <= 0) killEnemy(e); } });
    }
    if (d.data.type === 'moat') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(d.pos) < 1.5) e.slowTimer = Math.max(e.slowTimer, 0.1 + dt); });
    }
    if (d.data.type === 'spike') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(d.pos) < (d.data.range || 1.6)) { e.hp -= (d.data.dmg || 18) * dt; if (e.hp <= 0) killEnemy(e); } });
    }
    if (d.data.type === 'arrowtwr') {
      d.timer -= dt;
      if (d.timer <= 0) {
        let tgt = null, best = d.data.range;
        gs.enemies.forEach(e => { const dist = e.pos.distanceTo(d.pos); if (dist < best) { best = dist; tgt = e; } });
        if (tgt) { dmgEnemy(tgt, d.data.dmg); spawnFX(tgt.pos.clone(), 0xffdd44, 0.25, 0.5); d.timer = d.data.cd; }
      }
    }
    if (d.data.type === 'bombtwr') {
      d.timer -= dt;
      if (d.timer <= 0) {
        let tgt = null, best = d.data.range;
        gs.enemies.forEach(e => { const dist = e.pos.distanceTo(d.pos); if (dist < best) { best = dist; tgt = e; } });
        if (tgt) {
          spawnFX(tgt.pos.clone(), 0xff6600, 0.7, 1.8);
          gs.enemies.forEach(e => { if (e.pos.distanceTo(tgt.pos) < (d.data.aoe || 3)) dmgEnemy(e, d.data.dmg); });
          d.timer = d.data.cd;
        }
      }
    }
    if (d.data.type === 'tesla') {
      d.timer -= dt;
      if (d.timer <= 0) {
        const inRange = gs.enemies.filter(e => e.pos.distanceTo(d.pos) < d.data.range);
        inRange.sort((a, b) => a.pos.distanceTo(d.pos) - b.pos.distanceTo(d.pos));
        inRange.slice(0, d.data.chains || 4).forEach(e => { dmgEnemy(e, d.data.dmg); spawnFX(e.pos.clone(), 0x88ffff, 0.3, 0.6); });
        if (inRange.length > 0) d.timer = d.data.cd;
      }
    }
  });
}

function updateEffects(dt) {
  gs.effects = gs.effects.filter(ef => {
    ef.timer -= dt;
    const pct = Math.max(0, ef.timer / ef.max);
    if (ef._orb) { ef._orb.material.opacity = pct * 0.85; ef._orb.scale.setScalar(0.4 + (1 - pct) * 1.2); }
    if (ef._ring) { ef._ring.material.opacity = pct * 0.9; ef._ring.scale.setScalar(1 + (1 - pct) * 3.5); }
    if (!ef._orb && ef.mesh && ef.mesh.material) ef.mesh.material.opacity = Math.max(0, pct * 0.7);
    if (ef.type === 'cloud') {
      ef.tickTimer = (ef.tickTimer || 0) - dt;
      if (ef.tickTimer <= 0) {
        ef.tickTimer = 0.5;
        gs.enemies.forEach(e => { if (e.pos.distanceTo(ef.pos) < ef.aoe) { dmgEnemy(e, ef.dmg * 0.5); } });
      }
    }
    if (ef.timer <= 0 && ef.mesh) { scene.remove(ef.mesh); return false; }
    return ef.timer > 0;
  });

  gs.floatingTexts = gs.floatingTexts.filter(ft => {
    ft.timer -= dt; ft.pos.y += dt * 1.5; ft.sp.position.copy(ft.pos);
    ft.sp.material.opacity = ft.timer / 1.4;
    if (ft.timer <= 0) { scene.remove(ft.sp); return false; }
    return true;
  });
}

function buildHotbar() {
  const hb = document.getElementById('hotbar');
  hb.innerHTML = '';
  gs.hotbar.forEach((id, i) => {
    const wd = id ? WEAPONS.find(w => w.id === id) : null;
    const d = document.createElement('div');
    d.className = 'hotslot' + (gs.activeSlot === i ? ' active' : '');
    d.innerHTML = `<span class="sk">${i + 1}</span>${wd ? `<span class="se">${wd.emoji}</span><span class="sn">${wd.name.split(' ')[0]}</span>` : '<span style="color:#444;font-size:20px">—</span>'}`;
    d.onclick = () => setSlot(i);
    hb.appendChild(d);
  });
}

function updateHUD() {
  const pct = gs.playerHP / gs.playerMaxHP;
  document.getElementById('hp-bar').style.width = (pct * 100) + '%';
  document.getElementById('hp-bar').style.background = pct > 0.5 ? '#4CAF50' : pct > 0.25 ? '#ff9800' : '#f44';
  document.getElementById('hp-txt').textContent = Math.ceil(gs.playerHP) + '/' + gs.playerMaxHP;
  document.getElementById('straw-txt').textContent = gs.straw;
  const wi = document.getElementById('wave-info');
  wi.textContent = gs.betweenWaves
    ? (gs.wave === 0 ? (isMobile ? 'Tap ▶ START WAVE' : 'Press SPACE to start!') : 'Wave ' + gs.wave + '/20 done!')
    : 'Wave ' + gs.wave + '/20 — ' + (gs.enemies.length + gs.spawnQueue.length) + ' enemies left';
  const wsb = document.getElementById('wave-start-btn');
  if (wsb) wsb.style.display = (isMobile && gameStarted && gs.betweenWaves) ? 'block' : 'none';
}

function showToast(msg, dur = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), dur);
}

function showWaveAnn(txt) {
  const el = document.getElementById('wave-ann');
  el.textContent = txt; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

function toggleShop(forceClose) {
  shopOpen = forceClose ? false : !shopOpen;
  document.getElementById('shop-overlay').classList.toggle('show', shopOpen);
  if (shopOpen) renderShop();
}

function shopTab(tab) {
  currentShopTab = tab;
  document.querySelectorAll('.shop-tab').forEach((el, i) => {
    el.classList.toggle('active', ['weapons', 'plants', 'defenses', 'barn'][i] === tab);
  });
  renderShop();
}

function renderShop() {
  document.getElementById('shop-straw').textContent = gs.straw;
  const c = document.getElementById('shop-content');
  c.innerHTML = '';

  if (currentShopTab === 'barn') {
    c.innerHTML = `
      <div style="grid-column:1/-1;color:#fff;margin-bottom:8px">
        <b>Your HP: ${Math.ceil(gs.playerHP)} / ${gs.playerMaxHP}</b> &nbsp;|&nbsp;
        <b>Barn HP: ${Math.ceil(gs.barnHP)} / ${gs.barnMaxHP}</b>
      </div>
      <div class="si ${gs.straw<10?'dim':gs.playerHP>=gs.playerMaxHP?'dim':''}" onclick="buyHealth(25,10)">
        <div class="ie">🧃</div><div class="in">Small Health Pack</div><div class="id">Restore 25 HP to yourself</div><div class="ic">🌾 10</div></div>
      <div class="si ${gs.straw<25?'dim':gs.playerHP>=gs.playerMaxHP?'dim':''}" onclick="buyHealth(75,25)">
        <div class="ie">❤️</div><div class="in">Large Health Pack</div><div class="id">Restore 75 HP to yourself</div><div class="ic">🌾 25</div></div>
      <div class="si ${gs.straw<50?'dim':''}" onclick="buyMaxHealth()">
        <div class="ie">💪</div><div class="in">Upgrade Max HP</div><div class="id">+25 max HP permanently</div><div class="ic">🌾 50</div></div>
      <div class="si ${gs.straw<30?'dim':gs.barnHP>=gs.barnMaxHP?'dim':''}" onclick="buyBarnRepair()">
        <div class="ie">🔨</div><div class="in">Repair Barn</div><div class="id">Restore 50 barn HP</div><div class="ic">🌾 30</div></div>
      <div class="si ${gs.straw<80?'dim':''}" onclick="buyBarnUpgrade()">
        <div class="ie">🏰</div><div class="in">Upgrade Barn</div><div class="id">+100 max barn HP</div><div class="ic">🌾 80</div></div>`;
    return;
  }

  const items = currentShopTab === 'weapons' ? WEAPONS : currentShopTab === 'plants' ? PLACEABLES : DEFENSE_ITEMS;
  items.forEach(item => {
    const owned = currentShopTab === 'weapons' && gs.ownedWeapons.has(item.id);
    const afford = gs.straw >= item.cost;
    const d = document.createElement('div');
    d.className = 'si' + (owned ? ' owned' : '') + (!afford && !owned ? ' dim' : '');
    d.innerHTML = `<div class="ie">${item.emoji}</div><div class="in">${item.name}</div><div class="id">${item.desc}</div>
      <div class="ic">${owned ? '✅ Owned — click to equip' : '🌾 ' + item.cost}</div>`;
    if (owned) d.onclick = () => equipWeapon(item.id);
    else if (afford) d.onclick = () => buyItem(item, currentShopTab);
    c.appendChild(d);
  });
}

function buyItem(item, tab) {
  if (gs.straw < item.cost) return;
  gs.straw -= item.cost;
  if (tab === 'weapons') {
    gs.ownedWeapons.add(item.id);
    equipWeapon(item.id);
  } else if (tab === 'plants') {
    autoPlacePlant(item);
    toggleShop(true);
  } else if (tab === 'defenses') {
    startPlace(item.id);
    toggleShop(true);
  }
  renderShop(); saveGame();
}

function autoPlacePlant(item) {
  // Pick a random spot on the farm away from the barn center
  let pos, tries = 0;
  do {
    const angle = Math.random() * Math.PI * 2;
    const r = 5 + Math.random() * (FARM_R - 7);
    pos = new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r);
    tries++;
  } while (tries < 20 && gs.placedPlants.some(p => p.pos.distanceTo(pos) < 2.5));

  const g = buildPlantMesh(item);
  if (item.support) {
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.18 }));
    glow.position.y = 0.9; g.add(glow);
  }
  g.position.copy(pos);
  scene.add(g);
  gs.placedPlants.push({ mesh: g, data: item, hp: item.hp, maxHp: item.hp, pos: pos.clone(), timer: 0 });
  showToast(item.name + ' placed on your farm! ' + (item.support ? '💚' : '⚔️'));
}

function equipWeapon(id) {
  const empty = gs.hotbar.indexOf(null);
  gs.hotbar[empty >= 0 ? empty : gs.activeSlot] = id;
  buildHotbar(); buildPlayerMesh();
  showToast('Equipped!'); renderShop();
}

function startPlace(id) {
  gs.placeMode = true; gs.placeId = id;
  const item = [...PLACEABLES, ...DEFENSE_ITEMS].find(x => x.id === id);
  const ab = document.getElementById('attack-btn');
  if (ab) ab.textContent = '🌱';
  showToast((isMobile ? 'Tap ▶ to place ' : 'Click to place ') + (item ? item.name : id) + '!', 3000);
}

function buyHealth(amount, cost) {
  if (gs.straw < cost) return;
  if (gs.playerHP >= gs.playerMaxHP) { showToast('You are already full health!'); return; }
  gs.straw -= cost;
  gs.playerHP = Math.min(gs.playerMaxHP, gs.playerHP + amount);
  showToast('❤️ +' + amount + ' HP restored!');
  renderShop(); saveGame();
}

function buyMaxHealth() {
  if (gs.straw < 50) return;
  gs.straw -= 50;
  gs.playerMaxHP += 25;
  gs.playerHP += 25;
  showToast('💪 Max HP increased to ' + gs.playerMaxHP + '!');
  renderShop(); saveGame();
}

function buyBarnRepair() {
  if (gs.straw < 30) return;
  gs.straw -= 30; gs.barnHP = Math.min(gs.barnMaxHP, gs.barnHP + 50);
  updateBarnRing(); showToast('Barn repaired! ❤️'); renderShop(); saveGame();
}

function buyBarnUpgrade() {
  if (gs.straw < 80) return;
  gs.straw -= 80; gs.barnMaxHP += 100; gs.barnHP += 100;
  updateBarnRing(); showToast('Barn upgraded! 🏰'); renderShop(); saveGame();
}

function showScreen(id) {
  const sc = document.getElementById('screen');
  const inn = document.getElementById('screen-inner');
  sc.classList.remove('hidden');
  if (id === 'menu') {
    inn.innerHTML = `<div class="stitle">🌱 Garden Farmers</div>
      <div class="ssub">Grow plants. Arm yourself. Defend your farm!</div>
      <button class="bbtn" onclick="showScreen('skins')">▶ New Game</button>
      ${hasSave() ? `<button class="bbtn" style="background:#1565c0" onclick="loadAndPlay()">📂 Continue</button>` : ''}
      <br><div style="color:#555;font-size:12px;margin-top:18px">A Titan Blade Games game • Made by Oliver</div>`;
  } else if (id === 'skins') {
    inn.innerHTML = `<div class="stitle" style="font-size:38px">Choose Your Farmer</div>
      <div class="skin-grid" id="skg"></div>
      <button class="bbtn" onclick="startGame()">Start Farming! 🌾</button>
      <button class="bbtn gray" onclick="showScreen('menu')">Back</button>`;
    const g = document.getElementById('skg');
    SKINS.forEach(s => {
      const d = document.createElement('div');
      d.className = 'skin-card' + (gs.skin === s.id ? ' sel' : '');
      d.innerHTML = `<div class="sc-e">${s.emoji}</div><div class="sc-n">${s.name}</div>`;
      d.onclick = () => { gs.skin = s.id; document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('sel')); d.classList.add('sel'); buildPlayerMesh(); };
      g.appendChild(d);
    });
  } else if (id === 'gameover') {
    inn.innerHTML = `<div class="stitle" style="color:#f44">💀 Farm Destroyed!</div>
      <div class="ssub">The scarecrows won this time...</div>
      <div style="color:#FFD700;font-size:18px;margin:10px">Waves: ${gs.wave} | Kills: ${gs.totalKills} | Straw: ${gs.straw}</div>
      <button class="bbtn" onclick="showScreen('skins')">🔄 Try Again</button>
      <button class="bbtn gray" onclick="showScreen('menu')">Menu</button>`;
  } else if (id === 'victory') {
    inn.innerHTML = `<div class="stitle">🏆 YOU WIN!</div>
      <div class="ssub">You defended your farm through all 20 waves!</div>
      <div style="color:#FFD700;font-size:20px;margin:10px">🌾 ${gs.straw} straw | 💀 ${gs.totalKills} scarecrows defeated</div>
      <button class="bbtn" onclick="showScreen('menu')">Main Menu</button>`;
  }
}

function startGame() {
  resetGame();
  document.getElementById('screen').classList.add('hidden');
  gameStarted = true;
  buildPlayerMesh(); buildHotbar(); updateHUD();
  showToast(isMobile ? 'Tap ▶ START WAVE to begin!' : 'Welcome! Press SPACE to start Wave 1!', 4000);
}

function loadAndPlay() {
  loadGame();
  document.getElementById('screen').classList.add('hidden');
  gameStarted = true;
  buildPlayerMesh(); buildHotbar(); updateHUD();
  showToast(isMobile ? 'Game loaded! Tap ▶ START WAVE.' : 'Game loaded! Press SPACE to continue.', 3000);
}

function endGame() {
  gameStarted = false; showScreen('gameover');
}

// ═══════════════════════════════════════
//  SAVE / LOAD
// ═══════════════════════════════════════
const SAVE_KEY = 'gardenFarmers_v1';
function hasSave() { return !!localStorage.getItem(SAVE_KEY); }

function saveGame() {
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    straw: gs.straw, wave: gs.wave, skin: gs.skin,
    barnHP: gs.barnHP, barnMaxHP: gs.barnMaxHP,
    playerHP: gs.playerHP, totalKills: gs.totalKills,
    ownedWeapons: [...gs.ownedWeapons], ownedPlaceables: [...gs.ownedPlaceables],
    hotbar: gs.hotbar,
  }));
}

function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    gs.straw = d.straw || 0; gs.wave = d.wave || 0; gs.skin = d.skin || 'classic';
    gs.barnHP = d.barnHP || 200; gs.barnMaxHP = d.barnMaxHP || 200;
    gs.playerHP = d.playerHP || 100; gs.totalKills = d.totalKills || 0;
    gs.ownedWeapons = new Set(d.ownedWeapons || ['carrot']);
    gs.ownedPlaceables = new Set(d.ownedPlaceables || []);
    gs.hotbar = d.hotbar || ['carrot', null, null, null, null];
    gs.betweenWaves = true;
    updateBarnRing();
  } catch (e) { console.error('Load error', e); }
}

function resetGame() {
  gs.enemies.forEach(e => scene.remove(e.mesh));
  gs.projectiles.forEach(p => scene.remove(p.mesh));
  gs.placedPlants.forEach(p => scene.remove(p.mesh));
  gs.defenses.forEach(d => scene.remove(d.mesh));
  gs.effects.forEach(ef => { if (ef.mesh) scene.remove(ef.mesh); });
  gs.floatingTexts.forEach(f => scene.remove(f.sp));
  gs.enemies = []; gs.projectiles = []; gs.placedPlants = [];
  gs.defenses = []; gs.effects = []; gs.floatingTexts = [];
  gs.playerHP = 100; gs.playerMaxHP = 100; gs.straw = 0;
  gs.playerPos.set(5, 0.75, 0); gs.playerVel.set(0, 0, 0);
  gs.wave = 0; gs.waveActive = false; gs.betweenWaves = true;
  gs.barnHP = 200; gs.barnMaxHP = 200;
  gs.ownedWeapons = new Set(['carrot']); gs.ownedPlaceables = new Set();
  gs.hotbar = ['carrot', null, null, null, null]; gs.activeSlot = 0;
  gs.totalKills = 0; attackCd = 0;
  gs.eventTimer = 90; gs.activeEvents = {}; gs._strawRainTick = 0;
  hideEventBanner();
  updateBarnRing();
}

// ═══════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════
let lastT = 0;
function loop(ts) {
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;

  if (gameStarted) {
    updatePlayer(dt);
    attackCd = Math.max(0, attackCd - dt);

    if (gs.waveActive) {
      gs.spawnTimer -= dt;
      if (gs.spawnTimer <= 0 && gs.spawnQueue.length > 0) {
        gs.spawnTimer = 0.8 + Math.random() * 0.5;
        spawnEnemy(gs.spawnQueue.shift());
      }
      updateEnemies(dt);
      checkWaveEnd();
    }
    updateProjectiles(dt);
    updatePlacedPlants(dt);
    updateEffects(dt);
    updateEventSystem(dt);

    // Camera follows player
    camera.position.lerp(gs.playerPos.clone().add(CAM_OFF), 0.06);
    camera.lookAt(gs.playerPos);
    updateHUD();
  }

  // Drift clouds slowly
  scene.children.forEach(c => { if (c._isCloud) { c.position.x += 0.4 * dt; if (c.position.x > 50) c.position.x = -50; } });
  // Spin windmill blades
  if (windmillBlades) windmillBlades.rotation.z += dt * 0.7;
  // Sway plants gently in the wind
  const t = Date.now() * 0.001;
  gs.placedPlants.forEach((p, i) => {
    if (!p.mesh) return;
    if (!p._swayPh)  p._swayPh  = i * 2.4 + Math.random() * 1.8;
    if (!p._swaySpd) p._swaySpd = 0.6 + (i % 5) * 0.16;
    const sp = p._swaySpd, ph = p._swayPh;
    p.mesh.rotation.z = Math.sin(t * sp + ph) * 0.15 + Math.sin(t * sp * 2.2 + ph + 1.3) * 0.05;
    p.mesh.rotation.x = Math.cos(t * sp * 0.87 + ph + 1.0) * 0.1 + Math.sin(t * sp * 1.7 + ph + 0.6) * 0.03;
  });

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════
updateBarnRing();
showScreen('menu');
requestAnimationFrame(ts => { lastT = ts; requestAnimationFrame(loop); });
</script>
</body>
