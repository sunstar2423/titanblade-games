<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Farmers - Titan Blade Games</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; user-select:none; }
#c { display:block; width:100vw; height:100vh; }
#ui { position:fixed; top:0; left:0; right:0; bottom:0; pointer-events:none; }

/* HUD */
#hud { position:absolute; top:12px; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:0 20px; }
.hud-block { background:rgba(0,0,0,0.65); border:2px solid #555; border-radius:10px; padding:6px 14px; color:#fff; font-size:14px; display:flex; align-items:center; gap:8px; }
#hp-bar-wrap { width:180px; height:14px; background:#333; border-radius:7px; overflow:hidden; }
#hp-bar { height:100%; background:#4CAF50; border-radius:7px; transition:width 0.2s; }

/* Hotbar */
#hotbar { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; pointer-events:all; }
.hotslot { width:72px; height:72px; background:rgba(0,0,0,0.7); border:2px solid #555; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; }
.hotslot.active { border-color:#FFD700; background:rgba(255,215,0,0.15); }
.hotslot .sk { position:absolute; top:3px; left:6px; font-size:11px; color:#888; }
.hotslot .se { font-size:30px; }
.hotslot .sn { font-size:9px; color:#ccc; margin-top:1px; text-align:center; }

/* Side buttons */
#side-panel { position:absolute; right:10px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; pointer-events:all; }
.side-btn { width:52px; height:52px; background:rgba(0,0,0,0.7); border:2px solid #555; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:22px; }
.side-btn:hover { border-color:#4CAF50; }

/* Shop overlay */
#shop-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.82); display:none; align-items:center; justify-content:center; pointer-events:all; z-index:10; }
#shop-overlay.show { display:flex; }
#shop-box { background:#1a2a1a; border:3px solid #4CAF50; border-radius:16px; padding:24px; width:720px; max-height:82vh; overflow-y:auto; }
.shop-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.shop-tab { padding:7px 18px; border:2px solid #555; border-radius:8px; cursor:pointer; color:#ccc; background:rgba(255,255,255,0.05); font-size:14px; }
.shop-tab.active { border-color:#4CAF50; color:#fff; background:rgba(76,175,80,0.2); }
.shop-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.si { background:rgba(255,255,255,0.05); border:2px solid #333; border-radius:10px; padding:10px; text-align:center; cursor:pointer; transition:border-color 0.15s; }
.si:hover { border-color:#FFD700; }
.si.owned { border-color:#4CAF50; }
.si.dim { opacity:0.35; cursor:default; }
.si .ie { font-size:34px; }
.si .in { color:#fff; font-size:11px; font-weight:bold; margin:3px 0; }
.si .id { color:#aaa; font-size:9px; font-style:italic; }
.si .ic { color:#FFD700; font-size:12px; font-weight:bold; margin-top:3px; }

/* Screen overlays */
#screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.88); pointer-events:all; z-index:20; }
#screen.hidden { display:none; }
.stitle { font-size:58px; font-weight:bold; color:#4CAF50; text-shadow:0 0 30px #4CAF50; margin-bottom:12px; }
.ssub { color:#aaa; font-size:18px; margin-bottom:28px; }
.bbtn { padding:14px 44px; font-size:20px; background:#4CAF50; color:#fff; border:none; border-radius:12px; cursor:pointer; margin:6px; font-weight:bold; }
.bbtn:hover { filter:brightness(1.15); }
.bbtn.red { background:#cc2222; }
.bbtn.gray { background:#555; }
.skin-grid { display:flex; gap:14px; margin:14px 0; }
.skin-card { width:95px; padding:10px; background:rgba(255,255,255,0.05); border:3px solid #555; border-radius:10px; cursor:pointer; text-align:center; }
.skin-card.sel { border-color:#FFD700; background:rgba(255,215,0,0.1); }
.skin-card .sc-e { font-size:32px; }
.skin-card .sc-n { color:#fff; font-size:10px; margin-top:4px; }

/* Toast */
#toast { position:absolute; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:9px 22px; border-radius:20px; font-size:15px; pointer-events:none; opacity:0; transition:opacity 0.3s; white-space:nowrap; }
#toast.show { opacity:1; }

/* Wave announce */
#wave-ann { position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); font-size:52px; font-weight:bold; color:#ff4444; text-shadow:0 0 20px #ff4444; pointer-events:none; opacity:0; transition:opacity 0.4s; }
#wave-ann.show { opacity:1; }

/* Controls hint */
#hint { position:absolute; bottom:100px; right:12px; background:rgba(0,0,0,0.6); border-radius:8px; padding:8px 12px; color:#777; font-size:11px; line-height:1.9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-block">❤️ <div id="hp-bar-wrap"><div id="hp-bar"></div></div> <span id="hp-txt">100/100</span></div>
    <div class="hud-block" id="wave-info">Press SPACE to start!</div>
    <div class="hud-block">🌾 <span id="straw-txt">0</span></div>
  </div>
  <div id="hotbar"></div>
  <div id="side-panel">
    <div class="side-btn" title="Shop (B)" onclick="toggleShop()">🛒</div>
  </div>
  <div id="hint">WASD — Move<br>Click — Attack<br>1-5 — Switch weapon<br>B — Shop<br>SPACE — Start Wave</div>
  <div id="toast"></div>
  <div id="wave-ann"></div>

  <!-- Shop -->
  <div id="shop-overlay">
    <div id="shop-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="color:#4CAF50;font-size:22px">🛒 Farm Shop</h2>
        <div style="color:#FFD700;font-size:17px">🌾 <span id="shop-straw">0</span></div>
        <button onclick="toggleShop()" style="background:#c33;color:#fff;border:none;padding:5px 13px;border-radius:7px;cursor:pointer;font-size:15px">✕</button>
      </div>
      <div class="shop-tabs">
        <div class="shop-tab active" onclick="shopTab('weapons')">⚔️ Weapons</div>
        <div class="shop-tab" onclick="shopTab('plants')">🌱 Placeable</div>
        <div class="shop-tab" onclick="shopTab('defenses')">🏰 Defenses</div>
        <div class="shop-tab" onclick="shopTab('barn')">🏚️ Barn</div>
      </div>
      <div id="shop-content" class="shop-grid"></div>
    </div>
  </div>

  <!-- Screen -->
  <div id="screen">
    <div id="screen-inner"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════
//  THREE.JS SETUP
// ═══════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 35, 65);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
const CAM_OFF = new THREE.Vector3(0, 18, 13);
camera.position.copy(CAM_OFF);
camera.lookAt(0, 0, 0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Lighting
scene.add(new THREE.HemisphereLight(0xb0e0ff, 0x4a7a00, 0.7)); // sky/ground bounce
const sun = new THREE.DirectionalLight(0xfff8e0, 1.6);
sun.position.set(15, 25, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -35; sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35;  sun.shadow.camera.bottom = -35;
sun.shadow.bias = -0.001;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8899ff, 0.35); // cool fill from opposite
fill.position.set(-10, 8, -10);
scene.add(fill);

// ═══════════════════════════════════════
//  FARM SCENE
// ═══════════════════════════════════════
const FARM_R = 18;

// Outer ground — canvas grass texture
(function() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a9a30'; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 600; i++) {
    const x = Math.random()*256, y = Math.random()*256;
    ctx.fillStyle = Math.random() > 0.5 ? '#3d8a25' : '#5cb040';
    ctx.fillRect(x, y, 3, 3);
  }
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(8, 8);
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0 }));
  gnd.rotation.x = -Math.PI / 2; gnd.receiveShadow = true; scene.add(gnd);
})();

// Dirt farm circle — canvas soil texture
(function() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7a5410'; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 800; i++) {
    const x = Math.random()*256, y = Math.random()*256;
    ctx.fillStyle = Math.random() > 0.5 ? '#6a4408' : '#8b6318';
    ctx.fillRect(x, y, Math.random()*5+1, Math.random()*2+1);
  }
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(4, 4);
  const farm = new THREE.Mesh(new THREE.CircleGeometry(FARM_R, 48), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.98, metalness: 0 }));
  farm.rotation.x = -Math.PI / 2; farm.position.y = 0.01; farm.receiveShadow = true; scene.add(farm);
})();

// Fence posts + rails around edge
const FENCE_MAT = new THREE.MeshStandardMaterial({ color: 0x8B5E3C, roughness: 0.9, metalness: 0 });
const POST_N = 24;
for (let i = 0; i < POST_N; i++) {
  const a = (i / POST_N) * Math.PI * 2;
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.1, 0.22), FENCE_MAT);
  post.position.set(Math.cos(a) * FARM_R, 0.55, Math.sin(a) * FARM_R);
  post.castShadow = true; scene.add(post);
  // Rail to next post
  const a2 = ((i + 1) / POST_N) * Math.PI * 2;
  const x1 = Math.cos(a) * FARM_R, z1 = Math.sin(a) * FARM_R;
  const x2 = Math.cos(a2) * FARM_R, z2 = Math.sin(a2) * FARM_R;
  const mid = new THREE.Vector3((x1+x2)/2, 0.85, (z1+z2)/2);
  const len = Math.sqrt((x2-x1)**2 + (z2-z1)**2);
  const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.1, 0.1), FENCE_MAT);
  rail.position.copy(mid); rail.rotation.y = -Math.atan2(z2-z1, x2-x1); scene.add(rail);
  // Lower rail
  const rail2 = rail.clone(); rail2.position.y = 0.45; scene.add(rail2);
}

// Barn (center) — improved
const barnGrp = new THREE.Group();
const mkBarn = (geo, color, rx=0) => { const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness:0.85, metalness:0 })); m.castShadow=true; m.receiveShadow=true; if(rx) m.rotation.y=rx; return m; };
const barnBody = mkBarn(new THREE.BoxGeometry(5, 3.2, 3.5), 0xc0392b);
barnBody.position.y = 1.6; barnGrp.add(barnBody);
// Roof gable
const barnRoof = mkBarn(new THREE.CylinderGeometry(0.01, 3.8, 2.5, 4), 0x7b3a10, Math.PI/4);
barnRoof.position.y = 4.45; barnGrp.add(barnRoof);
// White trim
const trim = mkBarn(new THREE.BoxGeometry(5.1, 0.18, 3.6), 0xffffff);
trim.position.y = 3.29; barnGrp.add(trim);
// Door
const barnDoor = mkBarn(new THREE.BoxGeometry(1.1, 1.9, 0.12), 0x5C3317);
barnDoor.position.set(0, 0.95, 1.82); barnGrp.add(barnDoor);
// Door arch top
const arch = mkBarn(new THREE.CylinderGeometry(0.55, 0.55, 0.12, 8, 1, false, 0, Math.PI), 0x5C3317);
arch.rotation.z = Math.PI/2; arch.position.set(0, 1.9, 1.82); barnGrp.add(arch);
// Windows
[-1.6, 1.6].forEach(x => {
  const win = mkBarn(new THREE.BoxGeometry(0.7, 0.7, 0.1), 0x87ceeb);
  win.position.set(x, 2.2, 1.82); barnGrp.add(win);
  const wframe = mkBarn(new THREE.BoxGeometry(0.75, 0.75, 0.06), 0xffffff);
  wframe.position.set(x, 2.2, 1.86); barnGrp.add(wframe);
});
// Chimney
const chim = mkBarn(new THREE.BoxGeometry(0.4, 1.2, 0.4), 0x884422);
chim.position.set(1.5, 5.2, 0); barnGrp.add(chim);
scene.add(barnGrp);

// Barn HP ring
let barnRing = null;
function updateBarnRing() {
  if (barnRing) scene.remove(barnRing);
  const pct = Math.max(0, gs.barnHP / gs.barnMaxHP);
  const mat = new THREE.MeshBasicMaterial({ color: pct > 0.5 ? 0x4CAF50 : pct > 0.25 ? 0xff9800 : 0xff2222 });
  barnRing = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.15, 8, 32, Math.PI * 2 * pct), mat);
  barnRing.rotation.x = -Math.PI / 2; barnRing.position.y = 0.05;
  scene.add(barnRing);
}

// Helper: make a tree with layered canopy
function makeTree(x, z, scale=1) {
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6B4226, roughness:0.9 });
  const leafMat  = new THREE.MeshStandardMaterial({ color: 0x2d8b2d, roughness:0.95 });
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.18*scale, 0.28*scale, 1.8*scale, 8), trunkMat);
  tr.position.y = 0.9*scale; tr.castShadow = true; g.add(tr);
  [[1.6*scale, 2.0*scale, 2.1*scale], [1.15*scale, 1.6*scale, 3.1*scale], [0.7*scale, 1.1*scale, 4.0*scale]].forEach(([r, h, y]) => {
    const lv = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), leafMat);
    lv.position.y = y; lv.castShadow = true; g.add(lv);
  });
  g.position.set(x, 0, z); scene.add(g);
}
// Trees in corners and mid-edges
[-24,-18,18,24].forEach(x => [-24,-18,18,24].forEach(z => {
  if (Math.abs(x)===24 || Math.abs(z)===24) makeTree(x, z, 0.8 + Math.random()*0.5);
}));

// Hay bales scattered outside fence
const hayMat = new THREE.MeshStandardMaterial({ color: 0xd4a830, roughness: 0.95 });
[[22,5],[-22,-8],[12,-24],[-15,20]].forEach(([x,z]) => {
  const hay = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.0, 12), hayMat);
  hay.rotation.z = Math.PI/2; hay.position.set(x, 0.6, z); hay.castShadow = true; scene.add(hay);
});

// Clouds
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness:1, transparent:true, opacity:0.88 });
[[0,22,-15],[-12,24,8],[18,20,-5],[-5,26,18]].forEach(([x,y,z]) => {
  const cg = new THREE.Group();
  [[0,0,0,1.8],[1.6,0.3,0,1.3],[-1.5,0,0,1.2],[0.8,0.5,1.0,1.0],[-0.7,0.4,-0.9,0.9]].forEach(([cx,cy,cz,r]) => {
    const sp = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 7), cloudMat);
    sp.position.set(cx,cy,cz); cg.add(sp);
  });
  cg.position.set(x, y, z); cg._isCloud = true; scene.add(cg);
});

// ═══════════════════════════════════════
//  GAME DATA
// ═══════════════════════════════════════
const SKINS = [
  { id:'classic', name:'Classic',  emoji:'🧑‍🌾', body:0x8b6914, hat:0x5c3317 },
  { id:'ninja',   name:'Ninja',    emoji:'🥷',   body:0x1a1a1a, hat:0xff0000 },
  { id:'knight',  name:'Knight',   emoji:'⚔️',   body:0xb8b8b8, hat:0x777777 },
  { id:'wizard',  name:'Wizard',   emoji:'🧙',   body:0x4b0082, hat:0x8b00ff },
  { id:'robot',   name:'Robot',    emoji:'🤖',   body:0x888888, hat:0x00ccff },
];

const WEAPONS = [
  { id:'carrot',  name:'Carrot Spear',         emoji:'🥕', cost:0,  desc:'Fast pierce through enemies',   kind:'melee',    dmg:15, range:2.5, cd:0.4,  color:0xff6600 },
  { id:'pumpkin', name:'Pumpkin Bomb',          emoji:'🎃', cost:30, desc:'Thrown AoE explosion',          kind:'throw',    dmg:40, range:12,  cd:1.5,  aoe:3.0, color:0xff8c00 },
  { id:'apple',   name:'Speed Apple',           emoji:'🍎', cost:25, desc:'Bounces between 3 enemies',     kind:'bounce',   dmg:20, range:14,  cd:0.6,  bounces:3, color:0xff2222 },
  { id:'melon',   name:'Watermelon Hammer',     emoji:'🍉', cost:40, desc:'Slow heavy knockback slam',     kind:'heavy',    dmg:65, range:2.2, cd:1.8,  color:0x228b22 },
  { id:'corn',    name:'Corn Blast',            emoji:'🌽', cost:35, desc:'Shotgun burst up close',        kind:'shotgun',  dmg:8,  range:6,   cd:0.9,  pellets:7, color:0xffd700 },
  { id:'berry',   name:'Strawberry Boomerang',  emoji:'🍓', cost:30, desc:'Returns and hits twice',        kind:'boomerang',dmg:25, range:14,  cd:1.0,  color:0xff1493 },
  { id:'tomato',  name:'Tomato Splat',          emoji:'🍅', cost:20, desc:'Slows enemies in a big splat',  kind:'slow',     dmg:12, range:12,  cd:1.0,  aoe:2.5, slow:0.6, slowDur:3, color:0xff4500 },
  { id:'bean',    name:'Beanstalk Whip',        emoji:'🌱', cost:25, desc:'Extra long melee reach',        kind:'melee',    dmg:22, range:6.5, cd:0.7,  color:0x32cd32 },
  { id:'mush',    name:'Mushroom Cloud',        emoji:'🍄', cost:35, desc:'Lingering poison cloud AoE',    kind:'cloud',    dmg:4,  range:4,   cd:1.2,  aoe:4, dur:5, color:0x9b59b6 },
  { id:'sun',     name:'Sunflower Ray',         emoji:'🌻', cost:50, desc:'Giant instant light beam',      kind:'beam',     dmg:80, range:18,  cd:2.5,  color:0xffd700 },
];

const PLACEABLES = [
  { id:'flytrap',   name:'Carnivorous Plant',  emoji:'🪴', cost:40, desc:'⚔️ Grabs & chomps nearby foes',          kind:'turret', dmg:30, range:2.2, cd:2.0, hp:80,  color:0x006400 },
  { id:'cactus',    name:'Cactus Turret',      emoji:'🌵', cost:30, desc:'⚔️ Auto-fires thorns at enemies',           kind:'turret', dmg:12, range:5.5, cd:0.5, hp:60,  color:0x2e8b57 },
  { id:'pea',       name:'Pea Shooter',        emoji:'💚', cost:20, desc:'⚔️ Rapid fire peas at nearest foe',         kind:'turret', dmg:8,  range:9,   cd:0.3, hp:50,  color:0x7cfc00 },
  { id:'thorn',     name:'Thorn Bush',         emoji:'🌿', cost:15, desc:'⚔️ Hurts enemies walking through it',       kind:'passive',dmg:20, range:1.8,        hp:40,  color:0x556b2f },
  { id:'fireflwr',  name:'Fire Flower',        emoji:'🌸', cost:35, desc:'⚔️ Fireballs that burn over time',          kind:'turret', dmg:15, range:8,   cd:1.0, hp:55,  color:0xff4500, burn:4 },
  { id:'ice',       name:'Ice Plant',          emoji:'❄️', cost:25, desc:'💚 Support — slows nearby enemies way down',kind:'freeze', dmg:0,  range:4,          hp:45,  color:0x00bfff, support:true },
  { id:'mine',      name:'Mine Mushroom',      emoji:'💣', cost:15, desc:'⚔️ Explodes when enemy steps on it',        kind:'mine',   dmg:50, range:3,   aoe:3,  hp:1,   color:0xff8c00 },
  { id:'herb',      name:'Healing Herb',       emoji:'🌿', cost:30, desc:'💚 Support — heals YOU 5 HP/s when nearby', kind:'heal',   heal:5, range:3,          hp:60,  color:0x00ff7f, support:true },
  { id:'lightning', name:'Lightning Plant',    emoji:'⚡', cost:45, desc:'⚔️ Zaps enemies, chains to nearby foes',    kind:'turret', dmg:25, range:6,   cd:1.5, hp:50,  color:0xffff00, chains:3 },
  { id:'sunflwr',   name:'Giant Sunflower',    emoji:'🌻', cost:50, desc:'⚔️ Long-range slow powerful cannon',        kind:'turret', dmg:45, range:13,  cd:2.2, hp:90,  color:0xffd700 },
];

const DEFENSE_ITEMS = [
  { id:'fence',    name:'Fence',    emoji:'🪵', cost:10, desc:'Slows/blocks enemy path',   type:'fence',    hp:50,  color:0x8b4513 },
  { id:'campfire', name:'Campfire', emoji:'🔥', cost:15, desc:'Burns nearby enemies 3/s',  type:'campfire', hp:999, dmg:3, range:2.5, color:0xff4500 },
  { id:'moat',     name:'Moat',     emoji:'💧', cost:20, desc:'Slows enemies crossing it', type:'moat',     hp:999, slow:0.7, color:0x4169e1 },
];

  { id:'basic',  name:'Basic Scarecrow',        hp:40,  spd:2.0, dmg:5,  straw:5,   sz:1,   color:0xd2b48c },

// Mouse world position

const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const mouseWorld = new THREE.Vector3();
document.getElementById('c').addEventListener('mousemove', e => {
  const mx = (e.clientX / window.innerWidth) * 2 - 1;
  const my = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera({ x: mx, y: my }, camera);
  raycaster.ray.intersectPlane(groundPlane, mouseWorld);
});

// ═══════════════════════════════════════
//  PLAYER
// ═══════════════════════════════════════
function buildPlayerMesh() {
  if (playerMesh) scene.remove(playerMesh);
  const sk = SKINS.find(s => s.id === gs.skin) || SKINS[0];
  const g = new THREE.Group();
  const mk = (geo, color, py, px=0, pz=0) => {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness:0.75, metalness: color===0xb8b8b8?0.4:0 }));
    m.position.set(px, py, pz); m.castShadow = true; return m;
  };
  // Legs
  [-0.18, 0.18].forEach(x => {
    const leg = mk(new THREE.BoxGeometry(0.26, 0.55, 0.26), 0x1a3a88, 0.28); leg.position.x = x; g.add(leg);
    const boot = mk(new THREE.BoxGeometry(0.28, 0.18, 0.34), 0x2a1a00, 0.0); boot.position.set(x, 0, 0.04); g.add(boot);
  });
  // Body / overalls
  g.add(mk(new THREE.BoxGeometry(0.82, 1.05, 0.48), sk.body, 0.88));
  // Suspenders
  g.add(mk(new THREE.BoxGeometry(0.08, 0.6, 0.05), 0xffdd44, 1.05, -0.2, 0.25));
  g.add(mk(new THREE.BoxGeometry(0.08, 0.6, 0.05), 0xffdd44, 1.05,  0.2, 0.25));
  // Arms
  [-0.55, 0.55].forEach(x => {
    const arm = mk(new THREE.BoxGeometry(0.24, 0.62, 0.24), sk.body, 0.82); arm.position.x = x; g.add(arm);
    const hand = mk(new THREE.SphereGeometry(0.14, 6, 6), 0xffcc99, 0.52); hand.position.x = x; g.add(hand);
  });
  // Head
  g.add(mk(new THREE.BoxGeometry(0.58, 0.58, 0.58), 0xffcc99, 1.64));
  // Eyes
  [-0.13, 0.13].forEach(x => { const ey = mk(new THREE.SphereGeometry(0.07, 5, 5), 0x222222, 1.68); ey.position.set(x, 0, 0.3); g.add(ey); });
  // Hat brim
  g.add(mk(new THREE.CylinderGeometry(0.52, 0.52, 0.08, 14), sk.hat, 2.0));
  // Hat top
  g.add(mk(new THREE.CylinderGeometry(0.32, 0.36, 0.42, 12), sk.hat, 2.25));
  // Weapon
  const wid = gs.hotbar[gs.activeSlot];
  if (wid) {
    const wd = WEAPONS.find(w => w.id === wid);
    if (wd) {
      const wm = mk(new THREE.BoxGeometry(0.16, 0.16, 1.0), wd.color, 0.72, 0.55, -0.1);
      g.add(wm);
    }
  }
  playerMesh = g;
  scene.add(playerMesh);
}

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyB') toggleShop();
  if (e.code === 'Digit1') setSlot(0);
  if (e.code === 'Digit2') setSlot(1);
  if (e.code === 'Digit3') setSlot(2);
  if (e.code === 'Digit4') setSlot(3);
  if (e.code === 'Digit5') setSlot(4);
  if (e.code === 'Escape') { toggleShop(true); gs.placeMode = false; gs.placeId = null; }
  if (e.code === 'Space' && gameStarted && gs.betweenWaves && !shopOpen) {
    e.preventDefault(); startNextWave();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

document.getElementById('c').addEventListener('click', () => {
  if (!gameStarted) return;
  if (gs.placeMode) { placeAtMouse(); return; }
  doAttack();
});

function setSlot(i) {
  gs.activeSlot = i;
  buildPlayerMesh();
  buildHotbar();
}

// ═══════════════════════════════════════
//  PLAYER UPDATE
// ═══════════════════════════════════════
function updatePlayer(dt) {
  const spd = 7;
  if (keys['KeyW'] || keys['ArrowUp'])    gs.playerVel.z -= spd * dt;
  if (keys['KeyS'] || keys['ArrowDown'])  gs.playerVel.z += spd * dt;
  if (keys['KeyA'] || keys['ArrowLeft'])  gs.playerVel.x -= spd * dt;
  if (keys['KeyD'] || keys['ArrowRight']) gs.playerVel.x += spd * dt;
  gs.playerVel.multiplyScalar(0.78);
  gs.playerPos.add(gs.playerVel);
  // clamp to farm
  const r = Math.hypot(gs.playerPos.x, gs.playerPos.z);
  if (r > FARM_R - 0.6) {
    gs.playerPos.x = (gs.playerPos.x / r) * (FARM_R - 0.6);
    gs.playerPos.z = (gs.playerPos.z / r) * (FARM_R - 0.6);
    gs.playerVel.set(0, 0, 0);
  }
  gs.playerPos.y = 0.75;
  if (playerMesh) {
    playerMesh.position.copy(gs.playerPos);
    // face mouse
    const dx = mouseWorld.x - gs.playerPos.x;
    const dz = mouseWorld.z - gs.playerPos.z;
    if (Math.hypot(dx, dz) > 0.1) playerMesh.rotation.y = Math.atan2(dx, dz);
    // bob
    playerMesh.position.y = gs.playerPos.y + Math.sin(Date.now() * 0.008) * 0.04;
  }
}

// ═══════════════════════════════════════
//  FLOATING TEXT
// ═══════════════════════════════════════
function floatText(pos, text, color) {
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 40;
  const x = cv.getContext('2d');
  x.fillStyle = '#' + color.toString(16).padStart(6, '0');
  x.font = 'bold 26px Arial'; x.textAlign = 'center';
  x.fillText(text, 64, 30);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true }));
  sp.scale.set(2, 0.625, 1);
  sp.position.copy(pos).add(new THREE.Vector3(0, 1.5, 0));
  scene.add(sp);
  gs.floatingTexts.push({ sp, pos: sp.position.clone(), timer: 1.4 });
}

function spawnFX(pos, color, dur, size) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(size, 8, 8),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 })
  );
  m.position.copy(pos); scene.add(m);
  gs.effects.push({ mesh: m, timer: dur, max: dur });
}

// ═══════════════════════════════════════
//  ATTACK
// ═══════════════════════════════════════
function doAttack() {
  if (!gameStarted || gs.betweenWaves || attackCd > 0) return;
  const wid = gs.hotbar[gs.activeSlot];
  if (!wid) return;
  const wd = WEAPONS.find(w => w.id === wid);
  if (!wd) return;
  attackCd = wd.cd;

  let dir = new THREE.Vector3(mouseWorld.x - gs.playerPos.x, 0, mouseWorld.z - gs.playerPos.z);
  // Auto-aim toward nearest enemy if mouse hasn't been moved over canvas yet
  if (dir.length() < 0.5 && gs.enemies.length > 0) {
    const nearest = gs.enemies.reduce((a, b) => a.pos.distanceTo(gs.playerPos) < b.pos.distanceTo(gs.playerPos) ? a : b);
    dir = nearest.pos.clone().sub(gs.playerPos).setY(0);
  }
  dir.normalize();
  spawnFX(gs.playerPos.clone().add(dir), wd.color, 0.2, 0.3);

  if (wd.kind === 'melee' || wd.kind === 'heavy') {
    const hits = new Set();
    gs.enemies.forEach(e => {
      if (e.pos.distanceTo(gs.playerPos.clone().add(dir.clone().multiplyScalar(wd.range * 0.5))) < wd.range * 0.7 + e.data.sz) {
        hits.add(e);
      }
    });
    hits.forEach(e => {
      dmgEnemy(e, wd.dmg);
      if (wd.kind === 'heavy') e.vel.add(dir.clone().multiplyScalar(6));
    });
  } else if (wd.kind === 'beam') {
    for (let t = 0; t < wd.range; t += 0.5) {
      const hp = gs.playerPos.clone().add(dir.clone().multiplyScalar(t)).add(new THREE.Vector3(0, 0.5, 0));
      gs.enemies.forEach(e => { if (!e._beamHit && e.pos.distanceTo(hp) < 1.0 + e.data.sz) { e._beamHit = true; dmgEnemy(e, wd.dmg); } });
    }
    gs.enemies.forEach(e => { e._beamHit = false; });
    spawnFX(gs.playerPos.clone().add(dir.clone().multiplyScalar(wd.range / 2)).add(new THREE.Vector3(0, 0.5, 0)), wd.color, 0.3, wd.range / 2);
  } else if (wd.kind === 'cloud') {
    const cp = gs.playerPos.clone().add(dir.clone().multiplyScalar(3));
    spawnFX(cp, wd.color, wd.dur, wd.aoe);
    gs.effects.push({ type: 'cloud', pos: cp, dmg: wd.dmg, aoe: wd.aoe, timer: wd.dur, max: wd.dur, mesh: null, tickTimer: 0 });
  } else if (wd.kind === 'shotgun') {
    for (let i = 0; i < (wd.pellets || 7); i++) {
      const sp = (Math.random() - 0.5) * 0.8;
      const pd = new THREE.Vector3(dir.x + sp, 0, dir.z + sp * 0.5).normalize();
      spawnProj(gs.playerPos.clone().add(new THREE.Vector3(0, 0.8, 0)), pd, 13, wd, 'weapon', wd.range / 13);
    }
  } else {
    spawnProj(gs.playerPos.clone().add(new THREE.Vector3(0, 0.8, 0)), dir, 10, wd, 'weapon', wd.range / 10);
  }
}

function spawnProj(pos, dir, spd, data, owner, life) {
  const col = data.color || 0xffffff;
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.26, 8, 8),
    new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.7, roughness: 0.3, metalness: 0.1 })
  );
  m.position.copy(pos); scene.add(m);
  gs.projectiles.push({ mesh: m, pos: pos.clone(), vel: dir.clone().multiplyScalar(spd), data, owner, timer: life, hitSet: new Set(), bounceLeft: data.bounces || 0 });
}

function dmgEnemy(e, dmg) {
  const armor = e.data.armor || 0;
  const actual = Math.round(dmg * (1 - armor));
  e.hp -= actual;
  floatText(e.pos.clone(), '-' + actual, 0xff4444);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  if (e._dead) return; e._dead = true;
  scene.remove(e.mesh);
  gs.enemies = gs.enemies.filter(x => x !== e);
  gs.straw += e.data.straw;
  gs.totalKills++;
  gs.waveEnemiesLeft = Math.max(0, gs.waveEnemiesLeft - 1);
  floatText(e.pos.clone(), '+' + e.data.straw + '🌾', 0xFFD700);
}

// ═══════════════════════════════════════
//  PROJECTILE UPDATE
// ═══════════════════════════════════════
function updateProjectiles(dt) {
  gs.projectiles = gs.projectiles.filter(p => {
    p.timer -= dt;
    if (p.timer <= 0) {
      if (p.data.aoe && p.owner === 'weapon') {
        gs.enemies.forEach(e => { if (p.pos.distanceTo(e.pos) < p.data.aoe) dmgEnemy(e, p.data.dmg * 0.6); });
        spawnFX(p.pos.clone(), p.data.color, 0.35, p.data.aoe * 0.5);
      }
      scene.remove(p.mesh); return false;
    }
    p.pos.add(p.vel.clone().multiplyScalar(dt));
    p.mesh.position.copy(p.pos);

    if (p.owner === 'weapon' || p.owner === 'plant') {
      for (const e of gs.enemies) {
        if (p.hitSet.has(e)) continue;
        if (p.pos.distanceTo(e.pos) < 0.5 + e.data.sz) {
          p.hitSet.add(e);
          dmgEnemy(e, p.data.dmg);
          if (p.data.slow) e.slowTimer = p.data.slowDur || 2;
          if (p.data.burn) e.burnTimer = p.data.burn;
          // AoE on impact
          if (p.data.aoe) {
            gs.enemies.forEach(e2 => {
              if (!p.hitSet.has(e2) && p.pos.distanceTo(e2.pos) < p.data.aoe) { dmgEnemy(e2, p.data.dmg * 0.6); p.hitSet.add(e2); }
            });
            spawnFX(p.pos.clone(), p.data.color, 0.35, p.data.aoe * 0.5);
          }
          // bounce
          if (p.bounceLeft > 0) {
            p.bounceLeft--;
            const next = gs.enemies.filter(x => !p.hitSet.has(x)).sort((a, b) => a.pos.distanceTo(p.pos) - b.pos.distanceTo(p.pos))[0];
            if (next) { p.vel = next.pos.clone().sub(p.pos).normalize().multiplyScalar(10); break; }
          }
          if (p.data.kind !== 'melee') { scene.remove(p.mesh); return false; }
        }
      }
    }
    return p.timer > 0;
  });
}

// ═══════════════════════════════════════
//  ENEMY SPAWN + UPDATE
// ═══════════════════════════════════════
function spawnEnemy(typeId) {
  const data = ENEMY_TYPES.find(e => e.id === typeId);
  if (!data) return;
  const angle = Math.random() * Math.PI * 2;
  const r = FARM_R + 2 + Math.random() * 3;
  const pos = new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r);
  const sz = data.sz || 1;
  const g = new THREE.Group();
  const mk = (geo, col, py, px=0, pz=0) => {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, roughness:0.9, metalness: col===0x888888?0.3:0 }));
    m.position.set(px, py, pz); m.castShadow = true; return m;
  };
  const isBoss = data.id === 'boss';
  // Stick body (post)
  g.add(mk(new THREE.CylinderGeometry(0.1*sz, 0.12*sz, 2.0*sz, 6), 0x8B5E3C, 1.0*sz));
  // Shirt/body
  g.add(mk(new THREE.BoxGeometry(0.7*sz, 0.9*sz, 0.35*sz), data.color, 0.95*sz));
  // Cross arms
  g.add(mk(new THREE.BoxGeometry(1.7*sz, 0.22*sz, 0.22*sz), data.color, 1.3*sz));
  g.add(mk(new THREE.BoxGeometry(0.28*sz, 0.55*sz, 0.22*sz), data.color, 0.7*sz, -0.45*sz)); // left cuff
  g.add(mk(new THREE.BoxGeometry(0.28*sz, 0.55*sz, 0.22*sz), data.color, 0.7*sz,  0.45*sz)); // right cuff
  // Head (pumpkin head for boss, burlap sack otherwise)
  const headCol = isBoss ? 0xff4400 : 0xd4a830;
  g.add(mk(new THREE.SphereGeometry(0.38*sz, 8, 8), headCol, 2.2*sz));
  // Eyes (glowing)
  const eyeCol = isBoss ? 0xff0000 : 0x222200;
  [-0.13*sz, 0.13*sz].forEach(x => { const ey = mk(new THREE.SphereGeometry(0.07*sz, 5, 5), eyeCol, 2.25*sz, x); g.add(ey); });
  // Hat — wide brim for scarecrow look
  g.add(mk(new THREE.CylinderGeometry(0.6*sz, 0.6*sz, 0.07*sz, 10), 0x2a1a00, 2.65*sz));
  g.add(mk(new THREE.CylinderGeometry(0.28*sz, 0.32*sz, 0.5*sz, 8), 0x2a1a00, 2.9*sz));
  // Straw feet
  [-0.18*sz, 0.18*sz].forEach(x => { g.add(mk(new THREE.CylinderGeometry(0.08*sz, 0.06*sz, 0.5*sz, 6), 0xd4a830, 0.25*sz, x)); });
  if (isBoss) {
    // Boss glowing aura ring
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.7*sz, 0.06*sz, 6, 18), new THREE.MeshStandardMaterial({ color: 0xff2200, emissive: 0xff2200, emissiveIntensity: 0.8 }));
    ring.rotation.x = Math.PI/2; ring.position.y = 0.1; g.add(ring);
  }
  g.position.copy(pos); scene.add(g);
  const scaledHP = data.hp * (1 + (gs.wave - 1) * 0.1);
  gs.enemies.push({ mesh: g, data, hp: scaledHP, maxHp: scaledHP, pos: pos.clone(), vel: new THREE.Vector3(), attackCd: 0, slowTimer: 0, burnTimer: 0, _dead: false });
}

function updateEnemies(dt) {
  gs.enemies.forEach(e => {
    // Find nearest target: placed plant → barn → player
    let tgt = new THREE.Vector3(0, 0, 0); // barn default
    let minD = e.pos.length();
    gs.placedPlants.forEach(p => { const d = e.pos.distanceTo(p.pos); if (d < minD) { minD = d; tgt = p.pos.clone(); } });
    const pd = e.pos.distanceTo(gs.playerPos);
    if (pd < minD - 2) { tgt = gs.playerPos.clone(); }

    const dir = tgt.clone().sub(e.pos).setY(0);
    const dist = dir.length();
    if (dist > 0.01) dir.normalize();
    const attackRange = 1.8 * (e.data.sz || 1);
    const spd = e.data.spd * (e.slowTimer > 0 ? 0.3 : 1);
    if (dist > attackRange) {
      // Walk toward target
      e.vel.lerp(dir.multiplyScalar(spd), 0.12);
      e.pos.add(e.vel.clone().multiplyScalar(dt));
    } else {
      // Stop and stand still while attacking
      e.vel.set(0, 0, 0);
    }
    e.mesh.position.copy(e.pos).setY(Math.sin(Date.now() * 0.003 + e.pos.x) * 0.04);
    e.mesh.lookAt(tgt.clone().add(new THREE.Vector3(0, e.pos.y, 0)));

    e.attackCd = Math.max(0, e.attackCd - dt);
    e.slowTimer = Math.max(0, e.slowTimer - dt);
    if (e.burnTimer > 0) { e.burnTimer -= dt; e.hp -= 3 * dt; if (e.hp <= 0) killEnemy(e); }

    // Attack
    if (e.attackCd <= 0 && dist < attackRange) {
      e.attackCd = 1.0;
      if (tgt.distanceTo(gs.playerPos) < 1) {
        gs.playerHP -= e.data.dmg;
        if (gs.playerHP <= 0) { gs.playerHP = 0; endGame(); }
      } else if (tgt.length() < 2.5) {
        gs.barnHP -= e.data.dmg;
        if (gs.barnHP <= 0) { gs.barnHP = 0; endGame(); }
        updateBarnRing();
      } else {
        const pp = gs.placedPlants.find(p => p.pos.distanceTo(e.pos) < 2);
        if (pp) {
          pp.hp -= e.data.dmg;
          if (pp.hp <= 0) { scene.remove(pp.mesh); gs.placedPlants = gs.placedPlants.filter(x => x !== pp); showToast('A plant was destroyed!'); }
        }
      }
    }
  });
}

// ═══════════════════════════════════════
//  WAVE SYSTEM
// ═══════════════════════════════════════
function startNextWave() {
  gs.betweenWaves = false; gs.waveActive = true;
  gs.wave++;
  const waveData = WAVES[(gs.wave - 1) % WAVES.length];
  gs.spawnQueue = [];
  waveData.forEach(({ t, n }) => { for (let i = 0; i < n; i++) gs.spawnQueue.push(t); });
  gs.spawnQueue.sort(() => Math.random() - 0.5);
  gs.waveEnemiesLeft = gs.spawnQueue.length;
  gs.spawnTimer = 0;
  showWaveAnn('⚠️ WAVE ' + gs.wave + '!');
  showToast('Wave ' + gs.wave + ' incoming!', 2200);
}

function checkWaveEnd() {
  if (!gs.waveActive || gs.spawnQueue.length > 0 || gs.enemies.length > 0) return;
  gs.waveActive = false; gs.betweenWaves = true;
  const bonus = gs.wave * 10;
  gs.straw += bonus;
  showToast('Wave ' + gs.wave + ' cleared! +' + bonus + ' straw bonus! 🎉', 3000);
  if (gs.wave >= WAVES.length) setTimeout(() => showScreen('victory'), 2000);
  saveGame();
}

// ═══════════════════════════════════════
//  PLACEABLE PLANTS
// ═══════════════════════════════════════
function placeAtMouse() {
  if (!gs.placeId) return;
  const x = mouseWorld.x, z = mouseWorld.z;
  if (Math.hypot(x, z) > FARM_R - 0.5) { showToast('Place inside the farm!'); return; }

  const pd = PLACEABLES.find(p => p.id === gs.placeId);
  const dd = DEFENSE_ITEMS.find(d => d.id === gs.placeId);
  const data = pd || dd;
  if (!data) return;

  if (dd) { // defenses cost straw each placement
    if (gs.straw < dd.cost) { showToast('Not enough straw!'); return; }
    gs.straw -= dd.cost;
  }

  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.8, 8), new THREE.MeshLambertMaterial({ color: 0x228B22 }));
  stem.position.y = 0.4; stem.castShadow = true; g.add(stem);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 10, 10), new THREE.MeshLambertMaterial({ color: data.color || 0x00ff00 }));
  head.position.y = 0.9; head.castShadow = true; g.add(head);
  const pos = new THREE.Vector3(x, 0, z);
  g.position.copy(pos); scene.add(g);

  if (pd) {
    gs.placedPlants.push({ mesh: g, data: pd, hp: pd.hp, maxHp: pd.hp, pos: pos.clone(), timer: 0 });
  } else {
    gs.defenses.push({ mesh: g, data: dd, pos: pos.clone() });
  }

  gs.placeMode = false; gs.placeId = null;
  showToast('Placed! 🌱');
}

function updatePlacedPlants(dt) {
  gs.placedPlants.forEach(p => {
    p.timer -= dt;

    // Passive effects every frame
    if (p.data.kind === 'freeze') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(p.pos) < p.data.range) e.slowTimer = Math.max(e.slowTimer, 0.1 + dt); });
    }
    if (p.data.kind === 'heal') {
      if (gs.playerPos.distanceTo(p.pos) < p.data.range) gs.playerHP = Math.min(gs.playerMaxHP, gs.playerHP + (p.data.heal || 5) * dt);
    }
    if (p.data.kind === 'passive') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(p.pos) < p.data.range) { e.hp -= p.data.dmg * dt; if (e.hp <= 0) killEnemy(e); } });
    }
    if (p.data.kind === 'mine') {
      const near = gs.enemies.find(e => e.pos.distanceTo(p.pos) < 1.5);
      if (near) {
        gs.enemies.forEach(e => { if (e.pos.distanceTo(p.pos) < p.data.aoe) dmgEnemy(e, p.data.dmg); });
        spawnFX(p.pos.clone(), 0xff8800, 0.5, p.data.aoe * 0.5);
        scene.remove(p.mesh); gs.placedPlants = gs.placedPlants.filter(x => x !== p);
      }
    }

    // Turret fire
    if (p.data.kind === 'turret' && p.timer <= 0) {
      const nearest = gs.enemies.slice().sort((a, b) => a.pos.distanceTo(p.pos) - b.pos.distanceTo(p.pos))[0];
      if (nearest && nearest.pos.distanceTo(p.pos) < p.data.range) {
        p.timer = p.data.cd || 1;
        const dir = nearest.pos.clone().sub(p.pos).normalize();
        spawnProj(p.pos.clone().add(new THREE.Vector3(0, 1, 0)), dir, 9, p.data, 'plant', p.data.range / 9);
      }
    }
  });

  // Campfire damage
  gs.defenses.forEach(d => {
    if (d.data.type === 'campfire') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(d.pos) < (d.data.range || 2.5)) { e.hp -= (d.data.dmg || 3) * dt; if (e.hp <= 0) killEnemy(e); } });
    }
    if (d.data.type === 'moat') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(d.pos) < 1.5) e.slowTimer = Math.max(e.slowTimer, 0.1 + dt); });
    }
  });
}

function updateEffects(dt) {
  gs.effects = gs.effects.filter(ef => {
    ef.timer -= dt;
    if (ef.mesh) ef.mesh.material.opacity = Math.max(0, (ef.timer / ef.max) * 0.7);
    if (ef.type === 'cloud') {
      ef.tickTimer = (ef.tickTimer || 0) - dt;
      if (ef.tickTimer <= 0) {
        ef.tickTimer = 0.5;
        gs.enemies.forEach(e => { if (e.pos.distanceTo(ef.pos) < ef.aoe) { dmgEnemy(e, ef.dmg * 0.5); } });
      }
    }
    if (ef.timer <= 0 && ef.mesh) { scene.remove(ef.mesh); return false; }
    return ef.timer > 0;
  });

  gs.floatingTexts = gs.floatingTexts.filter(ft => {
    ft.timer -= dt; ft.pos.y += dt * 1.5; ft.sp.position.copy(ft.pos);
    ft.sp.material.opacity = ft.timer / 1.4;
    if (ft.timer <= 0) { scene.remove(ft.sp); return false; }
    return true;
  });
}

// ═══════════════════════════════════════
//  UI
// ═══════════════════════════════════════
function buildHotbar() {
  const hb = document.getElementById('hotbar');
  hb.innerHTML = '';
  gs.hotbar.forEach((id, i) => {
    const wd = id ? WEAPONS.find(w => w.id === id) : null;
    const d = document.createElement('div');
    d.className = 'hotslot' + (gs.activeSlot === i ? ' active' : '');
    d.innerHTML = `<span class="sk">${i + 1}</span>${wd ? `<span class="se">${wd.emoji}</span><span class="sn">${wd.name.split(' ')[0]}</span>` : '<span style="color:#444;font-size:20px">—</span>'}`;
    d.onclick = () => setSlot(i);
    hb.appendChild(d);
  });
}

function updateHUD() {
  const pct = gs.playerHP / gs.playerMaxHP;
  document.getElementById('hp-bar').style.width = (pct * 100) + '%';
  document.getElementById('hp-bar').style.background = pct > 0.5 ? '#4CAF50' : pct > 0.25 ? '#ff9800' : '#f44';
  document.getElementById('hp-txt').textContent = Math.ceil(gs.playerHP) + '/' + gs.playerMaxHP;
  document.getElementById('straw-txt').textContent = gs.straw;
  const wi = document.getElementById('wave-info');
  wi.textContent = gs.betweenWaves
    ? (gs.wave === 0 ? 'Press SPACE to start!' : 'Wave ' + gs.wave + ' done! SPACE=next')
    : 'Wave ' + gs.wave + ' — ' + (gs.enemies.length + gs.spawnQueue.length) + ' enemies';
}

function showToast(msg, dur = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), dur);
}

function showWaveAnn(txt) {
  const el = document.getElementById('wave-ann');
  el.textContent = txt; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

// ═══════════════════════════════════════
//  SHOP
// ═══════════════════════════════════════
function toggleShop(forceClose) {
  shopOpen = forceClose ? false : !shopOpen;
  document.getElementById('shop-overlay').classList.toggle('show', shopOpen);
  if (shopOpen) renderShop();
}

function shopTab(tab) {
  currentShopTab = tab;
  document.querySelectorAll('.shop-tab').forEach((el, i) => {
    el.classList.toggle('active', ['weapons', 'plants', 'defenses', 'barn'][i] === tab);
  });
  renderShop();
}

function renderShop() {
  document.getElementById('shop-straw').textContent = gs.straw;
  const c = document.getElementById('shop-content');
  c.innerHTML = '';

  if (currentShopTab === 'barn') {
    c.innerHTML = `
      <div style="grid-column:1/-1;color:#fff;margin-bottom:8px">
        <b>Your HP: ${Math.ceil(gs.playerHP)} / ${gs.playerMaxHP}</b> &nbsp;|&nbsp;
        <b>Barn HP: ${Math.ceil(gs.barnHP)} / ${gs.barnMaxHP}</b>
      </div>
      <div class="si ${gs.straw<10?'dim':gs.playerHP>=gs.playerMaxHP?'dim':''}" onclick="buyHealth(25,10)">
        <div class="ie">🧃</div><div class="in">Small Health Pack</div><div class="id">Restore 25 HP to yourself</div><div class="ic">🌾 10</div></div>
      <div class="si ${gs.straw<25?'dim':gs.playerHP>=gs.playerMaxHP?'dim':''}" onclick="buyHealth(75,25)">
        <div class="ie">❤️</div><div class="in">Large Health Pack</div><div class="id">Restore 75 HP to yourself</div><div class="ic">🌾 25</div></div>
      <div class="si ${gs.straw<50?'dim':''}" onclick="buyMaxHealth()">
        <div class="ie">💪</div><div class="in">Upgrade Max HP</div><div class="id">+25 max HP permanently</div><div class="ic">🌾 50</div></div>
      <div class="si ${gs.straw<30?'dim':gs.barnHP>=gs.barnMaxHP?'dim':''}" onclick="buyBarnRepair()">
        <div class="ie">🔨</div><div class="in">Repair Barn</div><div class="id">Restore 50 barn HP</div><div class="ic">🌾 30</div></div>
      <div class="si ${gs.straw<80?'dim':''}" onclick="buyBarnUpgrade()">
        <div class="ie">🏰</div><div class="in">Upgrade Barn</div><div class="id">+100 max barn HP</div><div class="ic">🌾 80</div></div>`;
    return;
  }

  const items = currentShopTab === 'weapons' ? WEAPONS : currentShopTab === 'plants' ? PLACEABLES : DEFENSE_ITEMS;
  items.forEach(item => {
    const owned = currentShopTab === 'weapons' && gs.ownedWeapons.has(item.id);
    const afford = gs.straw >= item.cost;
    const d = document.createElement('div');
    d.className = 'si' + (owned ? ' owned' : '') + (!afford && !owned ? ' dim' : '');
    d.innerHTML = `<div class="ie">${item.emoji}</div><div class="in">${item.name}</div><div class="id">${item.desc}</div>
      <div class="ic">${owned ? '✅ Owned — click to equip' : '🌾 ' + item.cost}</div>`;
    if (owned) d.onclick = () => equipWeapon(item.id);
    else if (afford) d.onclick = () => buyItem(item, currentShopTab);
    c.appendChild(d);
  });
}

function buyItem(item, tab) {
  if (gs.straw < item.cost) return;
  gs.straw -= item.cost;
  if (tab === 'weapons') {
    gs.ownedWeapons.add(item.id);
    equipWeapon(item.id);
  } else if (tab === 'plants') {
    autoPlacePlant(item);
    toggleShop(true);
  } else if (tab === 'defenses') {
    startPlace(item.id);
    toggleShop(true);
  }
  renderShop(); saveGame();
}

function autoPlacePlant(item) {
  // Pick a random spot on the farm away from the barn center
  let pos, tries = 0;
  do {
    const angle = Math.random() * Math.PI * 2;
    const r = 5 + Math.random() * (FARM_R - 7);
    pos = new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r);
    tries++;
  } while (tries < 20 && gs.placedPlants.some(p => p.pos.distanceTo(pos) < 2.5));

  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.8, 8), new THREE.MeshLambertMaterial({ color: 0x228B22 }));
  stem.position.y = 0.4; stem.castShadow = true; g.add(stem);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 10, 10), new THREE.MeshLambertMaterial({ color: item.color || 0x00ff00 }));
  head.position.y = 0.9; head.castShadow = true; g.add(head);
  // Support plants glow a soft green
  if (item.support) {
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.55, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.25 }));
    glow.position.y = 0.9; g.add(glow);
  }
  g.position.copy(pos);
  scene.add(g);
  gs.placedPlants.push({ mesh: g, data: item, hp: item.hp, maxHp: item.hp, pos: pos.clone(), timer: 0 });
  showToast(item.name + ' placed on your farm! ' + (item.support ? '💚' : '⚔️'));
}

function equipWeapon(id) {
  const empty = gs.hotbar.indexOf(null);
  gs.hotbar[empty >= 0 ? empty : gs.activeSlot] = id;
  buildHotbar(); buildPlayerMesh();
  showToast('Equipped!'); renderShop();
}

function startPlace(id) {
  gs.placeMode = true; gs.placeId = id;
  const item = [...PLACEABLES, ...DEFENSE_ITEMS].find(x => x.id === id);
  showToast('Click on the farm to place ' + (item ? item.name : id) + '!', 3000);
}

function buyHealth(amount, cost) {
  if (gs.straw < cost) return;
  if (gs.playerHP >= gs.playerMaxHP) { showToast('You are already full health!'); return; }
  gs.straw -= cost;
  gs.playerHP = Math.min(gs.playerMaxHP, gs.playerHP + amount);
  showToast('❤️ +' + amount + ' HP restored!');
  renderShop(); saveGame();
}

function buyMaxHealth() {
  if (gs.straw < 50) return;
  gs.straw -= 50;
  gs.playerMaxHP += 25;
  gs.playerHP += 25;
  showToast('💪 Max HP increased to ' + gs.playerMaxHP + '!');
  renderShop(); saveGame();
}

function buyBarnRepair() {
  if (gs.straw < 30) return;
  gs.straw -= 30; gs.barnHP = Math.min(gs.barnMaxHP, gs.barnHP + 50);
  updateBarnRing(); showToast('Barn repaired! ❤️'); renderShop(); saveGame();
}

function buyBarnUpgrade() {
  if (gs.straw < 80) return;
  gs.straw -= 80; gs.barnMaxHP += 100; gs.barnHP += 100;
  updateBarnRing(); showToast('Barn upgraded! 🏰'); renderShop(); saveGame();
}

// ═══════════════════════════════════════
//  SCREENS
// ═══════════════════════════════════════
function showScreen(id) {
  const sc = document.getElementById('screen');
  const inn = document.getElementById('screen-inner');
  sc.classList.remove('hidden');
  if (id === 'menu') {
    inn.innerHTML = `<div class="stitle">🌱 Garden Farmers</div>
      <div class="ssub">Grow plants. Arm yourself. Defend your farm!</div>
      <button class="bbtn" onclick="showScreen('skins')">▶ New Game</button>
      ${hasSave() ? `<button class="bbtn" style="background:#1565c0" onclick="loadAndPlay()">📂 Continue</button>` : ''}
      <br><div style="color:#555;font-size:12px;margin-top:18px">A Titan Blade Games game • Made by Oliver</div>`;
  } else if (id === 'skins') {
    inn.innerHTML = `<div class="stitle" style="font-size:38px">Choose Your Farmer</div>
      <div class="skin-grid" id="skg"></div>
      <button class="bbtn" onclick="startGame()">Start Farming! 🌾</button>
      <button class="bbtn gray" onclick="showScreen('menu')">Back</button>`;
    const g = document.getElementById('skg');
    SKINS.forEach(s => {
      const d = document.createElement('div');
      d.className = 'skin-card' + (gs.skin === s.id ? ' sel' : '');
      d.innerHTML = `<div class="sc-e">${s.emoji}</div><div class="sc-n">${s.name}</div>`;
      d.onclick = () => { gs.skin = s.id; document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('sel')); d.classList.add('sel'); buildPlayerMesh(); };
      g.appendChild(d);
    });
  } else if (id === 'gameover') {
    inn.innerHTML = `<div class="stitle" style="color:#f44">💀 Farm Destroyed!</div>
      <div class="ssub">The scarecrows won this time...</div>
      <div style="color:#FFD700;font-size:18px;margin:10px">Waves: ${gs.wave} | Kills: ${gs.totalKills} | Straw: ${gs.straw}</div>
      <button class="bbtn" onclick="showScreen('skins')">🔄 Try Again</button>
      <button class="bbtn gray" onclick="showScreen('menu')">Menu</button>`;
  } else if (id === 'victory') {
    inn.innerHTML = `<div class="stitle">🏆 YOU WIN!</div>
      <div class="ssub">You defended your farm through all 8 waves!</div>
      <div style="color:#FFD700;font-size:20px;margin:10px">🌾 ${gs.straw} straw | 💀 ${gs.totalKills} scarecrows defeated</div>
      <button class="bbtn" onclick="showScreen('menu')">Main Menu</button>`;
  }
}

function startGame() {
  resetGame();
  document.getElementById('screen').classList.add('hidden');
  gameStarted = true;
  buildPlayerMesh(); buildHotbar(); updateHUD();
  showToast('Welcome! Press SPACE to start Wave 1!', 4000);
}

function loadAndPlay() {
  loadGame();
  document.getElementById('screen').classList.add('hidden');
  gameStarted = true;
  buildPlayerMesh(); buildHotbar(); updateHUD();
  showToast('Game loaded! Press SPACE to continue.', 3000);
}

function endGame() {
  gameStarted = false; showScreen('gameover');
}

// ═══════════════════════════════════════
//  SAVE / LOAD
// ═══════════════════════════════════════
const SAVE_KEY = 'gardenFarmers_v1';
function hasSave() { return !!localStorage.getItem(SAVE_KEY); }

function saveGame() {
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    straw: gs.straw, wave: gs.wave, skin: gs.skin,
    barnHP: gs.barnHP, barnMaxHP: gs.barnMaxHP,
    playerHP: gs.playerHP, totalKills: gs.totalKills,
    ownedWeapons: [...gs.ownedWeapons], ownedPlaceables: [...gs.ownedPlaceables],
    hotbar: gs.hotbar,
  }));
}

function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    gs.straw = d.straw || 0; gs.wave = d.wave || 0; gs.skin = d.skin || 'classic';
    gs.barnHP = d.barnHP || 200; gs.barnMaxHP = d.barnMaxHP || 200;
    gs.playerHP = d.playerHP || 100; gs.totalKills = d.totalKills || 0;
    gs.ownedWeapons = new Set(d.ownedWeapons || ['carrot']);
    gs.ownedPlaceables = new Set(d.ownedPlaceables || []);
    gs.hotbar = d.hotbar || ['carrot', null, null, null, null];
    gs.betweenWaves = true;
    updateBarnRing();
  } catch (e) { console.error('Load error', e); }
}

function resetGame() {
  gs.enemies.forEach(e => scene.remove(e.mesh));
  gs.projectiles.forEach(p => scene.remove(p.mesh));
  gs.placedPlants.forEach(p => scene.remove(p.mesh));
  gs.defenses.forEach(d => scene.remove(d.mesh));
  gs.effects.forEach(ef => { if (ef.mesh) scene.remove(ef.mesh); });
  gs.floatingTexts.forEach(f => scene.remove(f.sp));
  gs.enemies = []; gs.projectiles = []; gs.placedPlants = [];
  gs.defenses = []; gs.effects = []; gs.floatingTexts = [];
  gs.playerHP = 100; gs.playerMaxHP = 100; gs.straw = 0;
  gs.playerPos.set(5, 0.75, 0); gs.playerVel.set(0, 0, 0);
  gs.wave = 0; gs.waveActive = false; gs.betweenWaves = true;
  gs.barnHP = 200; gs.barnMaxHP = 200;
  gs.ownedWeapons = new Set(['carrot']); gs.ownedPlaceables = new Set();
  gs.hotbar = ['carrot', null, null, null, null]; gs.activeSlot = 0;
  gs.totalKills = 0; attackCd = 0;
  updateBarnRing();
}

// ═══════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════
let lastT = 0;
function loop(ts) {
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;

  if (gameStarted) {
    updatePlayer(dt);
    attackCd = Math.max(0, attackCd - dt);

    if (gs.waveActive) {
      gs.spawnTimer -= dt;
      if (gs.spawnTimer <= 0 && gs.spawnQueue.length > 0) {
        gs.spawnTimer = 0.8 + Math.random() * 0.5;
        spawnEnemy(gs.spawnQueue.shift());
      }
      updateEnemies(dt);
      checkWaveEnd();
    }
    updateProjectiles(dt);
    updatePlacedPlants(dt);
    updateEffects(dt);

    // Camera follows player
    camera.position.lerp(gs.playerPos.clone().add(CAM_OFF), 0.06);
    camera.lookAt(gs.playerPos);
    updateHUD();
  }

  // Drift clouds slowly
  scene.children.forEach(c => { if (c._isCloud) { c.position.x += 0.4 * dt; if (c.position.x > 30) c.position.x = -30; } });

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════
updateBarnRing();
showScreen('menu');
requestAnimationFrame(ts => { lastT = ts; requestAnimationFrame(loop); });
</script>
