  if (isArmor) {
    mk(new THREE.BoxGeometry(0.88*sz, 0.55*sz, 0.15*sz), 0x4a4a4a, 1.02*sz, 0, 0.4*sz, 0, 0, 0, 0.4, 0.75);
  }
  _addEnemyToScene(g, pos, data, sz);
}

function spawnSnowman(data, pos) {
  const sz = data.sz || 1;
  const g = new THREE.Group();
  const isBoss = data.id === 'snow_boss' || data.id === 'snow_giant' || data.id === 'glacier';
  const isYeti = data.id === 'yeti';
  const isArmor = data.id === 'snow_armor';
  const bodyCol = data.color;
  const S = (col, rough=0.7, met=0, emCol=0, emInt=0) => {
    const m = new THREE.MeshStandardMaterial({color:col, roughness:rough, metalness:met});
    if (emInt>0) { m.emissive.setHex(emCol); m.emissiveIntensity=emInt; }
    return m;
  };
  const mk = (geo, col, py=0, px=0, pz=0, rx=0, ry=0, rz=0, rough=0.7, met=0, emCol=0, emInt=0) => {
    const m = new THREE.Mesh(geo, S(col, rough, met, emCol, emInt));
    m.position.set(px,py,pz); m.rotation.set(rx,ry,rz); m.castShadow=true; g.add(m); return m;
  };

  if (isYeti) {
    // Yeti is big and furry-white
    mk(new THREE.CylinderGeometry(0.28*sz, 0.34*sz, 0.85*sz, 8), 0xeeeedd, 0.42*sz, -0.22*sz);
    mk(new THREE.CylinderGeometry(0.28*sz, 0.34*sz, 0.85*sz, 8), 0xeeeedd, 0.42*sz,  0.22*sz);
    mk(new THREE.SphereGeometry(0.55*sz, 9, 9), 0xeeeedd, 1.18*sz);
    mk(new THREE.SphereGeometry(0.4*sz, 8, 8), 0xeeeedd, 2.0*sz);
    // Arms
    [-0.6*sz, 0.6*sz].forEach((x,i) => {
      mk(new THREE.CylinderGeometry(0.12*sz,0.15*sz,0.9*sz,7), 0xeeeedd, 1.1*sz, x, 0, 0, 0, i===0?0.7:-0.7);
    });
    // Eyes
    [-0.14*sz, 0.14*sz].forEach(x => mk(new THREE.SphereGeometry(0.07*sz, 5, 5), 0xff2200, 2.08*sz, x, 0.36*sz, 0,0,0, 0.5, 0, 0xff0000, 1.5));
    // Mouth
    mk(new THREE.BoxGeometry(0.3*sz, 0.07*sz, 0.06*sz), 0x111111, 1.9*sz, 0, 0.38*sz);
    // Horns
    mk(new THREE.ConeGeometry(0.06*sz, 0.3*sz, 6), 0xcc9900, 2.36*sz, -0.18*sz, 0.1*sz, 0.3, 0, -0.4);
    mk(new THREE.ConeGeometry(0.06*sz, 0.3*sz, 6), 0xcc9900, 2.36*sz,  0.18*sz, 0.1*sz, 0.3, 0,  0.4);
    _addEnemyToScene(g, pos, data, sz);
    return;
  }

  // Standard snowman: 3 stacked spheres
  mk(new THREE.SphereGeometry(0.52*sz, 10, 10), bodyCol, 0.52*sz); // bottom
  if (isArmor) {
    // Ice armor plate on bottom
    mk(new THREE.SphereGeometry(0.54*sz, 10, 8), 0x88aacc, 0.52*sz, 0, 0, 0, 0, 0, 0.2, 0.7);
  }
  mk(new THREE.SphereGeometry(0.38*sz, 9, 9), bodyCol, 1.26*sz); // middle
  // Stick arms
  [-0.6*sz, 0.6*sz].forEach((x, i) => {
    mk(new THREE.CylinderGeometry(0.04*sz, 0.06*sz, 0.72*sz, 6), 0x4a2800, 1.18*sz, x, 0, 0, 0, i===0?0.45:-0.45);
    // Branch tips
    mk(new THREE.CylinderGeometry(0.025*sz, 0.04*sz, 0.28*sz, 5), 0x3a1a00, 1.0*sz, x*1.2, 0, 0.25, 0, i===0?0.8:-0.8);
  });
  // Coal buttons on middle
  [-0.1*sz, 0, 0.1*sz].forEach(y => mk(new THREE.SphereGeometry(0.04*sz, 4, 4), 0x111111, 1.26*sz + y, 0, 0.37*sz));
  // Head
  mk(new THREE.SphereGeometry(0.28*sz, 9, 9), bodyCol, 1.88*sz);
  // Eyes (coal)
  [-0.1*sz, 0.1*sz].forEach(x => mk(new THREE.SphereGeometry(0.05*sz, 5, 5), 0x111111, 1.92*sz, x, 0.26*sz));
  // Carrot nose
  mk(new THREE.ConeGeometry(0.04*sz, 0.22*sz, 7), 0xff6600, 1.88*sz, 0, 0.28*sz, -Math.PI/2, 0, 0);
  // Mouth (3 small coal dots)
  [-0.08*sz, 0, 0.08*sz].forEach(x => mk(new THREE.SphereGeometry(0.03*sz, 4, 4), 0x111111, 1.76*sz, x, 0.27*sz));
  // Scarf
  mk(new THREE.TorusGeometry(0.28*sz, 0.07*sz, 5, 14), 0xdd2222, 1.62*sz, 0, 0, Math.PI/2);

  if (isBoss) {
    // Boss has a tall top hat + glow ring
    mk(new THREE.CylinderGeometry(0.38*sz, 0.38*sz, 0.07*sz, 10), 0x111111, 2.14*sz);
    mk(new THREE.CylinderGeometry(0.22*sz, 0.28*sz, 0.52*sz, 8), 0x111111, 2.42*sz);
    mk(new THREE.CylinderGeometry(0.28*sz, 0.28*sz, 0.06*sz, 8), 0x2244aa, 2.16*sz, 0, 0, 0, 0, 0, 0.3, 0.7);
    // Glowing blue eyes
    [-0.1*sz, 0.1*sz].forEach(x => {
      const eye = g.children.find(c => c.position.x === x && Math.abs(c.position.y - 1.92*sz) < 0.05);
      if (eye) eye.material = new THREE.MeshStandardMaterial({color:0x4488ff, emissive:0x88ccff, emissiveIntensity:2.0});
    });
    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(0.8*sz, 0.07*sz, 6, 18), new THREE.MeshStandardMaterial({color:0x88ccff, emissive:0x88ccff, emissiveIntensity:1.2}));
    ring1.rotation.x = Math.PI/2; ring1.position.y = 0.12; g.add(ring1);
  } else {
    // Regular hat
    mk(new THREE.CylinderGeometry(0.34*sz, 0.34*sz, 0.06*sz, 10), 0x1a1a1a, 2.14*sz);
    mk(new THREE.CylinderGeometry(0.2*sz, 0.24*sz, 0.36*sz, 8), 0x1a1a1a, 2.34*sz);
  }
  _addEnemyToScene(g, pos, data, sz);
}

function spawnEnemy(typeId, atPos = null) {
  const data = getActiveData().enemies.find(e => e.id === typeId);
  if (!data) return;
  let pos;
  if (atPos) {
    pos = atPos.clone();
  } else {
    const angle = Math.random() * Math.PI * 2;
    const r = FARM_R + 2 + Math.random() * 3;
    pos = new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r);
  }
  if (gs.biome === 'jungle') { spawnMonkey(data, pos); return; }
  if (gs.biome === 'snow')   { spawnSnowman(data, pos); return; }
  const sz = data.sz || 1;
  const g = new THREE.Group();
  const smat = (col, rough=0.85, met=0, emCol=0, emInt=0) => {
    const m = new THREE.MeshStandardMaterial({ color: col, roughness: rough, metalness: met });
    if (emInt > 0) { m.emissive.setHex(emCol); m.emissiveIntensity = emInt; }
    return m;
  };
  const mk = (geo, col, py=0, px=0, pz=0, rx=0, ry=0, rz=0, rough=0.85, met=0, emCol=0, emInt=0) => {
    const m = new THREE.Mesh(geo, smat(col, rough, met, emCol, emInt));
    m.position.set(px, py, pz); m.rotation.set(rx, ry, rz); m.castShadow = true; return m;
  };
  const isBoss   = data.id === 'boss';
  const isArmor  = data.id === 'armor';
  const isTorch  = data.id === 'torch';
  const isSword  = data.id === 'sword';
  const isFlame  = data.id === 'flame';
  const isMage   = data.id === 'mage';
  const isGolden = data.id === 'golden';
  const isGuard  = data.id === 'guard';

  // Legs — two wooden post legs
  [-0.19*sz, 0.19*sz].forEach(x => {
    g.add(mk(new THREE.CylinderGeometry(0.09*sz, 0.11*sz, 1.05*sz, 6), 0x6B3E26, 0.52*sz, x));
  });
  // Straw tufts at feet
  [-0.26*sz, 0.26*sz].forEach(x => {
    g.add(mk(new THREE.CylinderGeometry(0.07*sz, 0.05*sz, 0.28*sz, 5), 0xd4a830, 0.08*sz, x,        0.05*sz,  0.22, 0,  0));
    g.add(mk(new THREE.CylinderGeometry(0.06*sz, 0.04*sz, 0.26*sz, 5), 0xc8961e, 0.08*sz, x+0.08*sz, 0.06*sz,  0.26, 0,  0.28));
    g.add(mk(new THREE.CylinderGeometry(0.06*sz, 0.04*sz, 0.26*sz, 5), 0xd4a830, 0.08*sz, x-0.08*sz, 0.06*sz,  0.26, 0, -0.28));
  });

  // Torso / shirt
  const bodyCol = data.color;
  g.add(mk(new THREE.BoxGeometry(0.74*sz, 0.88*sz, 0.42*sz), bodyCol, 1.12*sz));
  // Chest patch
  g.add(mk(new THREE.BoxGeometry(0.23*sz, 0.19*sz, 0.44*sz), 0x8B5E3C, 1.22*sz, 0.18*sz));
  // Rope belt
  g.add(mk(new THREE.CylinderGeometry(0.39*sz, 0.39*sz, 0.09*sz, 10), 0x7a5c2e, 0.72*sz));
  // Straw tufts at collar
  [-0.12*sz, 0, 0.12*sz].forEach((x, i) => {
    g.add(mk(new THREE.CylinderGeometry(0.04*sz, 0.03*sz, 0.22*sz, 5), 0xd4a830, 1.63*sz, x, 0.14*sz, -0.38, 0, (i-1)*0.28));
  });

  // Armor plate for armored type
  if (isArmor) {
    g.add(mk(new THREE.BoxGeometry(0.76*sz, 0.72*sz, 0.1*sz),  0x555566, 1.12*sz, 0, 0.23*sz, 0, 0, 0, 0.55, 0.75));
    g.add(mk(new THREE.BoxGeometry(0.72*sz, 0.1*sz,  0.44*sz), 0x666677, 0.72*sz, 0, 0,       0, 0, 0, 0.55, 0.75));
    [-0.46*sz, 0.46*sz].forEach(x => {
      g.add(mk(new THREE.BoxGeometry(0.24*sz, 0.2*sz, 0.24*sz), 0x555566, 1.46*sz, x, 0, 0, 0, 0, 0.55, 0.75));
    });
  }

  // Arms — upper crossbar + forearms + hands
  g.add(mk(new THREE.BoxGeometry(1.62*sz, 0.22*sz, 0.22*sz), bodyCol, 1.42*sz));
  [-0.74*sz, 0.74*sz].forEach((x, i) => {
    const lean = i === 0 ? 0.16 : -0.16;
    g.add(mk(new THREE.BoxGeometry(0.21*sz, 0.44*sz, 0.21*sz), bodyCol, 1.17*sz, x, 0, lean));
    g.add(mk(new THREE.SphereGeometry(0.13*sz, 6, 6), 0xc8a850, 0.92*sz, x));
    // Sleeve straw tufts
    g.add(mk(new THREE.CylinderGeometry(0.05*sz, 0.04*sz, 0.2*sz, 5), 0xd4a830, 0.79*sz, x+0.05*sz, 0.08*sz, 0, 0,  0.45));
    g.add(mk(new THREE.CylinderGeometry(0.05*sz, 0.04*sz, 0.18*sz, 5), 0xc8961e, 0.8*sz,  x-0.05*sz, 0.07*sz, 0, 0, -0.4));
  });

  // Type-specific weapon props
  if (isTorch) {
    g.add(mk(new THREE.CylinderGeometry(0.06*sz, 0.06*sz, 0.56*sz, 7), 0x5c3a00, 0.9*sz, 0.79*sz, 0.12*sz, 0, 0, 0.25));
    g.add(mk(new THREE.ConeGeometry(0.13*sz, 0.28*sz, 7), 0xff6600, 1.18*sz, 0.84*sz, 0.12*sz, 0, 0, 0, 0.5, 0, 0xff4400, 1.3));
    g.add(mk(new THREE.SphereGeometry(0.1*sz, 5, 5), 0xffaa00, 1.26*sz, 0.84*sz, 0.12*sz, 0, 0, 0, 0.3, 0, 0xff8800, 1.5));
  }
  if (isSword) {
    g.add(mk(new THREE.BoxGeometry(0.07*sz, 0.72*sz, 0.05*sz), 0xccccdd, 0.62*sz, 0.79*sz, 0.12*sz, 0, 0, 0.12, 0.25, 0.85));
    g.add(mk(new THREE.BoxGeometry(0.3*sz,  0.07*sz, 0.07*sz), 0x998855, 1.0*sz,  0.79*sz, 0.12*sz));
    g.add(mk(new THREE.CylinderGeometry(0.05*sz, 0.05*sz, 0.18*sz, 6), 0x6b4400, 0.83*sz, 0.79*sz, 0.12*sz));
  }
  if (isFlame) {
    g.add(mk(new THREE.CylinderGeometry(0.09*sz, 0.09*sz, 0.58*sz, 7), 0x555555, 0.9*sz, 0.79*sz, 0.12*sz, 0, 0, Math.PI/2 + 0.18, 0.5, 0.6));
    g.add(mk(new THREE.ConeGeometry(0.11*sz, 0.28*sz, 7), 0xff6600, 0.9*sz, 1.09*sz, 0.12*sz, 0, 0, -Math.PI/2, 0.35, 0, 0xff4400, 1.0));
    g.add(mk(new THREE.CylinderGeometry(0.07*sz, 0.1*sz, 0.3*sz, 7), 0x444444, 0.9*sz, 0.72*sz, 0.12*sz, 0.3, 0, 0, 0.5, 0.6));
  }
  if (isMage) {
    // Wand in right hand
    g.add(mk(new THREE.CylinderGeometry(0.04*sz, 0.04*sz, 0.7*sz, 6), 0x3a006e, 0.78*sz, 0.79*sz, 0.1*sz, 0, 0, 0.22, 0.5, 0.1));
    g.add(mk(new THREE.SphereGeometry(0.1*sz, 7, 7), 0xcc44ff, 1.15*sz, 0.86*sz, 0.1*sz, 0, 0, 0, 0.2, 0, 0xaa00ff, 2.0));
    g.add(mk(new THREE.OctahedronGeometry(0.07*sz, 0), 0xee88ff, 1.22*sz, 0.83*sz, 0.13*sz, 0, 0, 0, 0.1, 0, 0xff88ff, 2.5));
  }
  if (isGuard) {
    // Shield on left arm
    g.add(mk(new THREE.BoxGeometry(0.38*sz, 0.58*sz, 0.06*sz), 0x7a4a10, 0.96*sz, -0.82*sz, 0.12*sz, 0, 0.18, 0, 0.7, 0.2));
    g.add(mk(new THREE.BoxGeometry(0.34*sz, 0.54*sz, 0.05*sz), 0x3a1800, 0.96*sz, -0.82*sz, 0.16*sz, 0, 0.18, 0, 0.8, 0));
    g.add(mk(new THREE.SphereGeometry(0.08*sz, 6, 5), 0x9e7a30, 0.96*sz, -0.82*sz, 0.21*sz, 0, 0, 0, 0.3, 0.7, 0xcc9900, 0.5));
  }
  if (isGolden) {
    // Gold orbit rings
    const gr1 = new THREE.Mesh(new THREE.TorusGeometry(0.95*sz, 0.055*sz, 6, 18), smat(0xFFD700, 0.15, 0.95, 0xFFD700, 1.4));
    gr1.rotation.x = Math.PI/2; gr1.position.y = 0.15; g.add(gr1);
    const gr2 = new THREE.Mesh(new THREE.TorusGeometry(1.18*sz, 0.04*sz, 6, 18), smat(0xffcc44, 0.15, 0.9, 0xffcc44, 0.9));
    gr2.rotation.x = Math.PI/5; gr2.position.y = 0.22; g.add(gr2);
  }

  // HEAD
  if (isBoss) {
    // Pumpkin head with ridges, stem, carved eyes + grin
    const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.46*sz, 10, 8), smat(0xff6600, 0.65, 0));
    pHead.scale.y = 0.82; pHead.position.set(0, 2.38*sz, 0); pHead.castShadow = true; g.add(pHead);
    // Pumpkin vertical ridges
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const ridge = new THREE.Mesh(new THREE.CylinderGeometry(0.07*sz, 0.07*sz, 0.72*sz, 5), smat(0xdd5500, 0.7));
      ridge.scale.y = 0.82; ridge.position.set(Math.cos(a)*0.38*sz, 2.38*sz, Math.sin(a)*0.38*sz);
      ridge.castShadow = true; g.add(ridge);
    }
    // Stem
    g.add(mk(new THREE.CylinderGeometry(0.07*sz, 0.1*sz, 0.22*sz, 6), 0x3a6600, 2.9*sz));
    // Carved triangle eyes
    [-0.17*sz, 0.17*sz].forEach(x => {
      g.add(mk(new THREE.ConeGeometry(0.1*sz, 0.15*sz, 3), 0xff2200, 2.44*sz, x, 0.4*sz, 0, 0, Math.PI, 0.3, 0, 0xff0000, 2.0));
    });
    // Carved grin teeth
    [-0.16*sz, 0, 0.16*sz].forEach(x => {
      g.add(mk(new THREE.BoxGeometry(0.11*sz, 0.09*sz, 0.06*sz), 0xff2200, 2.18*sz, x, 0.43*sz, 0, 0, 0, 0.3, 0, 0xff0000, 1.5));
    });
    // Boss aura rings
    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(0.82*sz, 0.07*sz, 6, 18), smat(0xff2200, 0.4, 0, 0xff2200, 1.2));
    ring1.rotation.x = Math.PI/2; ring1.position.y = 0.12; g.add(ring1);
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.15*sz, 0.05*sz, 6, 18), smat(0xff6600, 0.4, 0, 0xff6600, 0.8));
    ring2.rotation.x = Math.PI/2; ring2.position.y = 0.18; g.add(ring2);
  } else {
    // Burlap sack head
    const hCol = 0xc8a850;
    g.add(mk(new THREE.SphereGeometry(0.38*sz, 9, 8), hCol, 2.26*sz));
    g.add(mk(new THREE.BoxGeometry(0.54*sz, 0.19*sz, 0.5*sz), hCol, 2.04*sz));
    // Burlap seam ridge
    g.add(mk(new THREE.BoxGeometry(0.025*sz, 0.3*sz, 0.04*sz), 0x9a7430, 2.4*sz, 0, 0.36*sz));
    // Stitched X-eyes
    [-0.14*sz, 0.14*sz].forEach(x => {
      g.add(mk(new THREE.BoxGeometry(0.18*sz, 0.04*sz, 0.04*sz), 0x3a2000, 2.32*sz, x, 0.37*sz, 0, 0,  0.62));
      g.add(mk(new THREE.BoxGeometry(0.18*sz, 0.04*sz, 0.04*sz), 0x3a2000, 2.32*sz, x, 0.37*sz, 0, 0, -0.62));
    });
    // Stitched mouth dots
    [-0.13*sz, 0, 0.13*sz].forEach(x => {
      g.add(mk(new THREE.SphereGeometry(0.04*sz, 4, 4), 0x3a2000, 2.12*sz, x, 0.38*sz));
    });
  }

  // HAT
  if (isBoss) {
    g.add(mk(new THREE.CylinderGeometry(0.74*sz, 0.74*sz, 0.09*sz, 10), 0x1a0e00, 2.9*sz));
    g.add(mk(new THREE.CylinderGeometry(0.31*sz, 0.39*sz, 0.84*sz, 8), 0x2a1a00, 3.32*sz));
    g.add(mk(new THREE.CylinderGeometry(0.4*sz, 0.4*sz, 0.09*sz, 8), 0xcc9900, 2.97*sz, 0, 0, 0, 0, 0, 0.5, 0.5));
  } else if (isMage) {
    // Tall pointy wizard hat
    g.add(mk(new THREE.CylinderGeometry(0.62*sz, 0.62*sz, 0.07*sz, 10), 0x2a0055, 2.7*sz));
    g.add(mk(new THREE.ConeGeometry(0.36*sz, 1.1*sz, 8), 0x3a007a, 3.32*sz, 0, 0, 0, 0, 0, 0.4, 0, 0x6600cc, 0.4));
    g.add(mk(new THREE.CylinderGeometry(0.37*sz, 0.37*sz, 0.1*sz, 10), 0xcc44ff, 2.78*sz, 0, 0, 0, 0, 0, 0.3, 0, 0xaa00ff, 1.5));
    g.add(mk(new THREE.OctahedronGeometry(0.1*sz, 0), 0xffddff, 3.85*sz, 0, 0, 0, 0, 0, 0.2, 0, 0xff88ff, 3.0));
  } else if (isGolden) {
    // Gold crown
    g.add(mk(new THREE.CylinderGeometry(0.62*sz, 0.6*sz, 0.18*sz, 10), 0xFFD700, 2.73*sz, 0, 0, 0, 0, 0, 0.15, 0.95, 0xFFD700, 0.8));
    for (let i = 0; i < 6; i++) {
      const ca = (i / 6) * Math.PI * 2;
      g.add(mk(new THREE.ConeGeometry(0.065*sz, 0.28*sz, 5), 0xFFD700, 2.96*sz, Math.cos(ca)*0.54*sz, Math.sin(ca)*0.54*sz, 0, 0, 0, 0.15, 0.95, 0xFFD700, 1.2));
    }
    // Crown gem
    g.add(mk(new THREE.OctahedronGeometry(0.12*sz, 0), 0xff4444, 3.0*sz, 0, 0, 0, 0, 0, 0.1, 0.1, 0xff2200, 2.5));
  } else if (isGuard) {
    // Dark armored hat with visor
    g.add(mk(new THREE.CylinderGeometry(0.62*sz, 0.62*sz, 0.07*sz, 10), 0x0f0800, 2.7*sz));
    g.add(mk(new THREE.CylinderGeometry(0.27*sz, 0.34*sz, 0.5*sz, 8), 0x0f0800, 2.96*sz));
    // Dark visor strip across eyes
    g.add(mk(new THREE.BoxGeometry(0.5*sz, 0.12*sz, 0.46*sz), 0x111111, 2.33*sz, 0, 0.35*sz, 0, 0, 0, 0.2, 0.8, 0x222222, 0.4));
  } else {
    // Floppy hat slightly tilted
    g.add(mk(new THREE.CylinderGeometry(0.63*sz, 0.63*sz, 0.07*sz, 10), 0x1a0e00, 2.7*sz, 0.07*sz, 0,  0.08, 0,  0.06));
    g.add(mk(new THREE.CylinderGeometry(0.25*sz, 0.33*sz, 0.48*sz, 8), 0x2a1a00, 2.94*sz, 0.06*sz, 0,  0.14, 0,  0.1));
    g.add(mk(new THREE.CylinderGeometry(0.34*sz, 0.34*sz, 0.07*sz, 8), 0x6a3a00, 2.72*sz, 0.06*sz));
    // Straw tuft poking out of hat
    g.add(mk(new THREE.CylinderGeometry(0.04*sz, 0.03*sz, 0.25*sz, 5), 0xd4a830, 2.97*sz, -0.21*sz, 0.12*sz, -0.48, 0, -0.3));
    g.add(mk(new THREE.CylinderGeometry(0.04*sz, 0.03*sz, 0.22*sz, 5), 0xc8961e, 2.96*sz, -0.25*sz, 0.1*sz,  -0.38, 0, -0.52));
  }

  // HP bar
  const hpBg = new THREE.Mesh(new THREE.PlaneGeometry(1.2*sz, 0.22), new THREE.MeshBasicMaterial({ color: 0x222222 }));
  hpBg.rotation.x = -Math.PI/2; hpBg.position.y = 3.8*sz; g.add(hpBg);
  const hpFill = new THREE.Mesh(new THREE.PlaneGeometry(1.2*sz, 0.2), new THREE.MeshBasicMaterial({ color: 0x44ff44 }));
  hpFill.rotation.x = -Math.PI/2; hpFill.position.y = 3.82*sz; g.add(hpFill);
  g.position.copy(pos); scene.add(g);
  const scaledHP = data.hp * (1 + (gs.wave - 1) * 0.1);
  gs.enemies.push({ mesh: g, data, hp: scaledHP, maxHp: scaledHP, pos: pos.clone(), vel: new THREE.Vector3(), attackCd: 0, slowTimer: 0, burnTimer: 0, poisonTimer: 0, rootTimer: 0, _dead: false, _hpFill: hpFill, _hpSz: 1.2*sz, _phase: Math.random() * Math.PI * 2, _swayZ: 0, _leanX: 0, _bob: 0, _poisonFxT: 0 });
  if (data.id === 'golden') {
    const goldenEnemy = gs.enemies[gs.enemies.length - 1];
    for (let i = 0; i < 2; i++) {
      const ga = (i / 2) * Math.PI * 2 + Math.PI / 6;
      const gp = new THREE.Vector3(pos.x + Math.cos(ga) * 3.2, 0, pos.z + Math.sin(ga) * 3.2);
      const gr = Math.hypot(gp.x, gp.z);
      if (gr > FARM_R - 2) { gp.x *= (FARM_R - 2) / gr; gp.z *= (FARM_R - 2) / gr; }
      spawnEnemy('guard', gp);
      gs.enemies[gs.enemies.length - 1]._guardOf = goldenEnemy;
    }
  }
}

function updateEnemies(dt) {
  gs.enemies.forEach(e => {
    // Find nearest target: placed plant → barn → player
    let tgt = new THREE.Vector3(0, 0, 0); // barn default
    let minD = e.pos.length();
    gs.placedPlants.forEach(p => { const d = e.pos.distanceTo(p.pos); if (d < minD) { minD = d; tgt = p.pos.clone(); } });
    const pd = e.pos.distanceTo(gs.playerPos);
    if (pd < minD - 2) { tgt = gs.playerPos.clone(); }

    // Guard: position between the golden scarecrow and the current threat
    if (e._guardOf && !e._guardOf._dead) {
      const gPos = e._guardOf.pos;
      const threatVec = tgt.clone().sub(gPos).setY(0);
      const tvLen = threatVec.length();
      tgt = tvLen > 0.1 ? gPos.clone().add(threatVec.normalize().multiplyScalar(Math.min(2.8, tvLen * 0.55))) : gPos.clone();
    }

    const dir = tgt.clone().sub(e.pos).setY(0);
    const dist = dir.length();
    if (dist > 0.01) dir.normalize();
    const attackRange = e.data.ranged ? 6.5 : (1.8 * (e.data.sz || 1));
    const rageMult = gs.activeEvents.enemyRage ? 1.7 : 1;
    const frozenMult = gs.activeEvents.freezeWave ? 0.05 : 1;

    // Root: completely stops movement
    e.rootTimer = Math.max(0, e.rootTimer - dt);
    if (e.rootTimer > 0) {
      e.vel.set(0, 0, 0);
      e.mesh.position.copy(e.pos);
      // Green root ring pulse around enemy
      e._rootFxT = (e._rootFxT || 0) - dt;
      if (e._rootFxT <= 0) { e._rootFxT = 0.4; spawnFX(e.pos.clone(), 0x228b22, 0.22, (e.data.sz||1) * 1.2); }
    } else {
      // Poison: green DoT
      if (e.poisonTimer > 0) {
        e.poisonTimer -= dt;
        e.hp -= 6 * dt;
        e._poisonFxT -= dt;
        if (e._poisonFxT <= 0) { e._poisonFxT = 0.5; spawnFX(e.pos.clone().add(new THREE.Vector3(0, 1, 0)), 0x44ff00, 0.2, 0.5); }
        if (e.hp <= 0) { killEnemy(e); return; }
      }
      // Glacier regenerates HP slowly
      if (e.data.id === 'glacier' || e.data.id === 'snow_giant') {
        e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.003 * dt);
      }
      const spd = e.data.spd * rageMult * frozenMult * (e.slowTimer > 0 ? 0.3 : 1) * (e._berserk ? 2.8 : 1);
      if (dist > attackRange) {
        e.vel.lerp(dir.multiplyScalar(spd), 0.12);
        e.pos.add(e.vel.clone().multiplyScalar(dt));
      } else {
        e.vel.set(0, 0, 0);
      }
    }
    // Stealth monkey: fade out when far from player
    if (e.data.id === 'stealth_monk') {
      const targetOpacity = e.pos.distanceTo(gs.playerPos) > 6 ? 0.22 : 1.0;
      e.mesh.traverse(c => { if (c.isMesh && c.material) { c.material.transparent = true; c.material.opacity = THREE.MathUtils.lerp(c.material.opacity || 1, targetOpacity, 0.08); } });
    }
    // Yeti periodic roar — pushes player back
    if (e.data.id === 'yeti') {
      e._roarTimer = (e._roarTimer || 5) - dt;
      if (e._roarTimer <= 0 && dist < 8) {
        e._roarTimer = 6 + Math.random() * 3;
        const pushDir = gs.playerPos.clone().sub(e.pos).setY(0).normalize();
        gs.playerPos.add(pushDir.multiplyScalar(5));
        gs.playerVel = gs.playerVel || new THREE.Vector3();
        spawnFX(e.pos.clone().add(new THREE.Vector3(0,1,0)), 0xeeeedd, 0.6, 4.0);
        showToast('🏔️ Yeti ROARS! Pushed back!', 1500);
      }
    }
    const walking = e.vel.length() > 0.01;
    const et = Date.now() * 0.001;
    const freq = (e.data.spd || 2) * 1.7;
    const step = Math.sin(et * freq + e._phase);
    e._bob   = e._bob   * 0.84 + (walking ? Math.abs(step) * 0.15 : 0) * 0.16;
    e._swayZ = e._swayZ * 0.84 + (walking ? Math.sin(et * freq + e._phase + Math.PI * 0.5) * 0.12 : 0) * 0.16;
    e._leanX = e._leanX * 0.84 + (walking ? -0.08 : 0) * 0.16;
    e.mesh.position.copy(e.pos).setY(e._bob);
    const faceDir = tgt.clone().sub(e.pos).setY(0);
    const faceY = faceDir.length() > 0.01 ? Math.atan2(faceDir.x, faceDir.z) : e.mesh.rotation.y;
    e.mesh.rotation.set(e._leanX, faceY, e._swayZ);
    // Update HP bar
    if (e._hpFill) {
      const pct = Math.max(0, e.hp / e.maxHp);
      e._hpFill.scale.x = pct;
      e._hpFill.position.x = -(e._hpSz * (1 - pct)) / 2;
      e._hpFill.material.color.setHex(pct > 0.5 ? 0x44ff44 : pct > 0.25 ? 0xff8800 : 0xff2222);
    }

    // Mage teleport — jumps to a random farm position every few seconds
    if (e.data.teleport) {
      e._mageTpTimer = (e._mageTpTimer !== undefined ? e._mageTpTimer : 1 + Math.random()) - dt;
      if (e._mageTpTimer <= 0) {
        e._mageTpTimer = 1.8 + Math.random() * 1.5;
        spawnFX(e.pos.clone().add(new THREE.Vector3(0, 1, 0)), 0xcc44ff, 0.4, 1.2);
        const tpAngle = Math.random() * Math.PI * 2;
        const tpR = 4 + Math.random() * (FARM_R - 6);
        e.pos.set(Math.cos(tpAngle) * tpR, 0, Math.sin(tpAngle) * tpR);
        e.mesh.position.copy(e.pos);
        spawnFX(e.pos.clone().add(new THREE.Vector3(0, 1, 0)), 0xaa00ff, 0.45, 1.5);
      }
    }
    // Shadow / Stealth teleport
    if (e.data.id === 'shadow' || e.data.id === 'stealth_monk' || e.data.id === 'snow_shadow') {
      e._teleportTimer = (e._teleportTimer || 3.5) - dt;
      if (e._teleportTimer <= 0 && dist > 3) {
        e._teleportTimer = 3.2 + Math.random() * 1.5;
        e.pos.add(dir.clone().multiplyScalar(Math.min(9, dist * 0.55)));
        e.mesh.position.copy(e.pos);
        const fxCol = e.data.id === 'stealth_monk' ? 0x44ff00 : e.data.id === 'snow_shadow' ? 0x88ccff : 0x8800ff;
        spawnFX(e.pos.clone(), fxCol, 0.4, 0.9);
      }
    }
    e.attackCd = Math.max(0, e.attackCd - dt);
    e.slowTimer = Math.max(0, e.slowTimer - dt);
    if (e.burnTimer > 0) { e.burnTimer -= dt; e.hp -= 3 * dt; if (e.hp <= 0) killEnemy(e); }

    // Attack
    if (e.attackCd <= 0 && dist < attackRange) {
      e.attackCd = e.data.ranged ? 1.8 : 1.0;
      const atkDir = tgt.clone().sub(e.pos).setY(0).normalize();
      if (e.data.ranged) {
        spawnEnemyFireball(e.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), atkDir, e.data);
      } else {
        spawnEnemyAttackFX(e, tgt.clone(), atkDir);
        if (tgt.distanceTo(gs.playerPos) < 1) {
          gs.playerHP -= e.data.dmg;
          sfxPlayerHurt();
          if (gs.playerHP <= 0) { gs.playerHP = 0; endGame(); }
          // Howler screech: slow the player
          if (e.data.id === 'howler') { gs.playerSlowTimer = 3; showToast('🐒 Howler screech! You\'re slowed!', 1500); }
          // Poison monkey: poison the player (DoT via playerSlowTimer overload — use poison flag)
          if (e.data.id === 'poison_monk') { gs.playerPoisonTimer = (gs.playerPoisonTimer || 0) + 4; }
        } else if (tgt.length() < 2.5) {
          if (!gs.activeEvents.barnShield) {
            gs.barnHP -= e.data.dmg;
            sfxBarnHit();
            if (gs.barnHP <= 0) { gs.barnHP = 0; endGame(); }
            updateBarnRing();
          }
        } else {
          const pp = gs.placedPlants.find(p => p.pos.distanceTo(e.pos) < 2);
          if (pp) {
            pp.hp -= e.data.dmg;
            if (pp.hp <= 0) { scene.remove(pp.mesh); gs.placedPlants = gs.placedPlants.filter(x => x !== pp); if (pp.data.kind === 'animal') showAnimalEliminated(pp.data); else showToast('A plant was destroyed!'); }
          }
        }
      }
    }
  });
}

// ═══════════════════════════════════════
//  RANDOM EVENTS
// ═══════════════════════════════════════
const eventBanner = document.getElementById('event-banner');
const eventText   = document.getElementById('event-text');
const eventTimerBar = document.getElementById('event-timer-bar');
let _eventBannerTimeout = null;

function showEventBanner(ev, remaining, total) {
  eventText.textContent = ev.name + ' — ' + ev.desc;
  eventBanner.className = 'show' + (ev.bad ? ' bad' : '');
  if (ev.instant) {
    eventTimerBar.style.display = 'none';
    clearTimeout(_eventBannerTimeout);
    _eventBannerTimeout = setTimeout(() => { eventBanner.className = ''; }, 3000);
  } else {
    eventTimerBar.style.display = 'block';
    eventTimerBar.style.width = (remaining / total * 100) + '%';
  }
}

function hideEventBanner() {
  eventBanner.className = '';
}

function triggerRandomEvent() {
  const ev = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
  showEventBanner(ev, ev.dur, ev.dur);

  if (ev.id === 'strawBonus') {
    gs.straw += 100;
    floatText(gs.playerPos.clone().add(new THREE.Vector3(0,2,0)), '+100🌾', 0xFFD700);
  } else if (ev.id === 'stampede') {
    const starterId = getActiveData().enemies[0].id;
    for (let i = 0; i < 12; i++) spawnEnemy(starterId);
    gs.waveEnemiesLeft += 12;
  } else if (ev.dur) {
    gs.activeEvents[ev.id] = ev.dur;
  }
}

const _evCdEl  = document.getElementById('event-countdown');
const _evCdTxt = document.getElementById('event-cd-txt');

function updateEventSystem(dt) {
  // Countdown to next event (every 5 minutes = 300s, but start first one after 90s)
  gs.eventTimer -= dt;
  if (gs.eventTimer <= 0) {
    gs.eventTimer = 300;
    triggerRandomEvent();
  }

  // Show countdown only when game is active and no event is running
  const noActive = Object.keys(gs.activeEvents).length === 0;
  if (gameStarted && noActive) {
    _evCdEl.style.display = '';
    const secs = Math.ceil(gs.eventTimer);
    const m = Math.floor(secs / 60);
    const s = String(secs % 60).padStart(2, '0');
    _evCdTxt.textContent = m + ':' + s;
    // Turn red when under 10 seconds
    _evCdEl.style.borderColor = secs <= 10 ? '#ff4444' : '#555';
    _evCdEl.style.color = secs <= 10 ? '#ff8888' : '#fff';
  } else {
    _evCdEl.style.display = 'none';
  }

  // Tick active durations
  let anyActive = false;
  for (const id of Object.keys(gs.activeEvents)) {
    gs.activeEvents[id] -= dt;
    if (gs.activeEvents[id] <= 0) {
      delete gs.activeEvents[id];
      hideEventBanner();
    } else {
      anyActive = true;
      const ev = RANDOM_EVENTS.find(e => e.id === id);
      if (ev) showEventBanner(ev, gs.activeEvents[id], ev.dur);
    }
  }

  // Straw rain tick
  if (gs.activeEvents.strawRain) {
    if (!gs._strawRainTick) gs._strawRainTick = 0;
    gs._strawRainTick -= dt;
    if (gs._strawRainTick <= 0) {
      gs._strawRainTick = 2;
      gs.straw += 6;
      floatText(gs.playerPos.clone().add(new THREE.Vector3(0,2,0)), '+6🌾', 0xFFD700);
    }
  } else {
    gs._strawRainTick = 0;
  }

  // Heal rain tick
  if (gs.activeEvents.healRain && gs.playerHP < gs.playerMaxHP) {
    gs.playerHP = Math.min(gs.playerMaxHP, gs.playerHP + 8 * dt);
  }
}

// ═══════════════════════════════════════
//  WAVE SYSTEM
// ═══════════════════════════════════════
function startNextWave() {
  gs._barnRestedThisWave = false;
  gs.betweenWaves = false; gs.waveActive = true;
  gs.wave++;
  const waveData = getActiveData().waves[(gs.wave - 1) % getActiveData().waves.length];
  gs.spawnQueue = [];
  waveData.forEach(({ t, n }) => { for (let i = 0; i < n; i++) gs.spawnQueue.push(t); });
  gs.spawnQueue.sort(() => Math.random() - 0.5);
  gs.waveEnemiesLeft = gs.spawnQueue.length;
  gs.spawnTimer = 0;
  const totalWaves = getActiveData().waves.length;
  const waveLabels = {5:'👹 BOSS WAVE!', 6:'👑 GOLDEN SCARE!', 10:'💀 DOUBLE BOSS!', 11:'👑 GOLDEN SCARE!', 15:'☠️ BOSS ARMY!', 15:'👑 GOLDEN HUNT!', 18:'🔥 TRIPLE BOSS!', 20:'💥 WAVE 20!', 21:'⚡ SPEED DEMONS!', 22:'👑 DOUBLE GOLD!', 23:'🧊 ICE AGE!', 24:'💥 APOCALYPSE!', 25:'🌪️ CHAOS WAVE!', 26:'💣 BOMB BLITZ!', 27:'⚡ SPEED RUSH!', 28:'👹 TRIPLE GIANTS!', 29:'🔥 INFERNO!', 30:'💀 FINAL STAND!'};
  const label = waveLabels[gs.wave] || '⚠️ WAVE ' + gs.wave + '!';
  showWaveAnn(label);
  showToast('Wave ' + gs.wave + ' / ' + totalWaves + ' incoming!', 2200);
}

function checkWaveEnd() {
  if (!gs.waveActive || gs.spawnQueue.length > 0 || gs.enemies.length > 0) return;
  gs.waveActive = false; gs.betweenWaves = true;
  const bonus = gs.wave * 10;
  gs.straw += bonus;
  // Enemy base slowly regenerates
  gs._enemyBaseHP = Math.min(gs._enemyBaseMaxHP, gs._enemyBaseHP + 40);
  gs._barnRestedThisWave = false;
  showToast('Wave ' + gs.wave + ' cleared! +' + bonus + ' straw bonus! 🎉', 3000);
  if (gs.wave >= getActiveData().waves.length) setTimeout(() => { stopBattleTheme(); showScreen('victory'); }, 2000);
  saveGame();
}

function buildPlantMesh(data) {
  const g = new THREE.Group();
  const S = (col, rough=0.85) => new THREE.MeshStandardMaterial({color:col, roughness:rough, metalness:0});
  const E = (col) => new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:0.55, roughness:0.8});
  const Tr = (col, op) => new THREE.MeshStandardMaterial({color:col, transparent:true, opacity:op, roughness:0.1});
  const add = (geo, mat, y=0, x=0, z=0, rx=0, ry=0, rz=0) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); m.castShadow=true; g.add(m); return m;
  };
  switch(data.id) {
    case 'flytrap': {
      add(new THREE.CylinderGeometry(0.28,0.18,0.42,8), S(0xaa5522), 0.21);
      add(new THREE.CylinderGeometry(0.07,0.09,0.7,6), S(0x228b22), 0.75);
      const jawM = S(0x00bb33);
      const j1 = add(new THREE.BoxGeometry(0.55,0.06,0.32), jawM, 1.22, 0, 0.16); j1.rotation.x=-0.5;
      const j2 = add(new THREE.BoxGeometry(0.55,0.06,0.32), jawM, 1.22, 0,-0.16); j2.rotation.x= 0.5;
      const teethM = S(0xffffff,0.4);
      for(let i=-1;i<=1;i++) { const t=add(new THREE.ConeGeometry(0.04,0.14,4), teethM, 1.15, i*0.14, 0.2); t.rotation.x=-0.5; }
      break;
    }
    case 'cactus': {
      add(new THREE.CylinderGeometry(0.18,0.2,1.3,8), S(0x2e8b57), 0.65);
      add(new THREE.SphereGeometry(0.22,7,7), S(0x2e8b57), 1.38);
      add(new THREE.CylinderGeometry(0.11,0.13,0.5,7), S(0x2e8b57), 0.82, 0.38,0, 0,0, Math.PI/2);
      add(new THREE.CylinderGeometry(0.1,0.1,0.3,7),   S(0x2e8b57), 1.05, 0.55,0, 0,0, Math.PI/2);
      add(new THREE.CylinderGeometry(0.11,0.13,0.5,7), S(0x2e8b57), 0.82,-0.38,0, 0,0,-Math.PI/2);
      add(new THREE.CylinderGeometry(0.1,0.1,0.3,7),   S(0x2e8b57), 1.05,-0.55,0, 0,0,-Math.PI/2);
      const spM = S(0xcceecc,0.4);
      [[0,1.42,0.2],[0,0.9,0.21],[0.21,0.65,0.18],[0,1.42,-0.2]].forEach(([x,y,z]) => {
        const sp=add(new THREE.ConeGeometry(0.025,0.15,4), spM, y, x, z); sp.rotation.x=z>0?Math.PI*0.4:-Math.PI*0.4;
      });
      break;
    }
    case 'pea': {
      add(new THREE.CylinderGeometry(0.22,0.17,0.3,8), S(0x556b2f), 0.15);
      add(new THREE.CylinderGeometry(0.12,0.14,0.65,8), S(0x3a8a22), 0.62);
      add(new THREE.CylinderGeometry(0.08,0.08,0.7,8), S(0x225511), 0.9, 0,0.35, Math.PI/2,0,0);
      add(new THREE.BoxGeometry(0.45,0.05,0.22), S(0x4caf50), 0.78, 0,0, 0,0, 0.35);
      add(new THREE.BoxGeometry(0.45,0.05,0.22), S(0x4caf50), 0.78, 0,0, 0,0,-0.35);
      break;
    }
    case 'thorn': {
      add(new THREE.SphereGeometry(0.52,8,8), S(0x3d5c22), 0.65);
      add(new THREE.SphereGeometry(0.36,7,7), S(0x4a7a2a), 0.88, 0.28, 0.18);
      add(new THREE.SphereGeometry(0.3,7,7),  S(0x4a7a2a), 0.78,-0.3,  0.1);
      const thM = S(0x8b0000,0.5);
      [[0,1.25,0],[0.5,0.85,0.3],[-0.44,0.82,0.2],[0.22,0.68,0.52],[-0.2,0.62,-0.5],[0.42,0.98,-0.34]].forEach(([x,y,z]) => {
        const sp=add(new THREE.ConeGeometry(0.042,0.22,4), thM, y, x, z);
        sp.lookAt(new THREE.Vector3(x*3,y+1,z*3));
      });
      break;
    }
    case 'fireflwr': {
      add(new THREE.CylinderGeometry(0.07,0.09,1.1,7), S(0x228b22), 0.55);
      add(new THREE.BoxGeometry(0.32,0.05,0.18), S(0x2eaa33), 0.68, 0.22,0, 0,0, 0.4);
      const petM = S(0xff2200,0.7);
      for(let i=0;i<8;i++) { const a=i/8*Math.PI*2; const p=add(new THREE.SphereGeometry(0.1,6,6), petM, 1.18, Math.cos(a)*0.36, Math.sin(a)*0.36); p.scale.set(0.7,0.7,1.5); p.rotation.y=-a; }
      add(new THREE.SphereGeometry(0.2,8,8), S(0xff8800), 1.18);
      add(new THREE.ConeGeometry(0.1,0.28,7), E(0xff4400), 1.55);
      add(new THREE.ConeGeometry(0.06,0.2,6),  E(0xffaa00), 1.68);
      break;
    }
    case 'ice': {
      add(new THREE.CylinderGeometry(0.07,0.09,0.6,6), S(0x88ccff), 0.3);
      const icM = Tr(0xaaddff, 0.8); icM.metalness=0.1; icM.roughness=0.05;
      [[0,0.95,0,0,0,0],[0.28,0.72,0.28,0.4,0,0.3],[-0.24,0.68,0.2,-0.4,0,-0.4],[0.1,0.82,-0.28,0.5,0,0.2]].forEach(([x,y,z,rx,ry,rz]) => {
        const c=new THREE.Mesh(new THREE.OctahedronGeometry(0.27), icM); c.position.set(x,y,z); c.rotation.set(rx,ry,rz); g.add(c);
      });
      const glow=new THREE.Mesh(new THREE.SphereGeometry(0.44,8,8), Tr(0x44aaff,0.18)); glow.position.y=0.88; g.add(glow);
      break;
    }
    case 'mine': {

function buildWeaponMesh(wd) {
  const g = new THREE.Group();
  const S = (col, rough=0.7) => new THREE.MeshStandardMaterial({color:col, roughness:rough, metalness:0});
  const E = (col) => new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:0.7, roughness:0.5});
  const add = (geo, mat, y=0, x=0, z=0, rx=0, ry=0, rz=0) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); m.castShadow=true; g.add(m); return m;
  };
  switch(wd.id) {
    case 'carrot': {
      add(new THREE.CylinderGeometry(0.04,0.12,0.88,7), S(0xff6600), 0, 0,0, 0,0, Math.PI/2);
      for(let i=0;i<4;i++){const a=i/4*Math.PI*2; add(new THREE.BoxGeometry(0.04,0.2,0.06), S(0x228b22), 0, -0.5+Math.cos(a)*0.06, Math.sin(a)*0.06, -0.4,a,0);}
      break;
    }
    case 'pumpkin': {
      const pm=add(new THREE.SphereGeometry(0.26,8,8), S(0xff8c00), 0); pm.scale.set(1,0.9,1);
      for(let i=0;i<6;i++){const a=i/6*Math.PI*2; const rb=add(new THREE.SphereGeometry(0.065,5,5), S(0xff6600), 0, Math.cos(a)*0.21, Math.sin(a)*0.21); rb.scale.y=1.5;}
      add(new THREE.CylinderGeometry(0.035,0.035,0.16,5), S(0x5c3317), 0.3);
      add(new THREE.BoxGeometry(0.035,0.13,0.025), S(0x228b22), 0.26, 0.07,0, 0,0,-0.5);
      break;
    }
    case 'apple': {
      add(new THREE.SphereGeometry(0.24,9,9), S(0xff1111), 0);
      add(new THREE.CylinderGeometry(0.025,0.025,0.14,5), S(0x5c3317), 0.27);
      add(new THREE.BoxGeometry(0.22,0.04,0.1), S(0x228b22), 0.24, 0.12,0, 0,0, 0.55);
      break;
    }
    case 'melon': {
      add(new THREE.CylinderGeometry(0.06,0.07,0.7,8), S(0x5c3317), 0, 0,0, 0,0, Math.PI/2);
      const mel=add(new THREE.SphereGeometry(0.3,9,9), S(0x228b22), 0, 0.55,0); mel.scale.set(1.2,0.85,0.85);
      for(let i=0;i<4;i++){const a=i/4*Math.PI; add(new THREE.BoxGeometry(0.02,0.25,0.5), S(0x1a5c1a), 0, 0.55+Math.cos(a)*0.24, Math.sin(a)*0.24);}
      break;
    }
    case 'corn': {
      add(new THREE.CylinderGeometry(0.14,0.12,0.64,10), S(0xffd700), 0, 0,0, 0,0, Math.PI/2);
      for(let i=0;i<4;i++){const a=i/4*Math.PI*2; add(new THREE.BoxGeometry(0.04,0.38,0.2), S(0x228b22), 0, Math.cos(a)*0.11, Math.sin(a)*0.11, 0,a, 0.38);}
      break;
    }
    case 'berry': {
      add(new THREE.CylinderGeometry(0.04,0.05,0.7,6), S(0x8b4513), 0, 0,0, 0,0, Math.PI/2);
      add(new THREE.SphereGeometry(0.2,8,8), S(0xff1493), 0, 0.55,0);
      for(let i=0;i<6;i++){const a=i/6*Math.PI*2; add(new THREE.SphereGeometry(0.03,4,4), S(0xffcc44), 0, 0.55+Math.cos(a)*0.12, Math.sin(a)*0.12);}
      break;
    }
    case 'tomato': {
      add(new THREE.SphereGeometry(0.25,9,9), S(0xff2200), 0);
      for(let i=0;i<5;i++){const a=i/5*Math.PI*2; add(new THREE.BoxGeometry(0.2,0.04,0.05), S(0x228b22), 0.24, Math.cos(a)*0.08, Math.sin(a)*0.08, 0,a,0);}
      add(new THREE.CylinderGeometry(0.025,0.025,0.1,5), S(0x228b22), 0.32);
      break;
    }
    case 'bean': {
      add(new THREE.CylinderGeometry(0.05,0.07,1.1,7), S(0x32cd32), 0, 0,0, 0,0, Math.PI/2);
      for(let i=0;i<4;i++) add(new THREE.SphereGeometry(0.075,6,6), S(0x28b028), 0, i*0.22-0.33);
      break;
    }
    case 'mush': {
      add(new THREE.CylinderGeometry(0.08,0.1,0.44,8), S(0xeeeeee), 0, 0,0, 0,0, Math.PI/2);
      add(new THREE.SphereGeometry(0.3,8,7), S(0x9b59b6), 0, 0.52,0);
      add(new THREE.CylinderGeometry(0.28,0.05,0.1,8), S(0xddbbee), 0, 0.26,0, 0,0,-Math.PI/2);
      for(let i=0;i<5;i++){const a=i/5*Math.PI*2; add(new THREE.SphereGeometry(0.055,5,5), S(0xffffff), 0, 0.52+Math.cos(a)*0.15, Math.sin(a)*0.15);}
      break;
    }
    case 'sun': {
      add(new THREE.SphereGeometry(0.2,9,9), E(0xffd700), 0);
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2; const r=add(new THREE.BoxGeometry(0.06,0.28,0.04), S(0xffcc00), 0, Math.cos(a)*0.38, Math.sin(a)*0.38); r.rotation.z=a;}
      const ring=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.04,5,14), E(0xffee00)); g.add(ring);
      break;
    }
    default: {
      add(new THREE.BoxGeometry(0.16,0.16,0.9), S(wd.color||0xaaaaaa), 0, 0,0, 0,0, Math.PI/2);
    }
  }
  return g;
}

function placeAtMouse() {
  if (!gs.placeId) return;
  const x = mouseWorld.x, z = mouseWorld.z;
  if (Math.hypot(x, z) > FARM_R - 0.5) { showToast('Place inside the farm!'); return; }

  const ad = getActiveData();
  const pd = ad.placeables.find(p => p.id === gs.placeId);
  const dd = ad.defenses.find(d => d.id === gs.placeId);
  const an = (ad.animals||[]).find(a => a.id === gs.placeId);
  const data = pd || dd || an;
  if (!data) return;

  const g = buildPlantMesh(data);
  const pos = new THREE.Vector3(x, 0, z);
  g.position.copy(pos); scene.add(g);

  if (pd || an) {
    gs.placedPlants.push({ mesh: g, data: (pd||an), hp: (pd||an).hp, maxHp: (pd||an).hp, pos: pos.clone(), timer: 0 });
  } else {
    gs.defenses.push({ mesh: g, data: dd, pos: pos.clone(), timer: 0 });
  }

  gs.placeMode = false; gs.placeId = null;
  const ab = document.getElementById('attack-btn');
  if (ab) ab.textContent = '⚔️';
  showToast('Placed! 🌱');
  saveGame();
}

function updatePlacedPlants(dt) {
  gs.placedPlants.forEach(p => {
    p.timer -= dt;

    // Passive effects every frame
    if (p.data.kind === 'freeze') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(p.pos) < p.data.range) e.slowTimer = Math.max(e.slowTimer, 0.1 + dt); });
    }
    if (p.data.kind === 'heal') {
      if (gs.playerPos.distanceTo(p.pos) < p.data.range) gs.playerHP = Math.min(gs.playerMaxHP, gs.playerHP + (p.data.heal || 5) * dt);
    }
    if (p.data.kind === 'passive') {
      gs.enemies.forEach(e => {
        if (e.pos.distanceTo(p.pos) < p.data.range) {
          let dmg = p.data.dmg;
          // campfire_plt in snow biome: 3x damage to snowmen (they melt fast)
          if (p.data.id === 'campfire_plt') dmg *= 3;
          e.hp -= dmg * dt; if (e.hp <= 0) killEnemy(e);
          if (p.data.root) {
            e.rootTimer = Math.max(e.rootTimer || 0, 0.5);
          } else if (p.data.slow) {
            e.slowTimer = Math.max(e.slowTimer || 0, 0.35);
          }
        }
      });
    }
    if (p.data.kind === 'mine') {
      const near = gs.enemies.find(e => e.pos.distanceTo(p.pos) < 1.5);
      if (near) {
        gs.enemies.forEach(e => { if (e.pos.distanceTo(p.pos) < p.data.aoe) dmgEnemy(e, p.data.dmg); });
        spawnFX(p.pos.clone(), 0xff8800, 0.5, p.data.aoe * 0.5);
        scene.remove(p.mesh); gs.placedPlants = gs.placedPlants.filter(x => x !== p);
      }
    }

    // Turret fire
    if (p.data.kind === 'turret' && p.timer <= 0) {
      const nearest = gs.enemies.slice().sort((a, b) => a.pos.distanceTo(p.pos) - b.pos.distanceTo(p.pos))[0];
      if (nearest && nearest.pos.distanceTo(p.pos) < p.data.range) {
        p.timer = p.data.cd || 1;
        if (p.data.hardFreeze) {
          nearest.slowTimer = 8; nearest.vel.set(0,0,0);
          spawnFX(nearest.pos.clone(), 0xaaddff, 0.55, 2.0);
          showToast('🧊 Enemy hard-frozen!', 800);
        } else {
          const dir = nearest.pos.clone().sub(p.pos).normalize();
          spawnProj(p.pos.clone().add(new THREE.Vector3(0, 1, 0)), dir, 9, p.data, 'plant', p.data.range / 9);
        }
      }
    }

    // Animal movement — roam the whole farm
    if (p.data.kind === 'animal') {
      if (!p._bobPhase) p._bobPhase = Math.random() * Math.PI * 2;

      if (p.data.flying) {
        // Flying birds — orbit their home position at altitude
        if (!p._homePos) {
          p._homePos = p.pos.clone();
          p._orbitAngle = Math.random() * Math.PI * 2;
          p._orbitDir = Math.random() < 0.5 ? 1 : -1;
          p._orbitR = 2.5 + Math.random() * 2.0;
          p._flyH = 2.2 + Math.random() * 0.8;
        }
        p._orbitAngle += p._orbitDir * 2.4 * dt;
        p._bobPhase += dt * 3.0;
        const nx = p._homePos.x + Math.cos(p._orbitAngle) * p._orbitR;
        const nz = p._homePos.z + Math.sin(p._orbitAngle) * p._orbitR;
        const flyY = p._flyH + Math.sin(p._bobPhase * 0.8) * 0.35;
        p.pos.x = nx; p.pos.z = nz;
        // Face direction of travel
        const moveAngle = Math.atan2(
          nx - p.mesh.position.x,
          nz - p.mesh.position.z
        );
        p.mesh.rotation.y = moveAngle;
        p.mesh.position.set(nx, flyY, nz);
        // Flap wings
        if (p.mesh._w1 && p.mesh._w2) {
          const flap = Math.sin(p._bobPhase * 5) * 0.4;
          p.mesh._w1.rotation.z = -0.2 - flap;
          p.mesh._w2.rotation.z =  0.2 + flap;
        }
      } else {
        if (!p._vel) {
          p._vel = new THREE.Vector3();
          p._wanderTimer = Math.random() * 2;
        }
        p._wanderTimer -= dt;
        if (p._wanderTimer <= 0) {
          p._wanderTimer = 1.6 + Math.random() * 2.8;
          if (Math.random() < 0.22) {
            p._vel.set(0, 0, 0);
          } else {
            const angle = Math.random() * Math.PI * 2;
            const spd = { hen:3.2, cow:5.5, pig:3.8, sheep:4.5, duck:3.5, goat:5.0, horse:7.0, llama:4.2, rooster:4.0 }[p.data.id] || 4.0;
            p._vel.set(Math.cos(angle) * spd, 0, Math.sin(angle) * spd);
          }
        }
        const distFromCenter = Math.hypot(p.pos.x, p.pos.z);
        if (distFromCenter > FARM_R - 3) {
          const inward = new THREE.Vector3(-p.pos.x, 0, -p.pos.z).normalize();
          p._vel.x = inward.x * 2.8; p._vel.z = inward.z * 2.8;
          p._wanderTimer = 0.5;
        }
        p.pos.x += p._vel.x * dt;
        p.pos.z += p._vel.z * dt;
        const moving = p._vel.lengthSq() > 0.04;
        if (moving) {
          p.mesh.rotation.y = Math.atan2(p._vel.x, p._vel.z);
          p._bobPhase += dt * 9;
          p.mesh.position.set(p.pos.x, Math.abs(Math.sin(p._bobPhase)) * 0.07, p.pos.z);
        } else {
          p.mesh.position.set(p.pos.x, 0, p.pos.z);
        }
      }
    }

    // Animal attacks
    if (p.data.kind === 'animal' && p.timer <= 0) {
      const nearest = gs.enemies.slice().sort((a, b) => a.pos.distanceTo(p.pos) - b.pos.distanceTo(p.pos))[0];
      if (nearest && nearest.pos.distanceTo(p.pos) < p.data.range) {
        p.timer = p.data.cd;
        const dir = nearest.pos.clone().sub(p.pos).setY(0).normalize();
        // Face the enemy when attacking
        p.mesh.rotation.y = Math.atan2(dir.x, dir.z);

        if (p.data.attack === 'egg') {
          // Hen: lob an egg projectile
          const eggData = { kind:'throw', dmg:p.data.dmg, color:0xffffcc, id:'hen_egg' };
          spawnProj(p.pos.clone().add(new THREE.Vector3(0, 1.0, 0)), dir, 9, eggData, 'plant', p.data.range / 9);
          spawnFX(p.pos.clone().add(new THREE.Vector3(0,1,0)), 0xffffcc, 0.18, 0.5);
          sfxShoot(0.28);

        } else if (p.data.attack === 'charge') {
          // Cow: damages all enemies in a forward cone + knocks them back
          gs.enemies.forEach(e => {
            const edist = e.pos.distanceTo(p.pos);
            const edot = dir.dot(e.pos.clone().sub(p.pos).normalize());
            if (edist < p.data.range && edot > 0.45) {
              dmgEnemy(e, p.data.dmg);
              e.vel.add(dir.clone().multiplyScalar(16));
              spawnFX(e.pos.clone(), 0xcc6600, 0.35, 1.2);
            }
          });
          spawnSlash(p.pos.clone(), dir, 0xcc6600, p.data.range);
          spawnImpact(p.pos.clone().add(dir.clone().multiplyScalar(p.data.range * 0.5)), 0xcc6600);
          sfxHeavySlam();

        } else if (p.data.attack === 'mud') {
          // Pig: AoE slow + damage around itself
          gs.enemies.forEach(e => {
            if (e.pos.distanceTo(p.pos) < p.data.range) {
              dmgEnemy(e, p.data.dmg);
              e.slowTimer = Math.max(e.slowTimer || 0, 3.5);
              spawnFX(e.pos.clone(), 0x7a4a1a, 0.35, 0.7);
            }
          });
          spawnFX(p.pos.clone(), 0x7a4a1a, 0.5, p.data.range * 0.45);
          sfxSplat();

        } else if (p.data.attack === 'ram') {
          // Sheep: single target hard knockback
          dmgEnemy(nearest, p.data.dmg);
          nearest.vel.add(dir.clone().multiplyScalar(20));
          spawnFX(nearest.pos.clone(), 0xffffff, 0.3, 1.4);
          spawnImpact(nearest.pos.clone().add(new THREE.Vector3(0, 0.8, 0)), 0xdddddd);
          sfxHeavySlam();

        } else if (p.data.attack === 'water') {
          // Duck: water splash AoE — damages + slows
          gs.enemies.forEach(e => {
            if (e.pos.distanceTo(p.pos) < p.data.range) {
              dmgEnemy(e, p.data.dmg);
              e.slowTimer = Math.max(e.slowTimer || 0, 2.5);
              spawnFX(e.pos.clone(), 0x44aaff, 0.3, 0.6);
            }
          });
          spawnFX(p.pos.clone(), 0x44aaff, 0.45, p.data.range * 0.4);
          sfxSplat();

        } else if (p.data.attack === 'headbutt') {
          // Goat: narrow line charge — hits enemies directly ahead, giant knockback
          gs.enemies.forEach(e => {
            const edist = e.pos.distanceTo(p.pos);
            const edot  = dir.dot(e.pos.clone().sub(p.pos).normalize());
            if (edist < p.data.range && edot > 0.7) {
              dmgEnemy(e, p.data.dmg);
              e.vel.add(dir.clone().multiplyScalar(22));
              spawnFX(e.pos.clone(), 0xaabb88, 0.4, 1.3);
            }
          });
          spawnSlash(p.pos.clone(), dir, 0x99aa66, p.data.range);
          sfxHeavySlam();

        } else if (p.data.attack === 'kick') {
          // Horse: wide arc kick — hits all enemies in a broad 180° sweep
          gs.enemies.forEach(e => {
            const edist = e.pos.distanceTo(p.pos);
            const edot  = dir.dot(e.pos.clone().sub(p.pos).normalize());
            if (edist < p.data.range && edot > 0.0) {
              dmgEnemy(e, p.data.dmg);
              e.vel.add(dir.clone().multiplyScalar(12));
              spawnImpact(e.pos.clone().add(new THREE.Vector3(0, 0.8, 0)), 0xaa8800);
            }
          });
          spawnSlash(p.pos.clone(), dir, 0xaa8800, p.data.range * 1.2);
          sfxHeavySlam();

        } else if (p.data.attack === 'spit') {
          // Llama: long-range poison spit projectile
          const spitData = { kind:'slow', dmg:p.data.dmg, color:0x88dd44, id:'llama_spit', poison:true };
          spawnProj(p.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), dir, 11, spitData, 'plant', p.data.range / 11);
          spawnFX(p.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 0x88dd44, 0.2, 0.4);
          sfxShoot(0.25);

        } else if (p.data.attack === 'crow') {
          // Rooster: battle crow — briefly stuns (roots) all enemies in range
          let hit = false;
          gs.enemies.forEach(e => {
            if (e.pos.distanceTo(p.pos) < p.data.range) {
              dmgEnemy(e, p.data.dmg);
              e.rootTimer = Math.max(e.rootTimer || 0, 1.8);
              e.vel.set(0, 0, 0);
              spawnFX(e.pos.clone(), 0xffcc00, 0.35, 0.8);
              hit = true;
            }
          });
          if (hit) {
            spawnFX(p.pos.clone(), 0xffcc00, 0.5, p.data.range * 0.5);
            sfxSwing(0.55);
          }
        }
      }
    }
  });

  // Campfire damage
  gs.defenses.forEach(d => {
    if (d.data.type === 'campfire') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(d.pos) < (d.data.range || 2.5)) { e.hp -= (d.data.dmg || 3) * dt; if (e.hp <= 0) killEnemy(e); } });
    }
    if (d.data.type === 'moat') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(d.pos) < 1.5) e.slowTimer = Math.max(e.slowTimer, 0.1 + dt); });
    }
    if (d.data.type === 'spike') {
      gs.enemies.forEach(e => { if (e.pos.distanceTo(d.pos) < (d.data.range || 1.6)) { e.hp -= (d.data.dmg || 18) * dt; if (e.hp <= 0) killEnemy(e); } });
    }
    if (d.data.type === 'arrowtwr') {
      d.timer -= dt;
      if (d.timer <= 0) {
        let tgt = null, best = d.data.range;
        gs.enemies.forEach(e => { const dist = e.pos.distanceTo(d.pos); if (dist < best) { best = dist; tgt = e; } });
        if (tgt) { dmgEnemy(tgt, d.data.dmg); spawnFX(tgt.pos.clone(), 0xffdd44, 0.25, 0.5); sfxImpact(0.3); d.timer = d.data.cd; }
      }
    }
    if (d.data.type === 'bombtwr') {
      d.timer -= dt;
      if (d.timer <= 0) {
        let tgt = null, best = d.data.range;
        gs.enemies.forEach(e => { const dist = e.pos.distanceTo(d.pos); if (dist < best) { best = dist; tgt = e; } });
        if (tgt) {
          spawnFX(tgt.pos.clone(), 0xff6600, 0.7, 1.8);
          gs.enemies.forEach(e => { if (e.pos.distanceTo(tgt.pos) < (d.data.aoe || 3)) dmgEnemy(e, d.data.dmg); });
          sfxExplosion(0.5);
          d.timer = d.data.cd;
        }
      }
    }
    if (d.data.type === 'tesla') {
      d.timer -= dt;
      if (d.timer <= 0) {
        const inRange = gs.enemies.filter(e => e.pos.distanceTo(d.pos) < d.data.range);
        inRange.sort((a, b) => a.pos.distanceTo(d.pos) - b.pos.distanceTo(d.pos));
        inRange.slice(0, d.data.chains || 4).forEach(e => { dmgEnemy(e, d.data.dmg); spawnFX(e.pos.clone(), 0x88ffff, 0.3, 0.6); });
        if (inRange.length > 0) { sfxZap(); d.timer = d.data.cd; }
      }
    }
  });
}

//  WILD BIRDS
// ═══════════════════════════════════════
function buildWildBirdMesh() {
  const g = new THREE.Group();
  const S = (col) => new THREE.MeshStandardMaterial({color:col, roughness:0.8});
  const colors = [0xaaaaaa, 0x8b5914, 0x22aa33, 0xdddddd, 0xcc6600];
  const col = colors[Math.floor(Math.random() * colors.length)];
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.18,7,6), S(col));
  body.position.set(0, 0, 0); body.castShadow = false; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.10,6,5), S(col));
  head.position.set(0, 0.13, 0.16); g.add(head);
  const w1 = new THREE.Mesh(new THREE.BoxGeometry(0.44,0.04,0.16), S(col));
  w1.position.set( 0.28, 0, 0); w1.rotation.y = -0.2; g.add(w1);
  const w2 = new THREE.Mesh(new THREE.BoxGeometry(0.44,0.04,0.16), S(col));
  w2.position.set(-0.28, 0, 0); w2.rotation.y =  0.2; g.add(w2);
  g._w1 = w1; g._w2 = w2;
  return g;
}

function spawnWildBird() {
  const angle = Math.random() * Math.PI * 2;
  const r = FARM_R * 0.4 + Math.random() * FARM_R * 0.5;
  const height = 9 + Math.random() * 7;
  const mesh = buildWildBirdMesh();
  mesh.position.set(Math.cos(angle) * r, height, Math.sin(angle) * r);
  scene.add(mesh);
  const orbitDir = Math.random() < 0.5 ? 1 : -1;
  gs.wildBirds.push({
    mesh, pos: mesh.position.clone(),
    orbitAngle: angle, orbitR: r, orbitSpd: (0.7 + Math.random() * 0.8) * orbitDir,
    height, bobPhase: Math.random() * Math.PI * 2,
    life: 25 + Math.random() * 35, maxLife: 60,
  });
}

function updateWildBirds(dt) {
  gs.wildBirds = gs.wildBirds.filter(b => {
    b.life -= dt;
    if (b.life <= 0) { scene.remove(b.mesh); return false; }
    b.orbitAngle += b.orbitSpd * dt;
    b.bobPhase += 2.8 * dt;
    b.pos.set(
      Math.cos(b.orbitAngle) * b.orbitR,
      b.height + Math.sin(b.bobPhase) * 0.6,
      Math.sin(b.orbitAngle) * b.orbitR
    );
    b.mesh.position.copy(b.pos);
    b.mesh.rotation.y = -b.orbitAngle + (b.orbitSpd > 0 ? Math.PI/2 : -Math.PI/2);
    // Flap wings
    const flapAmp = 0.28;
    b.mesh._w1.rotation.z = -flapAmp + Math.sin(b.bobPhase * 2.5) * flapAmp;
    b.mesh._w2.rotation.z =  flapAmp - Math.sin(b.bobPhase * 2.5) * flapAmp;
    // Fade out last 5 seconds
    if (b.life < 5) {
      const op = b.life / 5;
      b.mesh.children.forEach(c => { if (c.material) c.material.transparent = true; c.material.opacity = op; });
    }
    return true;
  });
}

function catchWildBird() {
  const playerXZ = new THREE.Vector2(gs.playerPos.x, gs.playerPos.z);
  for (let i = gs.wildBirds.length - 1; i >= 0; i--) {
    const b = gs.wildBirds[i];
    const dist = playerXZ.distanceTo(new THREE.Vector2(b.pos.x, b.pos.z));
    if (dist < 7) {
      const bonus = 15 + Math.floor(Math.random() * 12);
      gs.straw += bonus;
      spawnFX(b.pos.clone(), 0xffee44, 0.5, 1.8);
      scene.remove(b.mesh);
      gs.wildBirds.splice(i, 1);
      showToast('🐦 Caught a bird! +' + bonus + ' straw!');
      return true;
    }
  }
  return false;
}

function updateEffects(dt) {
  gs.effects = gs.effects.filter(ef => {
    ef.timer -= dt;
    const pct = Math.max(0, ef.timer / ef.max);
    if (ef.type === 'spark') {
      ef.vel.y -= 22 * dt;
      ef.mesh.position.add(ef.vel.clone().multiplyScalar(dt));
      ef.mesh.material.opacity = pct;
    } else if (ef.type === 'slash') {
      ef._arc.material.opacity = pct * 0.95;
      ef._arc.scale.setScalar(0.55 + (1 - pct) * 0.9);
      if (ef._flash) ef._flash.material.opacity = pct * 0.8;
    } else if (ef.type === 'beam') {
      ef._core.material.opacity = pct * 0.95;
      ef._glow.material.opacity = pct * 0.5;
      if (ef._flash) ef._flash.material.opacity = pct * 0.95;
    } else if (ef.type === 'trail') {
      if (ef.mesh.material) ef.mesh.material.opacity = pct * 0.72;
    } else if (ef.type === 'shockRing') {
      ef.mesh.scale.setScalar(1 + (1 - pct) * 5.0);
      ef.mesh.material.opacity = pct * 0.85;
    } else {
      // Default spawnFX: orb + expanding rings
      if (ef._orb) { ef._orb.material.opacity = pct; ef._orb.scale.setScalar(0.4 + (1 - pct) * 1.8); }
      if (ef._ring)  { ef._ring.material.opacity  = pct; ef._ring.scale.setScalar(1 + (1 - pct) * 4.5); }
      if (ef._ring2) { ef._ring2.material.opacity = pct * 0.9; ef._ring2.scale.setScalar(1 + (1 - pct) * 7.0); }
      if (ef._ring3) { ef._ring3.material.opacity = pct * 0.55; ef._ring3.scale.setScalar(1 + (1 - pct) * 3.5); }
      if (!ef._orb && ef.mesh && ef.mesh.material) ef.mesh.material.opacity = Math.max(0, pct * 0.7);
    }
    if (ef.type === 'cloud') {
      ef.tickTimer = (ef.tickTimer || 0) - dt;
      if (ef.tickTimer <= 0) {
        ef.tickTimer = 0.5;
        gs.enemies.forEach(e => { if (e.pos.distanceTo(ef.pos) < ef.aoe) { dmgEnemy(e, ef.dmg * 0.5); } });
      }
    }
    if (ef.timer <= 0 && ef.mesh) { scene.remove(ef.mesh); return false; }
    return ef.timer > 0;
  });

  gs.floatingTexts = gs.floatingTexts.filter(ft => {
    ft.timer -= dt; ft.pos.y += dt * 1.5; ft.sp.position.copy(ft.pos);
    ft.sp.material.opacity = ft.timer / 1.4;
    if (ft.timer <= 0) { scene.remove(ft.sp); return false; }
    return true;
  });
}

function buildHotbar() {
  const hb = document.getElementById('hotbar');
  hb.innerHTML = '';
  gs.hotbar.forEach((id, i) => {
    const wd = id ? getActiveData().weapons.find(w => w.id === id) : null;
    const d = document.createElement('div');
    d.className = 'hotslot' + (gs.activeSlot === i ? ' active' : '');
    d.innerHTML = `<span class="sk">${i + 1}</span>${wd ? `<span class="se">${wd.emoji}</span><span class="sn">${wd.name.split(' ')[0]}</span>` : '<span style="color:#444;font-size:20px">—</span>'}`;
    d.onclick = () => setSlot(i);
    hb.appendChild(d);
  });
}

function updateHUD() {
  const pct = gs.playerHP / gs.playerMaxHP;
  document.getElementById('hp-bar').style.width = (pct * 100) + '%';
  document.getElementById('hp-bar').style.background = pct > 0.5 ? '#4CAF50' : pct > 0.25 ? '#ff9800' : '#f44';
  document.getElementById('hp-txt').textContent = Math.ceil(gs.playerHP) + '/' + gs.playerMaxHP;
  document.getElementById('straw-txt').textContent = gs.straw;
  const _semoji = document.getElementById('straw-emoji');
  if (_semoji) _semoji.textContent = getActiveData().resourceEmoji;
  const wi = document.getElementById('wave-info');
  const totalWaves = getActiveData().waves.length;
  wi.textContent = gs.betweenWaves
    ? (gs.wave === 0 ? (isMobile ? 'Tap ▶ START WAVE' : 'Press SPACE to start!') : 'Wave ' + gs.wave + '/' + totalWaves + ' done!')
    : 'Wave ' + gs.wave + '/' + totalWaves + ' — ' + (gs.enemies.length + gs.spawnQueue.length) + ' left';
  const wsb = document.getElementById('wave-start-btn');
  if (wsb) wsb.style.display = (isMobile && gameStarted && gs.betweenWaves) ? 'block' : 'none';
  const bpEl = document.getElementById('barn-prompt');
  if (bpEl) bpEl.style.display = (gameStarted && !barnOpen && gs.playerPos.length() < 6) ? 'block' : 'none';
}

function showToast(msg, dur = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), dur);
}

function showAnimalEliminated(animalData) {
  const el = document.getElementById('wave-ann');
  el.style.color = '#ff6622';
  el.style.textShadow = '0 0 30px #ff4400, 0 0 60px rgba(255,68,0,0.3)';
  el.textContent = animalData.emoji + ' ' + animalData.name + ' Eliminated!';
  el.classList.add('show');
  clearTimeout(el._at);
  el._at = setTimeout(() => {
    el.classList.remove('show');
    el.style.color = '';
    el.style.textShadow = '';
  }, 2800);
  sfxPlayerHurt();
}

function showWaveAnn(txt) {
  const el = document.getElementById('wave-ann');
  el.textContent = txt; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

function toggleShop(forceClose) {
  shopOpen = forceClose ? false : !shopOpen;
  document.getElementById('shop-overlay').classList.toggle('show', shopOpen);
  if (shopOpen) renderShop();
}

function shopTab(tab) {
  currentShopTab = tab;
  document.querySelectorAll('.shop-tab').forEach((el, i) => {
    el.classList.toggle('active', ['weapons', 'plants', 'defenses', 'animals', 'barn', 'army'][i] === tab);
  });
  renderShop();
}

function renderShop() {
  document.getElementById('shop-straw').textContent = gs.straw;
  const _sse = document.getElementById('shop-straw-emoji');
  if (_sse) _sse.textContent = getActiveData().resourceEmoji;
  const _st = document.getElementById('shop-title');
  if (_st) _st.textContent = gs.biome === 'jungle' ? '🌿 Jungle Shop' : gs.biome === 'snow' ? '❄️ Tundra Shop' : '🛒 Farm Shop';
  const c = document.getElementById('shop-content');
  c.innerHTML = '';

  if (currentShopTab === 'army') {
    const bpct = gs._enemyBaseHP / gs._enemyBaseMaxHP;
    const bpctPx = Math.round(bpct * 200);
    const recruitList = gs.recruits.map(id => {
      const u = ARMY_UNITS.find(x => x.id === id);
      return u ? `<span style="background:rgba(255,255,255,0.1);border-radius:6px;padding:2px 8px;margin:2px;display:inline-block">${u.emoji} ${u.name}</span>` : '';
    }).join('');
    c.innerHTML = `

function buyItem(item, tab) {
  if (gs.straw < item.cost) return;
  gs.straw -= item.cost;
  if (tab === 'weapons') {
    gs.ownedWeapons.add(item.id);
    equipWeapon(item.id);
  } else if (tab === 'plants') {
    autoPlacePlant(item);
    toggleShop(true);
  } else if (tab === 'animals') {
    startPlace(item.id);
    toggleShop(true);
  } else if (tab === 'defenses') {
    startPlace(item.id);
    toggleShop(true);
  }
  renderShop(); saveGame();
}

function autoPlacePlant(item) {
  // Pick a random spot on the farm away from the barn center
  let pos, tries = 0;
  do {
    const angle = Math.random() * Math.PI * 2;
    const r = 5 + Math.random() * (FARM_R - 7);
    pos = new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r);
    tries++;
  } while (tries < 20 && gs.placedPlants.some(p => p.pos.distanceTo(pos) < 2.5));

  const g = buildPlantMesh(item);
  if (item.support) {
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.18 }));
    glow.position.y = 0.9; g.add(glow);
  }
  g.position.copy(pos);
  scene.add(g);
  gs.placedPlants.push({ mesh: g, data: item, hp: item.hp, maxHp: item.hp, pos: pos.clone(), timer: 0 });
  showToast(item.name + ' placed on your farm! ' + (item.support ? '💚' : '⚔️'));
  saveGame();
}

function equipWeapon(id) {
  const empty = gs.hotbar.indexOf(null);
  gs.hotbar[empty >= 0 ? empty : gs.activeSlot] = id;

function startPlace(id) {

function buyHealth(amount, cost) {

  if (gs.playerHP >= gs.playerMaxHP) { showToast('You are already full health!'); return; }
  gs.straw -= cost;
  gs.playerHP = Math.min(gs.playerMaxHP, gs.playerHP + amount);
  showToast('❤️ +' + amount + ' HP restored!');
  renderShop(); saveGame();
}

function buyMaxHealth() {

const LAND_COSTS = [150, 300, 500, 750];
const MAX_FARM_EXPANSIONS = 4;

function rebuildFarmGeometry() {
  if (_farmDirt) { scene.remove(_farmDirt); _farmDirt.geometry.dispose(); }
  _farmDirt = new THREE.Mesh(new THREE.CircleGeometry(FARM_R, 64), _farmDirtMat);
  _farmDirt.rotation.x = -Math.PI / 2; _farmDirt.position.y = 0.01; _farmDirt.receiveShadow = true;
  scene.add(_farmDirt);

  _fenceMeshes.forEach(m => scene.remove(m));
  _fenceMeshes.length = 0;
  const pn = Math.round(52 * FARM_R / 42);
  for (let i = 0; i < pn; i++) {
    const a = (i / pn) * Math.PI * 2;
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.1, 0.22), FENCE_MAT);
    post.position.set(Math.cos(a) * FARM_R, 0.55, Math.sin(a) * FARM_R);
    post.castShadow = true; scene.add(post); _fenceMeshes.push(post);
    const a2 = ((i + 1) / pn) * Math.PI * 2;
    const x1 = Math.cos(a) * FARM_R, z1 = Math.sin(a) * FARM_R;
    const x2 = Math.cos(a2) * FARM_R, z2 = Math.sin(a2) * FARM_R;
    const mid = new THREE.Vector3((x1+x2)/2, 0.85, (z1+z2)/2);
    const len = Math.sqrt((x2-x1)**2 + (z2-z1)**2);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.1, 0.1), FENCE_MAT);
    rail.position.copy(mid); rail.rotation.y = -Math.atan2(z2-z1, x2-x1); scene.add(rail); _fenceMeshes.push(rail);
    const rail2 = rail.clone(); rail2.position.y = 0.45; scene.add(rail2); _fenceMeshes.push(rail2);
  }

  if (_pathMesh) { scene.remove(_pathMesh); _pathMesh.geometry.dispose(); }
  _pathMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.4, FARM_R - 6), _pathMat);
  _pathMesh.rotation.x = -Math.PI / 2; _pathMesh.position.set(0, 0.018, (FARM_R - 6) / 2 + 4);
  _pathMesh.receiveShadow = true; scene.add(_pathMesh);
}

function expandFarm() {
  const lvl = gs.farmExpansions;
  if (lvl >= MAX_FARM_EXPANSIONS) return;
  const cost = LAND_COSTS[lvl];
  if (gs.straw < cost) return;
  gs.straw -= cost;
  gs.farmExpansions++;
  FARM_R = 42 + gs.farmExpansions * 8;
  rebuildFarmGeometry();
  showToast('Farm expanded! 🌾 New radius: ' + FARM_R);
  renderShop(); saveGame();
}

function applyBiomeTheme(biome) {
  if (biome === 'jungle') {
    scene.fog.color.setHex(0x1a5520);
    hemiLight.color.setHex(0x44aa22);
    hemiLight.groundColor.setHex(0x2d5e00);
    sun.color.setHex(0xffee88);
    if (window._skyCtx) {
      const ctx = window._skyCtx, c = window._skyCanvas;
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0,    '#020e04');
      g.addColorStop(0.45, '#0a2d10');
      g.addColorStop(0.75, '#154020');
      g.addColorStop(1,    '#225530');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 2, 256);
      window._skyMesh.material.map.needsUpdate = true;
    }
  } else if (biome === 'snow') {
    scene.fog.color.setHex(0x99bbdd);
    hemiLight.color.setHex(0xaaccee);
    hemiLight.groundColor.setHex(0x8899aa);

    if (window._skyCtx) {
      const ctx = window._skyCtx, c = window._skyCanvas;
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0,    '#1a2a40');
      g.addColorStop(0.45, '#3a5575');
      g.addColorStop(0.75, '#6688aa');
      g.addColorStop(1,    '#99bbcc');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 2, 256);
      window._skyMesh.material.map.needsUpdate = true;
    }
  } else {
    scene.fog.color.setHex(0x3a5a78);
    hemiLight.color.setHex(0x6688bb);
    hemiLight.groundColor.setHex(0x336611);
    sun.color.setHex(0xfff0cc);

      const g = ctx.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0,    '#060e22');
      g.addColorStop(0.45, '#0d2a55');

      g.addColorStop(1,    '#2a5080');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 2, 256);
      window._skyMesh.material.map.needsUpdate = true;
    }
  }
}

function loadGame() {

    gs.barnHP = d.barnHP || 200; gs.barnMaxHP = d.barnMaxHP || 200;
    gs.barnCannons = d.barnCannons || 0;
    for (let i = 1; i <= gs.barnCannons; i++) addBarnCannonMesh(i);
    gs.playerHP = d.playerHP || 100; gs.totalKills = d.totalKills || 0;
    gs.ownedWeapons = new Set(d.ownedWeapons || ['carrot']);
    gs.ownedPlaceables = new Set(d.ownedPlaceables || []);
    gs.hotbar = d.hotbar || ['carrot', null, null, null, null];
    gs.farmExpansions = d.farmExpansions || 0;
    FARM_R = 42 + gs.farmExpansions * 8;
    if (gs.farmExpansions > 0) rebuildFarmGeometry();
    // Restore placed plants and animals
    if (d.placedPlants) {
      const ad = getActiveData();
      const allItems = [...ad.placeables, ...ANIMALS];
      d.placedPlants.forEach(s => {
        const data = allItems.find(it => it.id === s.id);
        if (!data) return;
        const g = buildPlantMesh(data);
        if (data.support) {
          const glow = new THREE.Mesh(new THREE.SphereGeometry(0.7,8,8), new THREE.MeshBasicMaterial({color:0x00ff88,transparent:true,opacity:0.18}));
          glow.position.y = 0.9; g.add(glow);

        g.position.copy(pos); scene.add(g);
        gs.placedPlants.push({ mesh: g, data, hp: s.hp, maxHp: data.hp, pos: pos.clone(), timer: 0 });
      });
    }
    // Restore defenses
    if (d.defenses) {
      const ad = getActiveData();
      d.defenses.forEach(s => {
        const data = ad.defenses.find(it => it.id === s.id);
        if (!data) return;
        const g = buildPlantMesh(data);
        const pos = new THREE.Vector3(s.x, 0, s.z);
        g.position.copy(pos); scene.add(g);
        gs.defenses.push({ mesh: g, data, pos: pos.clone(), timer: 0 });

    }
    gs.betweenWaves = true;
    updateBarnRing();
  } catch (e) { console.error('Load error', e); }
}

function recruitUnit(id) {
  const unit = ARMY_UNITS.find(u => u.id === id);
  if (!unit || gs.straw < unit.cost) return;

// Build wedge formation slots for N units.
// Row 0 = tip (front, 1 unit), row 1 = 2 units, etc.
// Cavalry go on outer flanks, heavy melee at tip, ranged at back.
function buildFormationSlots(ids) {
  const ROLE_PRIORITY = { knight:5, warrior:4, cavalry:3, battlemage:2, archer:1, bomber:0 };
  const ROW_GAP = 2.4, COL_GAP = 2.2;
  // Sort: highest priority → front tip
  const sorted = [...ids].sort((a, b) => (ROLE_PRIORITY[b] || 0) - (ROLE_PRIORITY[a] || 0));
  // Special: move cavalry to outermost slots of their row
  const slots = [];
  let placed = 0, row = 0;
  while (placed < sorted.length) {
    const rowSize = Math.min(row + 1, sorted.length - placed, 5);
    for (let c = 0; c < rowSize; c++) {
      slots.push({ x: (c - (rowSize - 1) / 2) * COL_GAP, z: row * ROW_GAP });
    }
    placed += rowSize; row++;
  }
  return { sortedIds: sorted, slots };
}

function sendArmy() {
  if (gs.recruits.length === 0) { showToast('Recruit units first!'); return; }
  if (gs.waveActive) { showToast("Can't send army during a wave!"); return; }
  const { sortedIds, slots } = buildFormationSlots(gs.recruits);
  // Formation center starts just south of barn
  gs._formationCenter = new THREE.Vector3(0, 0, 4);
  sortedIds.forEach((id, i) => {
    const data = ARMY_UNITS.find(u => u.id === id);
    if (!data) return;
    const mesh = buildArmyUnitMesh(data);
    const slot = slots[i];
    const startPos = new THREE.Vector3(
      gs._formationCenter.x + slot.x,
      0,
      gs._formationCenter.z + slot.z
    );
    mesh.position.copy(startPos);
    scene.add(mesh);
    gs.activeArmy.push({
      mesh, data, pos: startPos.clone(),
      hp: data.hp, maxHp: data.hp,
      timer: 0,
      slot,          // offset from formation center
      inCombat: false,
      _bobPhase: Math.random() * Math.PI * 2,
    });
  });
  showToast(`⚔️ Army of ${gs.recruits.length} units advancing in formation!`, 3000);
  gs.recruits = [];
  renderShop();
  saveGame();
}

function updateArmy(dt) {
  const BASE_Z = -95;
  const FORM_SPD = 4.0; // formation advance speed (z units/s)
  const UNIT_STEER = 8.0; // how fast units chase their slot

  if (!gs._formationCenter) gs._formationCenter = new THREE.Vector3(0, 0, 4);

  // Count units in combat
  const combatCount = gs.activeArmy.filter(u => u.inCombat).length;
  // Advance formation center if fewer than half are in combat
  if (gs.activeArmy.length > 0 && combatCount < gs.activeArmy.length * 0.5) {
    gs._formationCenter.z -= FORM_SPD * dt;
    gs._formationCenter.z = Math.max(BASE_Z + 2, gs._formationCenter.z);
  }

  gs.activeArmy = gs.activeArmy.filter(u => {
    if (u.hp <= 0) { scene.remove(u.mesh); return false; }
    u.timer -= dt;
    u._bobPhase += dt;

    // Check for nearby enemies
    const near = gs.enemies.filter(e => Math.hypot(u.pos.x - e.pos.x, u.pos.z - e.pos.z) < u.data.range + 0.8);
    u.inCombat = near.length > 0;

    if (u.inCombat && u.timer <= 0) {
      // Attack
      u.timer = 1.1;
      near.slice(0, u.data.id === 'bomber' ? 3 : 1).forEach(e => {
        dmgEnemy(e, u.data.dmg);
        spawnImpact(e.pos.clone().add(new THREE.Vector3(0, 1, 0)), u.data.color);
      });
      // Face nearest enemy
      const foe = near[0];
      u.mesh.rotation.y = Math.atan2(foe.pos.x - u.pos.x, foe.pos.z - u.pos.z);
      if (u.data.id === 'bomber') {
        spawnFX(u.pos.clone().add(new THREE.Vector3(0, 1, 0)), 0xff8800, 0.6, 2.5);
        sfxExplosion && sfxExplosion(0.5);
        u.hp = 0; return false;
      }
    } else {
      // Steer toward formation slot
      const targetX = gs._formationCenter.x + u.slot.x;
      const targetZ = gs._formationCenter.z + u.slot.z;
      const dx = targetX - u.pos.x, dz = targetZ - u.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > 0.25) {
        const spd = Math.min(u.data.spd, UNIT_STEER) * dt;
        const nx = dx / dist, nz = dz / dist;
        u.pos.x += nx * spd;
        u.pos.z += nz * spd;
        u.mesh.rotation.y = Math.atan2(nx, nz);
      }
      // Cavalry gallop bob
      const yOff = u.data.id === 'cavalry' ? Math.abs(Math.sin(u._bobPhase * 5)) * 0.18 : 0;
      u.mesh.position.set(u.pos.x, yOff, u.pos.z);
    }
    if (!u.inCombat) u.mesh.position.set(u.pos.x, u.mesh.position.y, u.pos.z);

    // Reached enemy base — strike it
    if (u.pos.z < BASE_Z + 10) {
      const dmg = u.data.dmg * (u.data.id === 'bomber' ? 4 : 3);
      gs._enemyBaseHP = Math.max(0, gs._enemyBaseHP - dmg);
      const reward = Math.ceil(dmg * 0.35);
      gs.straw += reward;
      spawnFX(new THREE.Vector3(u.pos.x, 3, BASE_Z + 4), 0xff2200, 1.2, 3.0);
      showToast(`💥 Base hit for ${dmg}! +${reward} straw`, 2000);
      if (gs._enemyBaseHP <= 0) {
        gs._enemyBaseHP = gs._enemyBaseMaxHP;
        gs.straw += 150;
        showToast('🏆 Enemy Base DESTROYED! +150 straw!', 5000);
        spawnFX(new THREE.Vector3(0, 5, BASE_Z), 0xff4400, 3.0, 5.0);
      }
      scene.remove(u.mesh); return false;
    }
    // Splash damage from nearby enemies
    gs.enemies.forEach(e => {
      if (Math.hypot(u.pos.x - e.pos.x, u.pos.z - e.pos.z) < 1.8) u.hp -= e.data.dmg * 0.3 * dt;
    });
    return true;
  });
  // Enemy base animations
  if (enemyBaseGrp) {
    const t = Date.now() * 0.003;
    enemyBaseGrp.children.forEach(c => {
      if (!c.material) return;
      if (c._isEye) c.material.emissiveIntensity = 2.0 + Math.sin(t * 1.3) * 1.0;
      if (c._isTorchFlame) {
        const flicker = 2.2 + Math.sin(t * 7 + c.position.x) * 0.8 + Math.sin(t * 11.3 + c.position.z) * 0.4;
        c.material.emissiveIntensity = flicker;
        c.scale.set(1 + Math.sin(t*9+c.position.x)*0.12, 1 + Math.sin(t*13)*0.15, 1 + Math.sin(t*9+c.position.z)*0.12);
      }
      if (c._isSmokeCloud) {
        c.position.y += 0.005;
        if (c.position.y > 14) c.position.y = 10;
        c.material.opacity = Math.max(0, 0.25 + Math.sin(t*0.5+c.position.x)*0.15);
        if (!c.material.transparent) c.material.transparent = true;
      }
    });
  }
}

//  GAME LOOP

let lastT = 0;
function loop(ts) {
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;

  if (gameStarted) {
    updatePlayer(dt);
    attackCd = Math.max(0, attackCd - dt);

    if (gs.waveActive) {
      gs.spawnTimer -= dt;
      if (gs.spawnTimer <= 0 && gs.spawnQueue.length > 0) {
        gs.spawnTimer = 0.8 + Math.random() * 0.5;
        spawnEnemy(gs.spawnQueue.shift());
      }
      updateEnemies(dt);
      checkWaveEnd();
      // Barn cannon auto-fire
      if (gs.barnCannons > 0) {
        gs._barnCannonTimer -= dt;
        if (gs._barnCannonTimer <= 0) {
          gs._barnCannonTimer = Math.max(0.9, 2.8 - gs.barnCannons * 0.5);
          const bOrigin = new THREE.Vector3(0, 3, 0);
          const cannonRange = 12 + gs.barnCannons * 3;
          const near = gs.enemies.filter(e => e.pos.length() < cannonRange).sort((a,b) => a.pos.length()-b.pos.length())[0];
          if (near) {
            const cdir = near.pos.clone().sub(bOrigin).setY(0).normalize();
            spawnProj(bOrigin.clone(), cdir, 14, {kind:'heavy', dmg: 28 + gs.barnCannons * 12, color:0xff6600}, 'plant', 1.0);
            spawnFX(bOrigin.clone(), 0xff6600, 0.18, 0.6);
            sfxExplosion(0.25);
          }
        }
      }
    }
    updateProjectiles(dt);
    updatePlacedPlants(dt);
    updateEffects(dt);
    updateEventSystem(dt);
    // Wild birds
    updateWildBirds(dt);
    gs._wildBirdTimer -= dt;
    if (gs._wildBirdTimer <= 0 && gs.wildBirds.length < 4) {
      gs._wildBirdTimer = 18 + Math.random() * 22;
      spawnWildBird();
    }
    updateArmy(dt);

    // Camera follows player
    camera.position.lerp(gs.playerPos.clone().add(CAM_OFF.clone().multiplyScalar(camZoom)), 0.06);
    camera.lookAt(gs.playerPos);
    updateHUD();
  }

  // Drift clouds slowly
  scene.children.forEach(c => { if (c._isCloud) { c.position.x += 0.4 * dt; if (c.position.x > 50) c.position.x = -50; } });
  // Spin windmill blades
  if (windmillBlades) windmillBlades.rotation.z += dt * 0.7;
  // Sway plants gently in the wind
  const t = Date.now() * 0.001;
  gs.placedPlants.forEach((p, i) => {
    if (!p.mesh) return;
    if (!p._swayPh)  p._swayPh  = i * 2.4 + Math.random() * 1.8;
    if (!p._swaySpd) p._swaySpd = 0.6 + (i % 5) * 0.16;
    const sp = p._swaySpd, ph = p._swayPh;
    p.mesh.rotation.z = Math.sin(t * sp + ph) * 0.15 + Math.sin(t * sp * 2.2 + ph + 1.3) * 0.05;
    p.mesh.rotation.x = Math.cos(t * sp * 0.87 + ph + 1.0) * 0.1 + Math.sin(t * sp * 1.7 + ph + 0.6) * 0.03;
  });

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

    [N.E5,e8],[N.D5,e8],[N.C5,e8],[N.B4,e8],[N.C5,e8],[N.D5,e8],[N.E5,e8],[N.G5,e8],   // bar 5
    [N.D5,q],[N.G5,q],[N.E5,q],[N.D5,q],                                                 // bar 6
    [N.C5,e8],[N.B4,e8],[N.A4,e8],[N.G4,e8],[N.A4,e8],[N.B4,e8],[N.C5,e8],[N.D5,e8],   // bar 7
    [N.G4,w],                                                                             // bar 8
  ];
  const bassLine = [ [N.G3,w],[N.C4,w],[N.G3,w],[N.D4,w],[N.A3,w],[N.G3,w],[N.C4,w],[N.G3,w] ];
  const chords = [
    [[N.G4,N.B4,N.D5],[N.G4,N.B4,N.D5]],
    [[N.C5,N.E5,N.G5],[N.C5,N.E5,N.G5]],
    [[N.G4,N.B4,N.D5],[N.G4,N.B4,N.D5]],
    [[N.D5,N.Fs5,N.A4],[N.D5,N.Fs5,N.A4]],
    [[N.A4,N.C5,N.E5],[N.A4,N.C5,N.E5]],
    [[N.G4,N.B4,N.D5],[N.G4,N.B4,N.D5]],
    [[N.C5,N.E5,N.G5],[N.C5,N.E5,N.G5]],
    [[N.G4,N.B4,N.D5],[N.G4,N.B4,N.D5]],
  ];

  let mt = t0; melody.forEach(([f,d]) => { pluck(f, mt, d); mt += d; });
  let bt = t0; bassLine.forEach(([f,d]) => { bass(f, bt, d); bt += d; });
  for (let bar = 0; bar < 8; bar++) {
    chords[bar].forEach((ch, i) => chordStrum(ch, t0 + bar * w + i * h));
  }
  for (let beat = 0; beat < 32; beat++) {
    const bt2 = t0 + beat * q;
    if (beat % 4 === 0 || beat % 4 === 2) kick(bt2);
    if (beat % 4 === 1 || beat % 4 === 3) snare(bt2);
    hihat(bt2); hihat(bt2 + e8);
  }
  return t0 + w * 8;
}
