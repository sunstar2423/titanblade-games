<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' stun:stun.l.google.com:19302; worker-src blob:; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <title>Stick Wars</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 100;
        }

        #gameInfo {
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #multiplayerMenu {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            color: white;
        }

        #multiplayerMenu button {
            margin: 5px;
            padding: 8px 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        #multiplayerMenu button:hover {
            background: #45a049;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }

        /* Mobile Touch Controls */
        .mobile-controls {
            display: none;
            position: absolute;
            pointer-events: none;
        }

        @media (max-width: 768px), (pointer: coarse) {
            .mobile-controls {
                display: block;
            }

            #controls {
                display: none;
            }
        }

        /* Virtual Joystick */
        #joystick-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            pointer-events: auto;
        }

        #joystick-base {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
        }

        #joystick-stick {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.8);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }

        /* Attack Button */
        #attack-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 50, 50, 0.7);
            border: 4px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            pointer-events: auto;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #attack-button:active {
            background: rgba(255, 100, 100, 0.9);
            transform: scale(0.95);
        }

        /* Look/Aim Touch Area */
        #look-area {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
        }

        /* Mobile UI adjustments */
        @media (max-width: 768px), (pointer: coarse) {
            #weaponBar {
                bottom: 120px;
                right: 10px;
                gap: 5px;
            }

            .weapon-slot {
                width: 40px;
                height: 40px;
                font-size: 14px;
            }

            #gameInfo {
                font-size: 12px;
                padding: 8px;
            }

            #multiplayerMenu {
                display: none;
            }
        }

        #weaponBar {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
        }

        .weapon-slot {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #666;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .weapon-slot.active {
            border-color: #4CAF50;
            background: rgba(76,175,80,0.3);
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            pointer-events: none;
            z-index: 50;
        }

        .crosshair-line {
            position: absolute;
            background: white;
        }

        .crosshair-h {
            width: 20px;
            height: 2px;
            top: 9px;
        }

        .crosshair-v {
            width: 2px;
            height: 20px;
            left: 9px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="crosshair">
            <div class="crosshair-line crosshair-h"></div>
            <div class="crosshair-line crosshair-v"></div>
        </div>

        <div id="ui">
            <div id="gameInfo">
                <div>Health: <span id="healthValue">3000</span>/3000</div>
                <div>Weapon: <span id="currentWeapon">Sword</span></div>
                <div>Wave: <span id="waveNumber">1/5</span></div>
                <div>Enemies: <span id="enemyCount">5</span></div>
                <div>Coins: <span id="coinCount">0</span></div>
            </div>
        </div>

        <div id="multiplayerMenu">
            <h4>Multiplayer</h4>
            <button onclick="startLocalMultiplayer()">Local 2P</button>
            <button onclick="createOnlineGame()">Create Online</button>
            <button onclick="joinOnlineGame()">Join Online</button>
        </div>

        <div id="weaponBar">
            <div class="weapon-slot active" data-weapon="0" onclick="switchWeapon(0)">
                <span>1</span>
            </div>
            <div class="weapon-slot" data-weapon="1" onclick="switchWeapon(1)">
                <span>2</span>
            </div>
            <div class="weapon-slot" data-weapon="2" onclick="switchWeapon(2)">
                <span>3</span>
            </div>
            <div class="weapon-slot" data-weapon="3" onclick="switchWeapon(3)">
                <span>4</span>
            </div>
            <div class="weapon-slot" data-weapon="4" onclick="switchWeapon(4)">
                <span>5</span>
            </div>
            <div class="weapon-slot" data-weapon="5" onclick="switchWeapon(5)" style="opacity: 0.3;">
                <span>6</span>
            </div>
            <div class="weapon-slot" data-weapon="6" onclick="switchWeapon(6)" style="opacity: 0.3;">
                <span>7</span>
            </div>
        </div>

        <div id="controls">
            <strong>Controls:</strong><br>
            WASD: Move | Mouse: Look Around | Click: Attack<br>
            1-7: Switch Weapons | R: Reload | C: Toggle Camera | ESC: Release mouse
        </div>

        <!-- Mobile Touch Controls -->
        <div class="mobile-controls">
            <!-- Virtual Joystick -->
            <div id="joystick-container">
                <div id="joystick-base"></div>
                <div id="joystick-stick"></div>
            </div>

            <!-- Attack Button -->
            <div id="attack-button">⚔️</div>

            <!-- Look/Aim Touch Area -->
            <div id="look-area"></div>
        </div>
    </div>

    <script src="js/libs/three.min.js"></script>
    <script src="js/stickman-wars/Environment.js"></script>
    <script src="js/stickman-wars/Arrow.js"></script>
    <script src="js/stickman-wars/Bomb.js"></script>
    <script src="js/stickman-wars/Game3D.js"></script>
    <script src="js/stickman-wars/StickFigure.js"></script>
    <script src="js/stickman-wars/Weapon.js"></script>
    <script src="js/stickman-wars/Combat.js"></script>
    <script src="js/stickman-wars/Multiplayer.js"></script>

    <script>
        // Global game instance
        let game;
        let multiplayerManager;

        // Mobile Touch Controls
        const touchControls = {
            joystick: {
                active: false,
                touchId: null,
                startX: 0,
                startY: 0,
                currentX: 0,
                currentY: 0,
                deltaX: 0,
                deltaY: 0
            },
            look: {
                active: false,
                touchId: null,
                lastX: 0,
                lastY: 0
            },
            attack: {
                active: false
            }
        };

        // Initialize Mobile Touch Controls
        function initTouchControls() {
            const joystickContainer = document.getElementById('joystick-container');
            const joystickStick = document.getElementById('joystick-stick');
            const attackButton = document.getElementById('attack-button');
            const lookArea = document.getElementById('look-area');

            if (!joystickContainer || !attackButton || !lookArea) {
                console.log('Touch controls not found (probably desktop)');
                return;
            }

            // Joystick Controls
            joystickContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = joystickContainer.getBoundingClientRect();

                touchControls.joystick.active = true;
                touchControls.joystick.touchId = touch.identifier;
                touchControls.joystick.startX = rect.left + rect.width / 2;
                touchControls.joystick.startY = rect.top + rect.height / 2;
                touchControls.joystick.currentX = touch.clientX;
                touchControls.joystick.currentY = touch.clientY;

                updateJoystickPosition();
            });

            joystickContainer.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!touchControls.joystick.active) return;

                const touch = Array.from(e.touches).find(t => t.identifier === touchControls.joystick.touchId);
                if (!touch) return;

                touchControls.joystick.currentX = touch.clientX;
                touchControls.joystick.currentY = touch.clientY;

                updateJoystickPosition();
            });

            joystickContainer.addEventListener('touchend', (e) => {
                e.preventDefault();
                touchControls.joystick.active = false;
                touchControls.joystick.deltaX = 0;
                touchControls.joystick.deltaY = 0;

                // Reset joystick position
                joystickStick.style.transform = 'translate(-50%, -50%)';

                // Clear movement keys
                if (game) {
                    game.keys['KeyW'] = false;
                    game.keys['KeyS'] = false;
                    game.keys['KeyA'] = false;
                    game.keys['KeyD'] = false;
                }
            });

            function updateJoystickPosition() {
                const deltaX = touchControls.joystick.currentX - touchControls.joystick.startX;
                const deltaY = touchControls.joystick.currentY - touchControls.joystick.startY;

                const maxDistance = 45; // Max distance from center
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                let finalX = deltaX;
                let finalY = deltaY;

                if (distance > maxDistance) {
                    const angle = Math.atan2(deltaY, deltaX);
                    finalX = Math.cos(angle) * maxDistance;
                    finalY = Math.sin(angle) * maxDistance;
                }

                // Update visual position
                joystickStick.style.transform = `translate(calc(-50% + ${finalX}px), calc(-50% + ${finalY}px))`;

                // Normalize to -1 to 1 range
                touchControls.joystick.deltaX = finalX / maxDistance;
                touchControls.joystick.deltaY = finalY / maxDistance;

                // Map to WASD keys
                if (game) {
                    const threshold = 0.3;
                    game.keys['KeyW'] = touchControls.joystick.deltaY < -threshold;
                    game.keys['KeyS'] = touchControls.joystick.deltaY > threshold;
                    game.keys['KeyA'] = touchControls.joystick.deltaX < -threshold;
                    game.keys['KeyD'] = touchControls.joystick.deltaX > threshold;
                }
            }

            // Look/Aim Controls
            lookArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];

                touchControls.look.active = true;
                touchControls.look.touchId = touch.identifier;
                touchControls.look.lastX = touch.clientX;
                touchControls.look.lastY = touch.clientY;
            });

            lookArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!touchControls.look.active) return;

                const touch = Array.from(e.touches).find(t => t.identifier === touchControls.look.touchId);
                if (!touch) return;

                const deltaX = touch.clientX - touchControls.look.lastX;
                const deltaY = touch.clientY - touchControls.look.lastY;

                touchControls.look.lastX = touch.clientX;
                touchControls.look.lastY = touch.clientY;

                // Apply camera rotation (similar to mouse move)
                if (game && game.currentPlayer) {
                    const sensitivity = 0.003;

                    if (game.cameraMode === 'third') {
                        // Third person: rotate player and camera around player
                        game.currentPlayer.group.rotation.y -= deltaX * sensitivity;

                        // Vertical look (camera pitch)
                        game.camera.rotation.x -= deltaY * sensitivity;
                        game.camera.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, game.camera.rotation.x));
                    } else {
                        // First person: standard first person controls
                        game.currentPlayer.rotate(
                            -deltaX * sensitivity,
                            -deltaY * sensitivity
                        );
                    }
                }
            });

            lookArea.addEventListener('touchend', (e) => {
                e.preventDefault();
                touchControls.look.active = false;
            });

            // Attack Button
            attackButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchControls.attack.active = true;

                if (game && game.currentPlayer) {
                    game.currentPlayer.attack(game);
                }
            });

            attackButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                touchControls.attack.active = false;
            });

            console.log('Touch controls initialized');
        }

        // Initialize the game
        function initGame() {
            try {
                console.log('Initializing game...');
                game = new Game3D();
                game.init();
                console.log('Game initialized successfully');

                multiplayerManager = new MultiplayerManager(game);
                console.log('Multiplayer manager initialized');

                // Initialize touch controls for mobile devices
                initTouchControls();
            } catch (error) {
                console.error('Error initializing game:', error);
                document.getElementById('gameInfo').innerHTML = '<div style="color: red;">Error: ' + error.message + '</div>';
            }

            // Add ESC key handler to release pointer lock
            document.addEventListener('keydown', (event) => {
                if (event.code === 'Escape') {
                    if (document.pointerLockElement) {
                        document.exitPointerLock();
                    }
                }
            });
        }

        // UI Functions
        function switchWeapon(index) {
            if (game && game.currentPlayer) {
                game.currentPlayer.switchWeapon(index);

                // Update UI
                document.querySelectorAll('.weapon-slot').forEach(slot => {
                    slot.classList.remove('active');
                });
                document.querySelector(`[data-weapon="${index}"]`).classList.add('active');
            }
        }

        function updateEnemyCount() {
            if (!game) return;
            const aliveEnemies = game.enemies.filter(enemy => enemy.health > 0).length;
            document.getElementById('enemyCount').textContent = aliveEnemies;
        }

        // Multiplayer Functions
        function startLocalMultiplayer() {
            multiplayerManager.enableLocalMultiplayer();

            // Update UI to show both players
            const gameInfo = document.getElementById('gameInfo');
            gameInfo.innerHTML += '<div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #666;">Player 2 Controls: Arrow Keys + NumPad</div>';
        }

        function createOnlineGame() {
            multiplayerManager.createOnlineGame();
        }

        function joinOnlineGame() {
            const offerString = prompt('Paste the connection string from the host:');
            if (offerString) {
                multiplayerManager.joinOnlineGame(offerString);
            }
        }

        // Game loop additions
        function gameUpdate() {
            if (game) {
                updateEnemyCount();

                // Check lose condition only (victory is handled by wave system in Game3D.js)
                if (game.currentPlayer && game.currentPlayer.health <= 0) {
                    showDefeatMessage();
                }
            }

            requestAnimationFrame(gameUpdate);
        }

        let gameOverShown = false;

        function showDefeatMessage() {
            if (gameOverShown) return;
            gameOverShown = true;

            const message = document.createElement('div');
            message.style.position = 'absolute';
            message.style.top = '50%';
            message.style.left = '50%';
            message.style.transform = 'translate(-50%, -50%)';
            message.style.backgroundColor = 'rgba(128,0,0,0.9)';
            message.style.color = 'white';
            message.style.padding = '30px';
            message.style.borderRadius = '10px';
            message.style.fontSize = '24px';
            message.style.zIndex = '1000';
            message.style.textAlign = 'center';

            const title = document.createElement('h2');
            title.textContent = 'Defeated!';
            title.style.margin = '0 0 10px 0';
            message.appendChild(title);

            const text = document.createElement('p');
            text.textContent = 'Better luck next time!';
            text.style.margin = '0 0 20px 0';
            message.appendChild(text);

            const button = document.createElement('button');
            button.textContent = 'Try Again';
            button.style.padding = '10px 20px';
            button.style.fontSize = '18px';
            button.style.backgroundColor = '#f44336';
            button.style.color = 'white';
            button.style.border = 'none';
            button.style.borderRadius = '5px';
            button.style.cursor = 'pointer';
            button.onclick = () => location.reload();
            message.appendChild(button);

            document.body.appendChild(message);
        }

        // Start the game
        initGame();
        gameUpdate();
    </script>
</body>
</html>
