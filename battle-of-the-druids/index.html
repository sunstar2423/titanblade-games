    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{GOOGLE_ANALYTICS_ID}}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{GOOGLE_ANALYTICS_ID}}', {
            page_title: 'Battle of the Druids',
            custom_map: {'custom_parameter': 'game_events'}
        });
        
        // Game-specific event tracking
        function trackGameEvent(action, category = 'Game') {
            gtag('event', action, {
                event_category: category,
                event_label: 'Battle of the Druids'
            });
        }
        
        // Make tracking function available globally
        window.trackGameEvent = trackGameEvent;
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: auto;
            /* Mobile optimizations */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        /* Mobile: Use full viewport height when ads are hidden */
        @media (max-width: 768px) {
            body {
                min-height: 100vh;
                align-items: flex-start;
                padding-top: 10px;
            }
        }
        
        #game-container {
            border: 3px solid #34495e;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            background: #000;
            max-width: 95vw;
            max-height: 95vh;
            min-height: 600px;
        }
        
        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            /* Hide ad spaces on mobile to save screen space */
            #ad-top, #ad-bottom {
                display: none !important;
            }
            
            body {
                padding: 0;
                margin: 0;
                overflow: auto;
                touch-action: pan-x pan-y pinch-zoom;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
            }
            
            #game-container {
                border: 1px solid #34495e;
                border-radius: 6px;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
                max-width: 100vw;
                max-height: none;
                min-height: 600px;
                width: 100%;
                margin: 0;
                touch-action: pan-x pan-y pinch-zoom;
                overflow: auto;
            }
            
            /* Allow zoom/scroll on game canvas */
            #game-container canvas {
                touch-action: auto !important;
                pointer-events: auto;
            }
            
            .game-info {
                font-size: 12px !important;
                margin-top: 10px !important;
            }
            
            .controls {
                font-size: 10px !important;
            }
        }
        
        /* Tablet adjustments - smaller ads */
        @media (min-width: 769px) and (max-width: 1024px) {
            #ad-top, #ad-bottom {
                width: 468px !important;
                height: 60px !important;
                font-size: 12px;
            }
        }
        
        .loading {
            color: white;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
        }
        
        .game-info {
            color: white;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            max-width: 1400px;
        }
        
        .controls {
            color: #bdc3c7;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>

    <script>
        Sentry.init({
            dsn: "https://5752f76100bc0ed5d17444652339d50f@o4509524111523840.ingest.us.sentry.io/4509524122075136",
