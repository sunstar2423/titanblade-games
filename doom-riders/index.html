<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.5, user-scalable=yes, shrink-to-fit=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src blob:; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <title>Doom Riders - TitanBlade Games</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: auto;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch;
        }
        
        #game-container {
            border: 3px solid #444;
            border-radius: 10px;
            overflow: visible;
            margin: 20px;
            position: relative;
            background: #000;
        }
        
        /* Mobile-specific touch handling */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                touch-action: pan-x pan-y pinch-zoom;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
            }
            
            #game-container {
                touch-action: pan-x pan-y pinch-zoom;
                overflow: auto;
                border: 1px solid #444;
                margin: 5px;
                max-width: 100vw;
                position: relative;
            }
            
            #game-container canvas {
                touch-action: auto !important;
                pointer-events: auto;
                max-width: 100% !important;
                height: auto !important;
            }
            
            #ui-overlay {
                top: 5px;
                left: 5px;
                right: 5px;
            }
            
            .ui-element {
                padding: 4px 8px;
                font-size: 12px;
                margin-bottom: 3px;
            }
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            touch-action: auto !important;
            pointer-events: auto !important;
            -webkit-touch-callout: default !important;
            -webkit-user-select: auto !important;
        }
        
        #game-container, #game-container > * {
            touch-action: auto !important;
        }
        
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            pointer-events: none;
        }
        
        .ui-element {
            background: rgba(0, 0, 0, 0.8);
            color: #FFD700;
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 5px;
            font-weight: bold;
            pointer-events: auto;
        }
        
        #score {
            float: left;
        }
        
        #speed {
            float: right;
        }
        
        #money {
            clear: both;
            float: left;
            color: #00FF00;
        }
        
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay" class="clearfix">
            <div id="score" class="ui-element">Score: 0</div>
            <div id="speed" class="ui-element">Speed: 0</div>
            <div id="money" class="ui-element">Money: $0</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <!-- Sentry temporarily removed for debugging -->
    
    <!-- Mobile touch gesture handling -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function enableTouchGestures() {
                const elements = ['body', '#game-container', 'canvas'];
                elements.forEach(selector => {
                    const el = document.querySelector(selector);
                    if (el) {
                        el.style.touchAction = 'auto';
                        el.style.pointerEvents = 'auto';
                        el.style.webkitTouchCallout = 'default';
                        el.style.webkitUserSelect = 'auto';
                    }
                });
                
                const observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.addedNodes) {
                            mutation.addedNodes.forEach(function(node) {
                                if (node.tagName === 'CANVAS') {
                                    node.style.touchAction = 'auto';
                                    node.style.pointerEvents = 'auto';
                                    console.log('Doom Riders canvas configured for mobile touch');
                                }
                            });
                        }
                    });
                });
                
                observer.observe(document.body, {
                    childList: true,
                    subtree: true
                });
            }
            
            enableTouchGestures();
            setTimeout(enableTouchGestures, 1000);
            setTimeout(enableTouchGestures, 3000);
        });
    </script>
    
    <script type="module" src="js/Game.js"></script>
</body>
</html>
