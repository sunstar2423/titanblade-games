<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Money System Fix</title>
</head>
<body>
    <h1>Money System Test</h1>
    <p>Open console to see test results</p>
    
    <button onclick="testSaveLoad()">Test Save/Load</button>
    <button onclick="clearStorage()">Clear Storage</button>
    
    <script>
        function testSaveLoad() {
            console.log('=== TESTING MONEY SAVE/LOAD ===');
            
            // Test saving money
            const testMoney = 1500;
            localStorage.setItem('doomRidersMoney', testMoney.toString());
            console.log(`Saved ${testMoney} to localStorage`);
            
            // Test loading money
            const loadedMoney = localStorage.getItem('doomRidersMoney');
            const parsedMoney = loadedMoney ? parseInt(loadedMoney) : 0;
            console.log(`Loaded ${parsedMoney} from localStorage`);
            
            if (parsedMoney === testMoney) {
                console.log('✅ Save/Load test PASSED');
            } else {
                console.log('❌ Save/Load test FAILED');
            }
            
            // Test the parsing logic used in Game.js
            const safeMoney = isNaN(parsedMoney) ? 0 : parsedMoney;
            console.log(`Safe money value: ${safeMoney}`);
            
            console.log('=== TEST COMPLETED ===');
        }
        
        function clearStorage() {
            localStorage.removeItem('doomRidersMoney');
            localStorage.removeItem('doomRidersHighScore');
            console.log('localStorage cleared');
        }
        
        // Run test automatically
        testSaveLoad();
    </script>
</body>
</html>
