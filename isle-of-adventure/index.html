<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, shrink-to-fit=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://cdn.jsdelivr.net https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; worker-src blob:; frame-ancestors 'none';">
    <!-- X-Content-Type-Options and Permissions-Policy are response-header-only
         directives (set by the hosting layer); browsers ignore them as meta tags. -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Isle of Adventure</title>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{GOOGLE_ANALYTICS_ID}}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{GOOGLE_ANALYTICS_ID}}', {
            page_title: 'Isle of Adventure',
            custom_map: {'custom_parameter': 'game_events'}
        });
        
        // Game-specific event tracking
        function trackGameEvent(action, category = 'Game') {
            gtag('event', action, {
                event_category: category,
                event_label: 'Isle of Adventure'
            });
        }
        
        // Make tracking function available globally
        window.trackGameEvent = trackGameEvent;
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: auto;
            /* Mobile optimizations */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #game-container {
            border: 2px solid #333;
            border-radius: 10px;
            overflow: visible;
            margin: 20px;
            position: relative;
        }
        
        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            body {
                padding: 0;
                margin: 0;
                overflow: auto;
                touch-action: pan-x pan-y pinch-zoom;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
            }
            
            #game-container {
                border: 1px solid #333;
                border-radius: 6px;
                max-width: 100vw;
                max-height: none;
                width: 100%;
                margin: 10px;
                touch-action: pan-x pan-y pinch-zoom;
                overflow: auto;
            }
            
            /* Allow zoom/scroll on game canvas */
            #game-container canvas {
                touch-action: auto !important;
                pointer-events: auto;
            }
        }
        
        #inventory {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            max-width: 200px;
            font-size: 12px;
            display: none;
        }
        #audio-toggle {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid #FFD700;
            border-radius: 6px;
            width: 40px;
            height: 40px;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            transition: background 0.15s ease;
        }
        #audio-toggle:hover {
            background: rgba(40, 40, 40, 0.9);
        }
        #inventory h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
        }
        #inventory-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #inventory-list li {
            margin: 2px 0;
        }
        #music-credits {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #ccc;
            padding: 5px;
            border-radius: 3px;
            font-size: 10px;
            max-width: 300px;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <button id="audio-toggle" type="button" aria-label="Mute audio" aria-pressed="false">🔊</button>
        <div id="inventory">
            <h3>Inventory</h3>
            <ul id="inventory-list"></ul>
        </div>
        <div id="music-credits">
            Music: "Serene Journey" &amp; "Run to the Dream" by Lite Saturation (Free Music Archive, CC BY-ND)
        </div>
    </div>

    <!-- Sentry SDK -->
    <script src="https://browser.sentry-cdn.com/8.42.0/bundle.min.js" integrity="sha384-ojBBhiQvhkfZfAhojXYPuIYW8dxzV1I8R7YJlq9Tz7T4YOZQcTuUoCgGbCz5lWAE" crossorigin="anonymous"></script>
    <script>
        // Guard: Sentry's CDN may be blocked (adblockers, offline) — don't crash the page.
        if (typeof Sentry !== 'undefined') {
        Sentry.init({
            dsn: "https://5752f76100bc0ed5d17444652339d50f@o4509524111523840.ingest.us.sentry.io/4509524122075136",
            integrations: [
                Sentry.browserTracingIntegration(),
                Sentry.replayIntegration({
                    maskAllText: true,
                    blockAllMedia: true,
                }),
            ],
            environment: "production",
            release: "isle-of-adventure@1.0.0",
            tracesSampleRate: 0.1,
            replaysSessionSampleRate: 0.05,
            replaysOnErrorSampleRate: 1.0,
        });
        
        // Custom Sentry context for game
        Sentry.setTag("game", "isle-of-adventure");
        Sentry.setContext("game_info", {
            version: "web-1.0.0",
            platform: "browser",
            engine: "phaser3",
            genre: "point-and-click-adventure"
        });
        } // end Sentry guard
        
        // Game event tracking utilities
        window.trackGameEvent = function(eventName, data = {}) {
            console.log(`🎮 Game Event: ${eventName}`, data);
            
            // Send to Google Analytics if available
            if (typeof gtag !== 'undefined') {
                gtag('event', eventName, {
                    event_category: 'Game',
                    event_label: 'Isle of Adventure',
                    ...data
                });
            }
            
            // Send to Sentry as breadcrumb
            if (typeof Sentry !== 'undefined') {
                Sentry.addBreadcrumb({
                    message: eventName,
                    category: 'game_event',
                    data: data,
                    level: 'info'
                });
            }
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    
    <script type="module" src="js/Game.js"></script>
</body>
</html>
